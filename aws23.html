<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CLF Practice Exams</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: single study column — exam tabs + score strip, then one card per question with lettered options and a reveal panel */
:root{
  --bg:#f5f7f8; --surface:#ffffff; --ink:#18232b; --muted:#5b6b75; --line:#dbe3e7;
  --accent:#0f7c86; --accent-soft:#e1f1f2;
  --ok:#1f7a3e; --ok-soft:#e3f3e8; --bad:#b3261e; --bad-soft:#fbe7e5; --note:#8a4b12; --note-soft:#fbefe2;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181c; --surface:#182227; --ink:#e4ecef; --muted:#93a4ad; --line:#2a383f;
  --accent:#4cc3cc; --accent-soft:#163a3e;
  --ok:#6fd38f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1c1a; --note:#e2a868; --note-soft:#2e2318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181c; --surface:#182227; --ink:#e4ecef; --muted:#93a4ad; --line:#2a383f;
  --accent:#4cc3cc; --accent-soft:#163a3e;
  --ok:#6fd38f; --ok-soft:#173523; --bad:#ff8a80; --bad-soft:#3d1c1a; --note:#e2a868; --note-soft:#2e2318; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;max-width:65ch}
.controls{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%}
.seg button{font:inherit;font-size:.85rem;padding:6px 14px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
#examSeg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));width:100%;gap:1px;background:var(--line)}
#examSeg button{border:0;padding:7px 4px}
#examSeg button+button{border-left:0}
#examSeg button.allb{grid-column:span 2}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.stats .good b{color:var(--ok)} .stats .wrong b{color:var(--bad)}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.track span{height:100%;transition:width .25s}
.track .t-ok{background:var(--ok)} .track .t-bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){.track span{transition:none}}
.btn{font:inherit;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.reset{margin-left:auto}
.confirm{font-size:.85rem;color:var(--bad);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.qnum{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--accent)}
.multi{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--note);background:var(--note-soft);padding:1px 7px;border-radius:4px}
.state{margin-left:auto;font-size:.78rem;font-weight:600}
.state.ok{color:var(--ok)} .state.bad{color:var(--bad)}
.qtext{margin:0;font-weight:500;font-size:1rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.letter{font-family:var(--f-mono);font-weight:600;font-size:.82rem;min-width:1.6em;height:1.6em;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);flex:none;margin-top:1px}
.opt .t{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .letter{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .letter{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrongpick .letter{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.link{font:inherit;font-size:.82rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.hint{font-size:.82rem;color:var(--muted)}
.exp{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.exp .ans{font-weight:600;font-size:.88rem}
.exp p{margin:0;max-width:68ch}
.tr{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.tr .lbl{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tr li{display:flex;gap:8px;font-size:.92rem;color:var(--muted)}
.tr li b{font-family:var(--f-mono);font-size:.8rem;min-width:1.2em}
.tr li.ok{color:var(--ok);font-weight:600}
.empty{padding:30px 0;color:var(--muted)}
</style>

<div class="wrap">
  <h1>Luyện đề AWS CLF</h1>
  <p class="sub">1142 câu từ Practice Exam 1 đến 23. Bấm chọn đáp án để chấm ngay, câu chọn nhiều đáp án thì chọn đủ rồi bấm «Kiểm tra». Mỗi câu có giải thích tiếng Việt vì sao đúng, vì sao sai.</p>

  <div class="controls">
    <div class="row">
      <div class="seg" id="examSeg" role="group" aria-label="Chọn đề"></div>
      <div class="seg" id="filterSeg" role="group" aria-label="Lọc câu hỏi">
        <button type="button" id="fl-all" data-v="all" aria-pressed="true">Tất cả</button>
        <button type="button" id="fl-todo" data-v="todo" aria-pressed="false">Chưa làm</button>
        <button type="button" id="fl-wrong" data-v="wrong" aria-pressed="false">Làm sai</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="track" id="track"><span class="t-ok"></span><span class="t-bad"></span></div>
    <div class="row">
      <button type="button" class="btn" id="revealAll">Hiện tất cả đáp án</button>
      <span class="reset" id="resetBox"><button type="button" class="btn" id="resetBtn">Làm lại đề này</button></span>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const DATA={"1": [{"n": 1, "q": "AWS allows users to manage their resources using a web based user interface. What is the name of this interface?", "o": [["A", "AWS CLI."], ["B", "AWS API."], ["C", "AWS SDK."], ["D", "AWS Management Console."]], "a": ["D"]}, {"n": 2, "q": "Which of the following is an example of horizontal scaling in the AWS Cloud?", "o": [["A", "Replacing an existing EC2 instance with a larger, more powerful one."], ["B", "Increasing the compute capacity of a single EC2 instance to address the growing demands of an application."], ["C", "Adding more RAM capacity to an EC2 instance."], ["D", "Adding more EC2 instances of the same size to handle an increase in traffic."]], "a": ["D"]}, {"n": 3, "q": "You have noticed that several critical Amazon EC2 instances have been terminated. Which of the following AWS services would help you determine who took this action?", "o": [["A", "Amazon Inspector."], ["B", "AWS CloudTrail."], ["C", "AWS Trusted Advisor."], ["D", "EC2 Instance Usage Report."]], "a": ["B"]}, {"n": 4, "q": "Which of the below options are related to the reliability of AWS? (Choose TWO)", "o": [["A", "Applying the principle of least privilege to all AWS resources."], ["B", "Automatically provisioning new resources to meet demand."], ["C", "All AWS services are considered Global Services, and this design helps customers serve their international users."], ["D", "Providing compensation to customers if issues occur."], ["E", "Ability to recover quickly from failures."]], "a": ["B", "E"]}, {"n": 5, "q": "Which statement is true regarding the AWS Shared Responsibility Model?", "o": [["A", "Responsibilities vary depending on the services used."], ["B", "Security of the IaaS services is the responsibility of AWS."], ["C", "Patching the guest OS is always the responsibility of AWS."], ["D", "Security of the managed services is the responsibility of the customer."]], "a": ["A"]}, {"n": 6, "q": "You have set up consolidated billing for several AWS accounts. One of the accounts has purchased a number of reserved instances for 3 years. Which of the following is true regarding this scenario?", "o": [["A", "The Reserved Instance discounts can only be shared with the master account."], ["B", "All accounts can receive the hourly cost benefit of the Reserved Instances."], ["C", "The purchased instances will have better performance than On-demand instances."], ["D", "There are no cost benefits from using consolidated billing; It is for informational purposes only."]], "a": ["B"]}, {"n": 7, "q": "A company has developed an eCommerce web application in AWS. What should they do to ensure that the application has the highest level of availability?", "o": [["A", "Deploy the application across multiple Availability Zones and Edge locations."], ["B", "Deploy the application across multiple Availability Zones and subnets."], ["C", "Deploy the application across multiple Regions and Availability Zones."], ["D", "Deploy the application across multiple VPC’s and subnets."]], "a": ["C"]}, {"n": 8, "q": "What does AWS Snowball provide? (Choose TWO)", "o": [["A", "Built-in computing capabilities that allow customers to process data locally."], ["B", "A catalog of third-party software solutions that customers need to build solutions and run their businesses."], ["C", "A hybrid cloud storage between on-premises environments and the AWS Cloud."], ["D", "An Exabyte-scale data transfer service that allows you to move extremely large amounts of data to AWS."], ["E", "Secure transfer of large amounts of data into and out of the AWS."]], "a": ["A", "E"]}, {"n": 9, "q": "A company has an AWS Enterprise Support plan. They want quick and efficient guidance with their billing and account inquiries. Which of the following should the company use?", "o": [["A", "AWS Health Dashboard."], ["B", "AWS Support Concierge."], ["C", "AWS Customer Service."], ["D", "AWS Operations Support."]], "a": ["B"]}, {"n": 10, "q": "A Japanese company hosts their applications on Amazon EC2 instances in the Tokyo Region. The company has opened new branches in the United States, and the US users are complaining of high latency. What can the company do to reduce latency for the users in the US while minimizing costs?", "o": [["A", "Applying the Amazon Connect latency-based routing policy."], ["B", "Registering a new US domain name to serve the users in the US."], ["C", "Building a new data center in the US and implementing a hybrid model."], ["D", "Deploying new Amazon EC2 instances in a Region located in the US."]], "a": ["D"]}, {"n": 11, "q": "An organization has a large number of technical employees who operate their AWS Cloud infrastructure. What does AWS provide to help organize them into teams and then assign the appropriate permissions for each team?", "o": [["A", "IAM roles."], ["B", "IAM users."], ["C", "IAM user groups."], ["D", "AWS Organizations."]], "a": ["C"]}, {"n": 12, "q": "A company has decided to migrate its Oracle database to AWS. Which AWS service can help achieve this without negatively impacting the functionality of the source database?", "o": [["A", "AWS OpsWorks."], ["B", "AWS Database Migration Service."], ["C", "AWS Server Migration Service."], ["D", "AWS Application Discovery Service."]], "a": ["B"]}, {"n": 13, "q": "Adjusting compute capacity dynamically to reduce cost is an implementation of which AWS cloud best practice?", "o": [["A", "Build security in every layer."], ["B", "Parallelize tasks."], ["C", "Implement elasticity."], ["D", "Adopt monolithic architecture."]], "a": ["C"]}, {"n": 14, "q": "What are the benefits of having infrastructure hosted in AWS? (Choose TWO)", "o": [["A", "Increasing speed and agility."], ["B", "There is no need to worry about security."], ["C", "Gaining complete control over the physical infrastructure."], ["D", "Operating applications on behalf of customers."], ["E", "All of the physical security and most of the data/network security are taken care of for you."]], "a": ["A", "E"]}, {"n": 15, "q": "What is the advantage of the AWS-recommended practice of \"decoupling\" applications?", "o": [["A", "Allows treating an application as a single, cohesive unit."], ["B", "Reduces inter-dependencies so that failures do not impact other components of the application."], ["C", "Allows updates of any monolithic application quickly and easily."], ["D", "Allows tracking of any API call made to any AWS service."]], "a": ["B"]}, {"n": 16, "q": "Which of the following helps a customer view the Amazon EC2 billing activity for the past month?", "o": [["A", "AWS Budgets."], ["B", "AWS Pricing Calculator."], ["C", "AWS Systems Manager."], ["D", "AWS Cost & Usage Reports."]], "a": ["D"]}, {"n": 17, "q": "What do you gain from setting up consolidated billing for five different AWS accounts under another master account?", "o": [["A", "AWS services’ costs will be reduced to half the original price."], ["B", "The consolidated billing feature is just for organizational purpose."], ["C", "Each AWS account gets volume discounts."], ["D", "Each AWS account gets five times the free-tier services capacity."]], "a": ["C"]}, {"n": 18, "q": "What should you do in order to keep the data on EBS volumes safe? (Choose TWO)", "o": [["A", "Regularly update firmware on EBS devices."], ["B", "Create EBS snapshots."], ["C", "Ensure that EBS data is encrypted at rest."], ["D", "Store a backup daily in an external drive."], ["E", "Prevent any unauthorized access to AWS data centers."]], "a": ["B", "C"]}, {"n": 19, "q": "One of the most important AWS best-practices to follow is the cloud architecture principle of elasticity. How does this principle improve your architecture’s design?", "o": [["A", "By automatically scaling your on-premises resources based on changes in demand."], ["B", "By automatically scaling your AWS resources using an Elastic Load Balancer."], ["C", "By reducing interdependencies between application components wherever possible."], ["D", "By automatically provisioning the required AWS resources based on changes in demand."]], "a": ["D"]}, {"n": 20, "q": "A startup company is operating on limited funds and is extremely concerned about cost overruns. Which of the below options can be used to notify the company when their monthly AWS bill exceeds $2000? (Choose TWO)", "o": [["A", "Setup a CloudWatch billing alarm that triggers an SNS notification when the threshold is exceeded."], ["B", "Configure the Amazon Simple Email Service to send billing alerts to their email address on a daily basis."], ["C", "Configure the AWS Budgets Service to alert the company when the threshold is exceeded."], ["D", "Configure AWS CloudTrail to automatically delete all AWS resources when the threshold is exceeded."], ["E", "Configure the Amazon Connect Service to alert the company when the threshold is exceeded."]], "a": ["A", "C"]}, {"n": 21, "q": "What does Amazon CloudFront use to distribute content to global users with low latency?", "o": [["A", "AWS Global Accelerator."], ["B", "AWS Regions."], ["C", "AWS Edge Locations."], ["D", "AWS Availability Zones."]], "a": ["C"]}, {"n": 22, "q": "What does the \"Principle of Least Privilege\" refer to?", "o": [["A", "You should grant your users only the permissions they need when they need them and nothing more."], ["B", "All IAM users should have at least the necessary permissions to access the core AWS services."], ["C", "All trusted IAM users should have access to any AWS service in the respective AWS account."], ["D", "IAM users should not be granted any permissions; to keep your account safe."]], "a": ["A"]}, {"n": 23, "q": "Which of the following does NOT belong to the AWS Cloud Computing models?", "o": [["A", "Platform as a Service (PaaS)."], ["B", "Infrastructure as a Service (IaaS)."], ["C", "Software as a Service (SaaS)."], ["D", "Networking as a Service (NaaS)."]], "a": ["D"]}, {"n": 24, "q": "The identification process of an online financial services company requires that new users must complete an online interview with their security team. The completed recorded interviews are only required in the event of a legal issue or a regulatory compliance breach. What is the most cost-effective service to store the recorded videos?", "o": [["A", "S3 Intelligent-Tiering."], ["B", "AWS Marketplace."], ["C", "Amazon S3 Glacier Deep Archive."], ["D", "Amazon EBS."]], "a": ["C"]}, {"n": 25, "q": "Which service provides DNS in the AWS cloud?", "o": [["A", "Route 53."], ["B", "AWS Config."], ["C", "Amazon CloudFront."], ["D", "Amazon EMR."]], "a": ["A"]}, {"n": 26, "q": "Hundreds of thousands of DDoS attacks are recorded every month worldwide. What service does AWS provide to help protect AWS Customers from these attacks? (Choose TWO)", "o": [["A", "AWS Shield."], ["B", "AWS Config."], ["C", "Amazon Cognito."], ["D", "AWS WAF."], ["E", "AWS KMS."]], "a": ["A", "D"]}, {"n": 27, "q": "A company is deploying a new two-tier web application in AWS. Where should the most frequently accessed data be stored so that the application’s response time is optimal?", "o": [["A", "AWS OpsWorks."], ["B", "AWS Storage Gateway."], ["C", "Amazon EBS volume."], ["D", "Amazon ElastiCache."]], "a": ["D"]}, {"n": 28, "q": "You want to run a questionnaire application for only one day (without interruption), which Amazon EC2 purchase option should you use?", "o": [["A", "Reserved instances."], ["B", "Spot instances."], ["C", "Dedicated instances."], ["D", "On-demand instances."]], "a": ["D"]}, {"n": 29, "q": "You are working on a project that involves creating thumbnails of millions of images. Consistent uptime is not an issue, and continuous processing is not required. Which EC2 buying option would be the most cost-effective?", "o": [["A", "Reserved Instances."], ["B", "On-demand Instances."], ["C", "Dedicated Instances."], ["D", "Spot Instances."]], "a": ["D"]}, {"n": 30, "q": "Which of the following can be described as a global content delivery network (CDN) service?", "o": [["A", "AWS VPN."], ["B", "AWS Direct Connect."], ["C", "AWS Regions."], ["D", "Amazon CloudFront."]], "a": ["D"]}, {"n": 31, "q": "Which of the following services allows customers to manage their agreements with AWS?", "o": [["A", "AWS Artifact."], ["B", "AWS Certificate Manager."], ["C", "AWS Systems Manager."], ["D", "AWS Organizations."]], "a": ["A"]}, {"n": 32, "q": "Which of the following are examples of AWS-Managed Services, where AWS is responsible for the operational and maintenance burdens of running the service? (Choose TWO)", "o": [["A", "Amazon VPC."], ["B", "Amazon DynamoDB."], ["C", "Amazon Elastic MapReduce."], ["D", "AWS IAM."], ["E", "Amazon Elastic Compute Cloud."]], "a": ["B", "C"]}, {"n": 33, "q": "Your company has a data store application that requires access to a NoSQL database. Which AWS database offering would meet this requirement?", "o": [["A", "Amazon Aurora."], ["B", "Amazon DynamoDB."], ["C", "Amazon Elastic Block Store."], ["D", "Amazon Redshift."]], "a": ["B"]}, {"n": 34, "q": "As part of the Enterprise support plan, who is the primary point of contact for ongoing support needs?", "o": [["A", "AWS Identity and Access Management (IAM) user."], ["B", "Infrastructure Event Management (IEM) engineer."], ["C", "AWS Consulting Partners."], ["D", "Technical Account Manager (TAM)."]], "a": ["D"]}, {"n": 35, "q": "How can you view the distribution of AWS spending in one of your AWS accounts?", "o": [["A", "By using Amazon VPC console."], ["B", "By contacting the AWS Support team."], ["C", "By using AWS Cost Explorer."], ["D", "By contacting the AWS Finance team."]], "a": ["C"]}, {"n": 36, "q": "Which of the following must an IAM user provide to interact with AWS services using the AWS Command Line Interface (AWS CLI)?", "o": [["A", "Access keys."], ["B", "Secret token."], ["C", "UserID."], ["D", "User name and password."]], "a": ["A"]}, {"n": 37, "q": "You have AWS Basic support, and you have discovered that some AWS resources are being used maliciously, and those resources could potentially compromise your data. What should you do?", "o": [["A", "Contact the AWS Customer Service team."], ["B", "Contact the AWS Abuse team."], ["C", "Contact the AWS Concierge team."], ["D", "Contact the AWS Security team."]], "a": ["B"]}, {"n": 38, "q": "Select TWO examples of the AWS shared controls.", "o": [["A", "Patch Management."], ["B", "IAM Management."], ["C", "VPC Management."], ["D", "Configuration Management."], ["E", "Data Center operations."]], "a": ["A", "D"]}, {"n": 39, "q": "In order to implement best practices when dealing with a “Single Point of Failure,” you should attempt to build as much automation as possible in both detecting and reacting to failure. Which of the following AWS services would help? (Choose TWO)", "o": [["A", "ELB."], ["B", "Auto Scaling."], ["C", "Amazon Athen."], ["D", "ECR."], ["E", "Amazon EC2."]], "a": ["A", "B"]}, {"n": 40, "q": "A company is planning to host an educational website on AWS. Their video courses will be streamed all around the world. Which of the following AWS services will help achieve high transfer speeds?", "o": [["A", "Amazon SNS."], ["B", "Amazon Kinesis Video Streams."], ["C", "AWS CloudFormation."], ["D", "Amazon CloudFront."]], "a": ["D"]}, {"n": 41, "q": "A developer is planning to build a two-tier web application that has a MySQL database layer. Which of the following AWS database services would provide automated backups for the application?", "o": [["A", "A MySQL database installed on an EC2 instance."], ["B", "Amazon Aurora."], ["C", "Amazon DynamoDB."], ["D", "Amazon Neptune."]], "a": ["B"]}, {"n": 42, "q": "What is the AWS service that enables AWS architects to manage infrastructure as code?", "o": [["A", "AWS CloudFormation."], ["B", "AWS Config."], ["C", "Amazon SES."], ["D", "Amazon EMR."]], "a": ["A"]}, {"n": 43, "q": "Under the shared responsibility model, which of the following is the responsibility of AWS?", "o": [["A", "Client-side encryption."], [" ures that can be used to improve the availability of your database? (Choose TWO)", "o": [["A", "AWS Regions."], ["B", "Multi-AZ Deployment."], ["C", "Automatic patching."], ["D", "Read Replicas."], ["E", "Edge Locations."]], "a": ["B", "D"]}, {"n": 9, "q": "Sarah has deployed an application in the Northern California (us-west-1) region. After examining the application’s traffic, she notices that about 30% of the traffic is coming from Asia. What can she do to reduce latency for the users in Asia?", "o": [["A", "Replicate the current resources across multiple Availability Zones within the same region."], ["B", "Migrate the application to a hosting provider in Asia."], ["C", "Recreate the website content."], ["D", "Create a CDN using CloudFront, so that content is cached at Edge Locations close to and in Asia."]], "a": ["D"]}, {"n": 10, "q": "An organization runs many systems and uses many AWS products. Which of the following services enables them to control how each developer interacts with these products?", "o": [["A", "AWS Identity and Access Management."], ["B", "Amazon RDS."], ["C", "Network Access Control Lists."], ["D", "Amazon EMR."]], "a": ["A"]}, {"n": 11, "q": "Using Amazon EC2 falls under which of the following cloud computing models?", "o": [["A", "Iaas & SaaS."], ["B", "IaaS."], ["C", "SaaS."], ["D", "PaaS."]], "a": ["B"]}, {"n": 12, "q": "Which of the below is a best-practice when building applications on AWS?", "o": [["A", "Strengthen physical security by applying the principle of least privilege."], ["B", "Ensure that the application runs on hardware from trusted vendors."], ["C", "Use IAM policies to maintain performance."], ["D", "Decouple the components of the application so that they run independently."]], "a": ["D"]}, {"n": 13, "q": "Your company is designing a new application that will store and retrieve photos and videos. Which of the following services should you recommend as the underlying storage mechanism?", "o": [["A", "Amazon EBS."], ["B", "Amazon SQS."], ["C", "Amazon Instance store."], ["D", "Amazon S3."]], "a": ["D"]}, {"n": 14, "q": "Amazon Glacier is an Amazon S3 storage class that is suitable for storing [...] & [...]. (Choose TWO)", "o": [["A", "Active archives."], ["B", "Dynamic websites’ assets."], ["C", "Long-term analytic data."], ["D", "Active databases."], ["E", "Cached data."]], "a": ["A", "C"]}, {"n": 15, "q": "What does Amazon Elastic Beanstalk provide?", "o": [["A", "A PaaS solution to automate application deployment."], ["B", "A compute engine for Amazon ECS."], ["C", "A scalable file storage solution for use with AWS and on-premises servers."], ["D", "A NoSQL database service."]], "a": ["A"]}, {"n": 16, "q": "What is the AWS service that performs automated network assessments of Amazon EC2 instances to check for vulnerabilities?", "o": [["A", "Amazon Kinesis."], ["B", "Security groups."], ["C", "Amazon Inspector."], ["D", "AWS Network Access Control Lists."]], "a": ["C"]}, {"n": 17, "q": "Under the Shared Responsibility Model, which of the following controls do customers fully inherit from AWS? (Choose TWO)", "o": [["A", "Patch management controls."], ["B", "Database controls."], ["C", "Awareness & Training."], ["D", "Environmental controls."], ["E", "Physical controls."]], "a": ["D", "E"]}, {"n": 18, "q": "A company needs to host a database in Amazon RDS for at least three years. Which of the following options would be the most cost-effective solution?", "o": [["A", "Reserved instances – No Upfront."], ["B", "Reserved instances – Partial Upfront."], ["C", "On-Demand instances."], ["D", "Spot Instances."]], "a": ["B"]}, {"n": 19, "q": "Your application has recently experienced significant global growth, and international users are complaining of high latency. What is the AWS characteristic that can help improve your international users’ experience?", "o": [["A", "Elasticity."], ["B", "Global reach."], ["C", "Data durability."], ["D", "High availability."]], "a": ["B"]}, {"n": 20, "q": "Savings Plans are available for which of the following AWS compute services? (Choose TWO)", "o": [["A", "AWS Batch."], ["B", "AWS Outposts."], ["C", "Amazon Lightsail."], ["D", "Amazon EC2."], ["E", "AWS Lambda."]], "a": ["D", "E"]}, {"n": 21, "q": "A company has business critical workloads hosted on AWS and they are unwilling to accept any downtime. Which of the following is a recommended best practice to protect their workloads in the event of an unexpected natural disaster?", "o": [["A", "Replicate data across multiple Edge Locations worldwide and use Amazon CloudFront to perform automatic failover in the event of an outage."], ["B", "Deploy AWS resources across multiple Availability Zones within the same AWS Region."], ["C", "Create point-in-time backups in another subnet and recover this data when a disaster occurs."], ["D", "Deploy AWS resources to another AWS Region and implement an Active-Active disaster recovery strategy."]], "a": ["D"]}, {"n": 22, "q": "Which statement is correct with regards to AWS service limits? (Choose TWO)", "o": [["A", "You can contact AWS support to increase the service limits."], ["B", "Each IAM user has the same service limit."], ["C", "There are no service limits on AWS."], ["D", "You can use the AWS Trusted Advisor to monitor your service limits."], ["E", "The Amazon Simple Email Service is responsible for sending email notifications when usage approaches a service limit."]], "a": ["A", "D"]}, {"n": 23, "q": "What is the AWS tool that enables you to use scripts to manage all AWS services and resources?", "o": [["A", "AWS Console."], ["B", "AWS Service Catalog."], ["C", "AWS OpsWorks."], ["D", "AWS CLI."]], "a": ["D"]}, {"n": 24, "q": "What are the connectivity options that can be used to build hybrid cloud architectures? (Choose TWO)", "o": [["A", "AWS Artifact."], ["B", "AWS Cloud9."], ["C", "AWS Direct Connect."], ["D", "AWS CloudTrail."], ["E", "AWS VPN."]], "a": ["C", "E"]}, {"n": 25, "q": "A company has deployed a new web application on multiple Amazon EC2 instances. Which of the following should they use to ensure that the incoming HTTP traffic is distributed evenly across the instances?", "o": [["A", "AWS EC2 Auto Recovery."], ["B", "AWS Auto Scaling."], ["C", "AWS Network Load Balancer."], ["D", "AWS Application Load Balancer."]], "a": ["D"]}, {"n": 26, "q": "Which of the following AWS offerings is a MySQL-compatible relational database service that can scale capacity automatically based on demand?", "o": [["A", "Amazon Neptune."], ["B", "Amazon Aurora."], ["C", "Amazon RDS for SQL Server."], ["D", "Amazon RDS for PostgreSQL."]], "a": ["B"]}, {"n": 27, "q": "Which of the following can help protect your EC2 instances from DDoS attacks? (Choose TWO)", "o": [["A", "AWS CloudHSM."], ["B", "Security Groups."], ["C", "AWS Batch."], ["D", "AWS IAM."], ["E", "Network Access Control Lists (Network ACLs)."]], "a": ["B", "E"]}, {"n": 28, "q": "What is the AWS data warehouse service that supports a high level of query performance on large amounts of datasets?", "o": [["A", "Amazon Redshift."], ["B", "Amazon Kinesis."], ["C", "Amazon DynamoDB."], ["D", "Amazon RDS."]], "a": ["A"]}, {"n": 29, "q": "Which of the following should be considered when performing a TCO analysis to compare the costs of running an application on AWS instead of on-premises?", "o": [["A", "Application development."], ["B", "Market research."], ["C", "Business analysis."], ["D", "Physical hardware."]], "a": ["D"]}, {"n": 30, "q": "How are AWS customers billed for Linux-based Amazon EC2 usage?", "o": [["A", "EC2 instances will be billed on one second increments, with a minimum of one minute."], ["B", "EC2 instances will be billed on one hour increments, with a minimum of one day."], ["C", "EC2 instances will be billed on one minute increments, with a minimum of one hour."], ["D", "EC2 instances will be billed on one day increments, with a minimum of one month."]], "a": ["A"]}, {"n": 31, "q": "Which of the following will impact the price paid for an EC2 instance? (Choose TWO)", "o": [["A", "Instance type."], ["B", "The Availability Zone where the instance is provisioned."], ["C", "Load balancing."], ["D", "Number of buckets."], ["E", "Number of private IPs."]], "a": ["A", "B"]}, {"n": 32, "q": "A customer spent a lot of time configuring a newly deployed Amazon EC2 instance. After the workload increases, the customer decides to provision another EC2 instance with an identical configuration. How can the customer achieve this?", "o": [["A", "By creating an AWS Config template from the old instance and launching a new instance from it."], ["B", "By creating an EBS Snapshot of the old instance."], ["C", "By installing Aurora on EC2 and launching a new instance from it."], ["D", "By creating an AMI from the old instance and launching a new instance from it."]], "a": ["D"]}, {"n": 33, "q": "A company uses AWS Organizations to manage all of its AWS accounts. Which of the following allows the company to restrict what services and actions are allowed in each individual account?", "o": [["A", "IAM Principals."], ["B", "AWS Service Control Policies (SCPs)."], ["C", "IAM policies."], ["D", "AWS Fargate."]], "a": ["B"]}, {"n": 34, "q": "Which of the following statements describes the AWS Cloud’s agility?", "o": [["A", "AWS allows you to host your applications in multiple regions around the world."], ["B", "AWS provides customizable hardware at the lowest possible cost."], ["C", "AWS allows you to provision resources in minutes."], ["D", "AWS allows you to pay upfront to reduce costs."]], "a": ["C"]}, {"n": 35, "q": "What are the benefits of using the Amazon Relational Database Service? (Choose TWO)", "o": [["A", "Lower administrative burden."], ["B", "Complete control over the underlying host."], ["C", "Resizable compute capacity."], ["D", "Scales automatically to larger or smaller instance types."], ["E", "Supports the document and key-value data structure."]], "a": ["A", "C"]}, {"n": 36, "q": "What is the connectivity option that uses Internet Protocol Security (IPSec) to establish encrypted connectivity between an on-premises network and the AWS Cloud?", "o": [["A", "Internet Gateway."], ["B", "AWS IQ."], ["C", "AWS Direct Connect."], ["D", "AWS Site-to-Site VPN."]], "a": ["D"]}, {"n": 37, "q": "What is the minimum level of AWS support that provides 24x7 access to technical support engineers via phone and chat?", "o": [["A", "Enterprise Support."], ["B", "Developer Support."], ["C", "Basic Support."], ["D", "Business Support."]], "a": ["D"]}, {"n": 38, "q": "Which of the following is used to control network traffic in AWS? (Choose TWO)", "o": [["A", "Network Access Control Lists (NACLs)."], ["B", "Key Pairs."], ["C", "Access Keys."], ["D", "IAM Policies."], ["E", "Security Groups."]], "a": ["A", "E"]}, {"n": 39, "q": "A company has developed a media transcoding application in AWS. The application is designed to recover quickly from hardware failures. Which one of the following types of instance would be the most cost-effective choice to use?", "o": [["A", "Reserved instances."], ["B", "Spot Instances."], ["C", "On-Demand instances."], ["D", "Dedicated instances."]], "a": ["B"]}, {"n": 40, "q": "Which AWS Service provides the current status of all AWS Services in all AWS Regions?", "o": [["A", "AWS Service Health Dashboard."], ["B", "AWS Management Console."], ["C", "Amazon CloudWatch."], ["D", "AWS Personal Health Dashboard."]], "a": ["A"]}, {"n": 41, "q": "Which AWS service or feature can be used to call AWS Services from different programming languages?", "o": [["A", "AWS Software Development Kit."], ["B", "AWS Command Line Interface."], ["C", "AWS CodeDeploy."], ["D", "AWS Management Console."]], "a": ["A"]}, {"n": 42, "q": "Which AWS Service can be used to register a new domain name?", "o": [["A", "Amazon Personalize."], ["B", "Amazon Route 53."], ["C", "AWS KMS."], ["D", "AWS Config."]], "a": ["B"]}, {"n": 43, "q": "App development companies move their business to AWS to reduce time-to-market and improve customer satisfaction, what are the AWS automation tools that help them deploy their applications faster? (Choose TWO)", "o": [["A", "AWS CloudFormation."], ["B", "AWS Migration Hub."], ["C", "AWS IAM."], ["D", "AWS Elastic Beanstalk."], ["E", "Amazon Macie."]], "a": ["A", "D"]}, {"n": 44, "q": "Which AWS service provides cost-optimization recommendations?", "o": [["A", "AWS Trusted Advisor."], ["B", "AWS Pricing Calculator."], ["C", "Amazon QuickSight."], ["D", "AWS X-Ray."]], "a": ["A"]}, {"n": 45, "q": "A company has hundreds of VPCs in multiple AWS Regions worldwide. What service does AWS offer to simplify the connection management among the VPCs?", "o": [["A", "VPC Peering."], ["B", "AWS Transit Gateway."], ["C", "Amazon Connect."], ["D", "Security Groups."]], "a": ["B"]}, {"n": 46, "q": "What is one benefit and one drawback of buying a reserved EC2 instance? (Select TWO)", "o": [["A", "Instances can be shut down by AWS at any time with no notification."], ["B", "Reserved instances require at least a one-year pricing commitment."], ["C", "There is no additional charge for using dedicated instances."], ["D", "Reserved instances provide a significant discount compared to on-demand instances."], ["E", "Reserved instances are best suited for periodic workloads."]], "a": ["B", "D"]}, {"n": 47, "q": "Why does every AWS Region contain multiple Availability Zones?", "o": [["A", "Multiple Availability Zones allows you to build resilient and highly available architectures."], ["B", "Multiple Availability Zones results in lower total cost compared to deploying in a single Availability Zone."], ["C", "Multiple Availability Zones allows for data replication and global reach."], ["D", "Multiple Availability Zones within a region increases the storage capacity available in that region."]], "a": ["A"]}, {"n": 48, "q": "What is the most cost-effective purchasing option for running a set of EC2 instances that must always be available for a period of two months?", "o": [["A", "On-Demand Instances."], ["B", "Spot Instances."], ["C", "Reserved Instances – All Upfront."], ["D", "Reserved Instances – No Upfront."]], "a": ["A"]}, {"n": 49, "q": "Which of the following is a benefit of running an application in multiple Availability Zones?", "o": [["A", "Allows you to exceed AWS service limits."], ["B", "Reduces application response time between servers and global users."], ["C", "Increases available compute capacity."], ["D", "Increases the availability of your application."]], "a": ["D"]}, {"n": 50, "q": "Data security is one of the top priorities of AWS. How does AWS deal with old storage devices that have reached the end of their useful life?", "o": [["A", "AWS sells the old devices to other hosting providers."], ["B", "AWS destroys the old devices in accordance with industry-standard practices."], ["C", "AWS sends the old devices for remanufacturing."], ["D", "AWS stores the old devices in a secure place."]], "a": ["B"]}], "4": [{"n": 1, "q": "A developer needs to set up an SSL security certificate for a client's eCommerce website in order to use the HTTPS protocol. Which of the following AWS services can be used to deploy the required SSL server certificates? (Choose TWO)", "o": [["A", "Amazon Route 53."], ["B", "AWS ACM."], ["C", "AWS Directory Service."], ["D", "AWS Identity & Access Management."], ["E", "AWS Data Pipeline."]], "a": ["B", "D"]}, {"n": 2, "q": "Which of the following AWS services scale automatically without your intervention? (Choose TWO)", "o": [["A", "Amazon EC2."], ["B", "Amazon S3."], ["C", "AWS Lambda."], ["D", "Amazon EMR."], ["E", "Amazon EBS."]], "a": ["B", "C"]}, {"n": 3, "q": "A company is planning to migrate an application from Amazon EC2 to AWS Lambda to use a serverless architecture. Which of the following will be the responsibility of AWS after migration? (Choose TWO)", "o": [["A", "Application management."], ["B", "Capacity management."], ["C", "Access control."], ["D", "Operating system maintenance."], ["E", "Data management."]], "a": ["B", "D"]}, {"n": 4, "q": "How do ELBs improve the reliability of your application?", "o": [["A", "By distributing traffic across multiple S3 buckets."], ["B", "By replicating data to multiple availability zones."], ["C", "By creating database Read Replicas."], ["D", "By ensuring that only healthy targets receive traffic."]], "a": ["D"]}, {"n": 5, "q": "A company needs to migrate their website from on-premises to AWS. Security is a major concern for them, so they need to host their website on hardware that is NOT shared with other AWS customers. Which of the following EC2 instance options meets this requirement?", "o": [["A", "On-demand instances."], ["B", "Spot instances."], ["C", "Dedicated instances."], ["D", "Reserved instances."]], "a": ["C"]}, {"n": 6, "q": "A customer is planning to move billions of images and videos to be stored on Amazon S3. The customer has approximately 60 Petabytes of data to move. Which of the following AWS Services is the best choice to transfer the data to AWS?", "o": [["A", "Snowball."], ["B", "S3 Transfer Acceleration."], ["C", "Snowmobile."], ["D", "Amazon VPC."]], "a": ["C"]}, {"n": 7, "q": "A company plans to migrate a large amount of archived data to AWS. The archived data must be maintained for a period of 5 years and must be retrievable within 5 hours of a request. What is the most cost-effective AWS storage service to use?", "o": [["A", "Amazon S3 Glacier."], ["B", "Amazon EFS."], ["C", "Amazon S3 Standard."], ["D", "Amazon EBS."]], "a": ["A"]}, {"n": 8, "q": "Which AWS Service is used to manage user permissions?", "o": [["A", "Security Groups."], ["B", "Amazon ECS."], ["C", "AWS IAM."], ["D", "AWS Support."]], "a": ["C"]}, {"n": 9, "q": "Which support plan includes AWS Support Concierge Service?", "o": [["A", "Premium Support."], ["B", "Business Support."], ["C", "Enterprise Support."], ["D", "Standard Support."]], "a": ["C"]}, {"n": 10, "q": "A company needs to track resource changes using the API call history. Which AWS service can help the company achieve this goal?", "o": [["A", "AWS Config."], ["B", "Amazon CloudWatch."], ["C", "AWS CloudTrail."], ["D", "AWS CloudFormation."]], "a": ["C"]}, {"n": 11, "q": "What are the benefits of using an AWS-managed service? (Choose TWO)", "o": [["A", "Provides complete control over the virtual infrastructure."], ["B", "Allows customers to deliver new solutions faster."], ["C", "Lowers operational complexity."], ["D", "Eliminates the need to encrypt data."], ["E", "Allows developers to control all patching related activities."]], "a": ["B", "C"]}, {"n": 12, "q": "Which of the following are use cases for Amazon S3? (Choose TWO)", "o": [["A", "Hosting static websites."], ["B", "Hosting websites that require sustained high CPU utilization."], ["C", "Cost-effective database and log storage."], ["D", "A media store for the CloudFront service."], ["E", "Processing data streams at any scale."]], "a": ["A", "D"]}, {"n": 13, "q": "What is the AWS’ recommendation regarding access keys?", "o": [["A", "Delete all access keys and use passwords instead."], ["B", "Only share them with trusted people."], ["C", "Rotate them regularly."], ["D", "Save them within your application code."]], "a": ["C"]}, {"n": 14, "q": "What is the AWS IAM feature that provides an additional layer of security on top of user-name and password authentication?", "o": [["A", "Key Pair."], ["B", "Access Keys."], ["C", "SDK."], ["D", "MFA."]], "a": ["D"]}, {"n": 15, "q": "What is the benefit of using an API to access AWS Services?", "o": [["A", "It improves the performance of AWS resources."], ["B", "It reduces the time needed to provision AWS resources."], ["C", "It reduces the number of developers necessary."], ["D", "It allows for programmatic management of AWS resources."]], "a": ["D"]}, {"n": 16, "q": "A company is planning to migrate a database with high read/write activity to AWS. What is the best storage option to use?", "o": [["A", "AWS Storage Gateway."], ["B", "Amazon S3."], ["C", "Amazon EBS."], ["D", "Amazon Glacier."]], "a": ["C"]}, {"n": 17, "q": "How can AWS customers track and avoid over-spending on underutilized reserved instances?", "o": [["A", "Customers can add all AWS accounts to an AWS Organization, enable Consolidated Billing, and turn off Reserved Instance sharing."], ["B", "Customers can use Amazon Neptune to track and analyze their usage patterns, detect underutilized reserved instances, and then sell them on the Amazon EC2 Reserved Instance Marketplace."], ["C", "Customers can use the AWS Budgets service to track the reserved instances usage and set up alert notifications when their utilization drops below the threshold that they define."], ["D", "Customers can use Amazon CloudTrail to automatically check for unused reservations and get recommendations to reduce their bill."]], "a": ["C"]}, {"n": 18, "q": "What is the AWS service that provides five times the performance of a standard MySQL database?", "o": [["A", "Amazon Aurora."], ["B", "Amazon Redshift."], ["C", "Amazon DynamoDB."], ["D", "Amazon Neptune."]], "a": ["A"]}, {"n": 19, "q": "What does AWS Service Catalog provide?", "o": [["A", "It enables customers to quickly find descriptions and use cases for AWS services."], ["B", "It enables customers to explore the different catalogs of AWS services."], ["C", "It simplifies organizing and governing commonly deployed IT services."], ["D", "It allows developers to deploy infrastructure on AWS using familiar programming languages."]], "a": ["C"]}, {"n": 20, "q": "For managed services like Amazon DynamoDB, which of the below is AWS responsible for? (Choose TWO)", "o": [["A", "Protecting credentials."], ["B", "Logging access activity."], ["C", "Patching the database software."], ["D", "Operating system maintenance."], ["E", "Creating access policies."]], "a": ["C", "D"]}, {"n": 21, "q": "Which of the following AWS Services helps with planning application migration to the AWS Cloud?", "o": [["A", "AWS Snowball Migration Service."], ["B", "AWS Application Discovery Service."], ["C", "AWS DMS."], ["D", "AWS Migration Hub."]], "a": ["B"]}, {"n": 22, "q": "A company is trying to analyze the costs applied to their AWS account recently. Which of the following provides them the most granular data about their AWS costs and usage?", "o": [["A", "Amazon Machine Image."], ["B", "AWS Cost Explorer."], ["C", "AWS Cost & Usage Report."], ["D", "Amazon CloudWatch."]], "a": ["C"]}, {"n": 23, "q": "Which statement best describes the concept of an AWS region?", "o": [["A", "An AWS Region is a geographical location with a collection of Edge locations."], ["B", "An AWS Region is a virtual network dedicated only to a single AWS customer."], ["C", "An AWS Region is a geographical location with a collection of Availability Zones."], ["D", "An AWS Region represents the country where the AWS infrastructure exist."]], "a": ["C"]}, {"n": 24, "q": "A company has discovered that multiple S3 buckets were deleted, but it is unclear who deleted the buckets. Which of the following can the company use to determine the identity that deleted the buckets?", "o": [["A", "SNS logs."], ["B", "SQS logs."], ["C", "CloudWatch Logs."], ["D", "CloudTrail logs."]], "a": ["D"]}, {"n": 25, "q": "Which of the following are factors in determining the appropriate database technology to use for a specific workload? (Choose TWO)", "o": [["A", "Availability Zones."], ["B", "Data sovereignty."], ["C", "The number of reads and writes per second."], ["D", "The nature of the queries."], ["E", "Software bugs."]], "a": ["C", "D"]}, {"n": 26, "q": "What are the benefits of implementing a tagging strategy for AWS resources? (Choose TWO)", "o": [["A", "Quickly identify resources that belong to a specific project."], ["B", "Quickly identify software solutions on AWS."], ["C", "Track API calls in your AWS account."], ["D", "Quickly identify deleted resources and their metadata."], ["E", "Track AWS spending across multiple resources."]], "a": ["A", "E"]}, {"n": 27, "q": "What are AWS shared controls?", "o": [["A", "Controls that are solely the responsibility of the customer based on the application they are deploying within AWS services."], ["B", "Controls that a customer inherits from AWS."], ["C", "Controls that apply to both the infrastructure layer and customer layers."], ["D", "Controls that the customer and AWS collaborate together upon to secure the infrastructure."]], "a": ["D"]}, {"n": 28, "q": "Which design principles relate to performance efficiency in AWS? (Choose TWO)", "o": [["A", "Build multi-region architectures to better serve global customers."], ["B", "Apply security at all layers."], ["C", "Implement strong Identity and Access controls."], ["D", "Use serverless architectures."], ["E", "Enable audit logging."]], "a": ["A", "D"]}, {"n": 29, "q": "Which of the below are responsibilities of the customer when using Amazon EC2? (Choose TWO)", "o": [["A", "Protecting sensitive data."], ["B", "Patching of the underlying infrastructure."], ["C", "Setup and operation of managed databases."], ["D", "Maintaining consistent hardware components."], ["E", "Installing and configuring third-party software."]], "a": ["A", "E"]}, {"n": 30, "q": "Why would an organization decide to use AWS over an on-premises data center? (Choose TWO)", "o": [["A", "Free commercial software licenses."], ["B", "Free technical support."], ["C", "Elastic resources."], ["D", "On-site visits for auditing."], ["E", "Cost Savings."]], "a": ["C", "E"]}, {"n": 31, "q": "Which of the following AWS services can help you perform security analysis and regulatory compliance auditing? (Choose TWO)", "o": [["A", "Amazon Inspector."], ["B", "AWS Virtual Private Gateway."], ["C", "AWS Batch."], ["D", "Amazon ECS."], ["E", "AWS Config."]], "a": ["A", "E"]}, {"n": 32, "q": "Which of the following is NOT a characteristic of Amazon Elastic Compute Cloud (Amazon ing in the last few months?", "o": [["A", "AWS Cost Explorer."], ["B", "AWS Pricing Calculator."], ["C", "AWS Budgets."], ["D", "AWS Consolidated Billing."]], "a": ["A"]}, {"n": 44, "q": "When running a workload in AWS, the customer is NOT responsible for: (Select TWO)", "o": [["A", "Running penetration tests."], ["B", "Reserving capacity."], ["C", "Data center operations."], ["D", "Auditing and regulatory compliance."], ["E", "Infrastructure security."]], "a": ["C", "E"]}, {"n": 45, "q": "Which AWS service can be used to send promotional text messages (SMS) to more than 200 countries worldwide?", "o": [["A", "Amazon Simple Email Service (Amazon SES)."], ["B", "Amazon Simple Storage Service (Amazon S3)."], ["C", "Amazon Simple Notification Service (Amazon SNS)."], ["D", "Amazon Simple Queue Service (Amazon SQS)."]], "a": ["C"]}, {"n": 46, "q": "Which of the following allows you to create new RDS instances? (Choose TWO)", "o": [["A", "AWS CodeDeploy."], ["B", "AWS Quick Starts."], ["C", "AWS CloudFormation."], ["D", "AWS DMS."], ["E", "AWS Management Console."]], "a": ["C", "E"]}, {"n": 47, "q": "One of the major advantages of using AWS is cost savings. What does AWS provide to reduce the cost of running Amazon EC2 instances?", "o": [["A", "Low monthly instance maintenance costs."], ["B", "Low-cost instance tagging."], ["C", "Per-second instance billing."], ["D", "Low instance start-up fees."]], "a": ["C"]}, {"n": 48, "q": "Which AWS Group assists customers in achieving their desired business outcomes?", "o": [["A", "AWS Security Team."], ["B", "AWS Professional Services."], ["C", "AWS Trusted Advisor."], ["D", "AWS Concierge Support Team."]], "a": ["B"]}, {"n": 49, "q": "Which AWS service or feature is used to manage the keys used to encrypt customer data?", "o": [["A", "AWS KMS."], ["B", "AWS Service Control Policies (SCPs)."], ["C", "Multi-Factor Authentication (MFA)."], ["D", "Amazon Macie."]], "a": ["A"]}, {"n": 50, "q": "Which AWS Service allows customers to download AWS SOC & PCI reports?", "o": [["A", "AWS Well-Architected Tool."], ["B", "AWS Artifact."], ["C", "AWS Glue."], ["D", "Amazon Chime."]], "a": ["B"]}], "5": [{"n": 1, "q": "A company is using EC2 Instances to run their e-commerce site on the AWS platform. If the site becomes unavailable, the company will lose a significant amount of money for each minute the site is unavailable. Which design principle should the company use to minimize the risk of an outage?", "o": [["A", "Least Privilege."], ["B", "Pilot Light."], ["C", "Fault Tolerance."], ["D", "Multi-threading."]], "a": ["C"]}, {"n": 2, "q": "You decide to buy a reserved instance for a term of one year. Which option provides the largest total discount?", "o": [["A", "All up-front reservation."], ["B", "All reserved instance payment options provide the same discount level."], ["C", "Partial up-front reservation."], ["D", "No up-front reservation."]], "a": ["A"]}, {"n": 3, "q": "What features does AWS offer to help protect your data in the Cloud? (Choose TWO)", "o": [["A", "Access control."], ["B", "Physical MFA devices."], ["C", "Data encryption."], ["D", "Unlimited storage."], ["E", "Load balancing."]], "a": ["A", "C"]}, {"n": 4, "q": "An AWS customer has used one Amazon Linux instance for 2 hours, 5 minutes and 9 seconds, and one CentOS instance for 4 hours, 23 minutes and 7 seconds. How much time will the customer be billed for?", "o": [["A", "3 hours for the Linux instance and 5 hours for the CentOS instance."], ["B", "2 hours, 5 minutes and 9 seconds for the Linux instance and 4 hours, 23 minutes and 7 seconds for the CentOS instance."], ["C", "2 hours, 5 minutes and 9 seconds for the Linux instance and 5 hours for the CentOS instance."], ["D", "3 hours for the Linux instance and 4 hours, 23 minutes and 7 seconds for the CentOS instance."]], "a": ["C"]}, {"n": 5, "q": "What is the AWS Support feature that allows customers to manage support cases programmatically?", "o": [["A", "AWS Trusted Advisor."], ing approaches will help you eliminate human error and automate the process of creating and updating your AWS environment?", "o": [["A", "Use Software test automation tools."], ["B", "Use AWS CodeDeploy to build and automate your AWS environment."], ["C", "Use code to provision and operate your AWS infrastructure."], ["D", "Migrate all of your applications to a dedicated host."]], "a": ["C"]}, {"n": 13, "q": "A company is seeking to better secure its AWS account from unauthorized access. Which of the below options can the customer use to achieve this goal?", "o": [["A", "Restrict any API call made through SDKs or CLI."], ["B", "Create one IAM account for each department in the company (Development, QA, Production), and share it across all staff in that department."], ["C", "Require Multi-Factor Authentication (MFA) for all IAM User access."], ["D", "Set up two login passwords."]], "a": ["C"]}, {"n": 14, "q": "Which AWS Service offers volume discounts based on usage?", "o": [["A", "Amazon VPC."], ["B", "Amazon S3."], ["C", "Amazon Lightsail."], ["D", "AWS Cost Explorer."]], "a": ["B"]}, {"n": 15, "q": "Which of the following factors should be considered when determining the region in which AWS Resources will be deployed? (Choose TWO)", "o": [["A", "The AWS Region’s security level."], ["B", "Data sovereignty."], ["C", "Cost."], ["D", "The planned number of VPCs."], ["E", "Geographic proximity to the company's location."]], "a": ["B", "C"]}, {"n": 16, "q": "You are running a financial services web application on AWS. The application uses a MySQL database to store the data. Which of the following AWS services would improve the performance of your application by allowing you to retrieve information from fast in-memory caches?", "o": [["A", "Amazon EFS."], ["B", "Amazon Neptune."], ["C", "Amazon ElastiCache."], ["D", "DAX."]], "a": ["C"]}, {"n": 17, "q": "What are the advantages of using Auto Scaling Groups for EC2 instances?", "o": [["A", "Auto Scaling Groups caches the osts of Amazon EC2? (Choose TWO)", "o": [["A", "The amount of time the instances will be running."], ["B", "Number of security groups."], ["C", "Allocated Elastic IP Addresses."], ["D", "Number of Hosted Zones."], ["E", "Number of instances."]], "a": ["B", "D"]}, {"n": 23, "q": "Which AWS Service helps enterprises extend their on-premises storage to AWS in a cost-effective manner?", "o": [["A", "AWS Data Pipeline."], ["B", "AWS Storage Gateway."], ["C", "Amazon Aurora."], ["D", "Amazon EFS."]], "a": ["B"]}, {"n": 24, "q": "A company is building an online cloud storage platform. They need a storage service that can scale capacity automatically, while minimizing cost. Which AWS storage service should the company use to meet these requirements?", "o": [["A", "Amazon Simple Storage Service."], ["B", "Amazon Elastic Block Store."], ["C", "Amazon Elastic Container Service."], ["D", "AWS Storage Gateway."]], "a": ["A"]}, {"n": 25, "q": "You have just hired a skilled sys-admin to join your team. As usual, you have created a new IAM user for him to interact with AWS services. On his first day, you ask him to create snapshots of all existing Amazon EBS volumes and save them in a new Amazon S3 bucket. However, the new member reports back that he is unable to create neither EBS snapshots nor S3 buckets. What might prevent him from doing this simple task?", "o": [["A", "EBS and S3 are accessible only to the root account owner."], ["B", "The systems administrator must contact AWS Support first to activate his new IAM account."], ["C", "There is not enough space in S3 to store the snapshots."], ["D", "There is a non-explicit deny to all new users."]], "a": ["D"]}, {"n": 26, "q": "An external auditor is requesting a log of all accesses to the AWS resources in the company’s account. Which of the following services will provide the auditor with the requested information?", "o": [["A", "AWS CloudTrail."], ["B", "Amazon CloudFront."], ["C", "AWS CloudFormation."], ["D", "Amazon CloudWatch."]], "a": ["A"]}, {"n": 27, "q": "Which of the below options is true of Amazon Cloud Directory?", "o": [["A", "Amazon Cloud Directory allows the organization of hierarchies of data across multiple dimensions."], ["B", "Amazon Cloud Directory enables the analysis of video and data streams in real time."], ["C", "Amazon Cloud Directory allows users to access AWS with their existing Active Directory credentials."], ["D", "Amazon Cloud Directory allows for registration and management of domain names."]], "a": ["A"]}, {"n": 28, "q": "A user has opened a \"Production System Down\" support case to get help from AWS Support after a production system disruption. What is the expected response time for this type of support case?", "o": [["A", "12 hours."], ["B", "15 minutes."], ["C", "24 hours."], ["D", "One hour."]], "a": ["D"]}, {"n": 29, "q": "Which of the below options is a best practice for making your application on AWS highly available?", "o": [["A", "Deploy the application to at least two Availability Zones."], ["B", "Use Elastic Load Balancing (ELB) across multiple AWS Regions."], ["C", "Deploy the application code on at least two servers in the same Availability Zone."], ["D", "Rewrite the application code to handle all incoming requests."]], "a": ["A"]}, {"n": 30, "q": "Which of the following should be taken into account when performing a TCO analysis regarding the costs of running an application on AWS VS on-premises? (Choose TWO)", "o": [["A", "Labor and IT costs."], ["B", "Cooling and power consumption."], ["C", "Amazon EBS computing power."], ["D", "Software architecture."], ["E", "Software compatibility."]], "a": ["A", "B"]}, {"n": 31, "q": "Your company requires a response time of less than 15 minutes from support interactions about their business-critical systems that are hosted on AWS if those systems go down. Which AWS Support Plan should this company use?", "o": [["A", "AWS Basic Support."], ["B", "AWS Developer Support."], ["C", "AWS Business Support.
