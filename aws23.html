anstalk."]], "a": ["B"]}, {"n": 6, "q": "You have migrated your application to AWS recently. How can you view the AWS costs applied to your account?", "o": [["A", "Using the AWS Cost & Usage Report."], ["B", "Using the AWS Total Cost of Ownership (TCO) dashboard."], ["C", "Using the AWS CloudWatch logs dashboard."], ["D", "Using the Amazon VPC dashboard."]], "a": ["A"]}, {"n": 7, "q": "Which of the following are valid Amazon EC2 Reserved Instance types? (Choose TWO)", "o": [["A", "Convertible."], ["B", "Expedited."], ["C", "Bulk."], ["D", "Spot."], ["E", "Standard."]], "a": ["A", "E"]}, {"n": 8, "q": "Which of the following services gives you access to all AWS auditor-issued reports and certifications?", "o": [["A", "AWS Artifact."], ["B", "AWS Config."], ["C", "Amazon CloudWatch."], ["D", "AWS CloudTrail."]], "a": ["A"]}, {"n": 9, "q": "You manage a blog on AWS that has different environments: development, testing, and production. What can you use to create a custom console for each environment to view and manage your resources easily?", "o": [["A", "AWS Resource Groups."], ["B", "AWS Placement Groups."], ["C", "AWS Management Console."], ["D", "AWS Tag Editor."]], "a": ["A"]}, {"n": 10, "q": "Which AWS service collects metrics from running EC2 instances?", "o": [["A", "Amazon Inspector."], ["B", "Amazon CloudWatch."], ["C", "AWS CloudFormation."], ["D", "AWS CloudTrail."]], "a": ["B"]}, {"n": 11, "q": "Your web application currently faces performance issues and suffers from long load times. Which of the following AWS services could help fix these issues and improve performance?", "o": [["A", "Amazon Detective."], ["B", "AWS X-Ray."], ["C", "AWS Security Hub."], ["D", "AWS Shield."]], "a": ["B"]}, {"n": 12, "q": "Which of the following compute resources are serverless? (Choose TWO)", "o": [["A", "Amazon EC2."], ["B", "AWS Fargate."], ["C", "AWS Lambda."], ["D", "Amazon ECS."], ["E", "Amazon EMR."]], "a": ["B", "C"]}, {"n": 13, "q": "For compliance and regulatory purposes, a government agency requires that their applications must run on hardware that is dedicated to them only. How can you meet this requirement?", "o": [["A", "Use EC2 Dedicated Hosts."], ["B", "Use EC2 Reserved Instances."], ["C", "Use EC2 Spot Instances."], ["D", "Use EC2 On-demand Instances."]], "a": ["A"]}, {"n": 14, "q": "Which AWS Cost Governance best practice recommends refining workloads regularly to make the most of existing AWS resources and reduce costs?", "o": [["A", "Tagging Enforcement."], ["B", "Architecture Optimization."], ["C", "Budgeting Processes."], ["D", "Resource Controls."]], "a": ["B"]}, {"n": 15, "q": "An organization needs to build a financial application that requires support for ACID transactions. Which AWS database service is most appropriate in this case?", "o": [["A", "RedShift."], ["B", "RDS."], ["C", "CloudHSM."], ["D", "DMS."]], "a": ["B"]}, {"n": 16, "q": "What can you use to assign permissions directly to an IAM user?", "o": [["A", "IAM Identity."], ["B", "IAM Group."], ["C", "IAM Role."], ["D", "IAM Policy."]], "a": ["D"]}, {"n": 17, "q": "The owner of an E-Commerce application notices that the compute capacity requirements vary heavily from time to time. What makes AWS more economical than traditional data centers for this type of application?", "o": [["A", "AWS allows customers to launch powerful EC2 instances to handle spikes in load."], ["B", "AWS allows customers to pay upfront to get bigger discounts."], ["C", "AWS allows customers to launch and terminate EC2 instances based on demand."], ["D", "AWS allows customers to choose cheaper types of EC2 instances that best fit their needs."]], "a": ["C"]}, {"n": 18, "q": "Amazon RDS supports multiple database engines to choose from. Which of the following is not one of them?", "o": [["A", "PostgreSQL."], ["B", "Oracle."], ["C", "Microsoft SQL Server."], ["D", "Teradata."]], "a": ["D"]}, {"n": 19, "q": "Which of the following AWS services would help you migrate on-premise databases to AWS?", "o": [["A", "AWS DMS."], ["B", "Amazon S3 Transfer Acceleration."], ["C", "AWS Directory Service."], ["D", "AWS Transit Gateway."]], "a": ["A"]}, {"n": 20, "q": "For new AWS customers, what is the EASIEST way to launch a simple WordPress website on AWS?", "o": [["A", "Run WordPress on an Amazon Lightsail instance."], ["B", "Install WordPress on an Amazon EC2 instance."], ["C", "Use the Amazon S3 Web hosting feature."], ["D", "Host the website directly on AWS Cloud Development Kit (AWS CDK)."]], "a": ["A"]}, {"n": 21, "q": "Which of the following would you use to manage your encryption keys in the AWS Cloud? (Choose TWO)", "o": [["A", "AWS KMS."], ["B", "AWS Certificate Manager."], ["C", "AWS CodeDeploy."], ["D", "AWS CodeCommit."], ["E", "CloudHSM."]], "a": ["A", "E"]}, {"n": 22, "q": "Which of the following services allows you to install and run custom relational database software?", "o": [["A", "Amazon EC2."], ["B", "Amazon Cognito."], ["C", "Amazon RDS."], ["D", "Amazon Inspector."]], "a": ["A"]}, {"n": 23, "q": "Your application requirements for CPU and RAM are changing in an unpredictable way. Which service can be used to dynamically adjust these resources based on load?", "o": [["A", "Auto Scaling."], ["B", "ELB."], ["C", "Amazon Route53."], ["D", "Amazon Elastic Container Service."]], "a": ["A"]}, {"n": 24, "q": "A company has infrastructure hosted in an on-premises data center. They currently have an operations team that takes care of identity management. If they decide to migrate to the AWS cloud, which of the following services would help them perform the same role in AWS?", "o": [["A", "AWS IAM."], ["B", "AWS Outposts."], ["C", "AWS Federation."], ["D", "Amazon Redshift."]], "a": ["A"]}, {"n": 25, "q": "What are some key design principles for designing public cloud systems? (Choose TWO)", "o": [["A", "Reserved capacity instead of on demand."], ["B", "Loose coupling over tight coupling."], ["C", "Servers instead of managed services."], ["D", "Disposable resources instead of fixed servers."], ["E", "Multi-AZ deployments instead of multi-region deployments."]], "a": ["B", "D"]}, {"n": 26, "q": "Where can AWS account owners get a list of all users in their account, including the status of their AWS credentials?", "o": [["A", "AWS CloudTrail Trails."], ["B", "IAM Credential Report."], ["C", "AWS Artifact reports."], ["D", "AWS Cost and Usage Report."]], "a": ["B"]}, {"n": 27, "q": "Which of the following services enables you to easily generate and use your own encryption keys in the AWS Cloud?", "o": [["A", "AWS Shield."], ["B", "AWS Certificate Manager."], ["C", "AWS CloudHSM."], ["D", "AWS WAF."]], "a": ["C"]}, {"n": 28, "q": "You have developed a web application targeting a global audience. Which of the following will help you achieve the highest redundancy and fault tolerance from an infrastructure perspective?", "o": [["A", "There is no need to architect for these capabilities in AWS, as AWS is redundant by default."], ["B", "Deploy the application in a single Availability Zone."], ["C", "Deploy the application in multiple Availability Zones in a single AWS region."], ["D", "Deploy the application in multiple Availability Zones in multiple AWS regions."]], "a": ["D"]}, {"n": 29, "q": "For some services, AWS automatically replicates data across multiple Availability Zones to provide fault tolerance in the event of a server failure or Availability Zone outage. Select TWO services that automatically replicate data across Availability Zones.", "o": [["A", "Instance Store."], ["B", "S3."], ["C", "DynamoDB."], ["D", "Amazon Route 53."], ["E", "AWS VPN."]], "a": ["B", "C"]}, {"n": 30, "q": "Which of the following factors affect Amazon CloudFront cost? (Choose TWO)", "o": [["A", "Number of Requests."], ["B", "Traffic Distribution."], ["C", "Number of Volumes."], ["D", "Instance type."], ["E", "Storage Class."]], "a": ["A", "B"]}, {"n": 31, "q": "Which of the following resources can an AWS customer use to learn more about prohibited uses of the services offered by AWS?", "o": [["A", "AWS Service Control Policies (SCPs)."], ["B", "AWS Artifact."], ["C", "AWS Budgets."], ["D", "AWS Acceptable Use Policy."]], "a": ["D"]}, {"n": 32, "q": "Which of the following security resources are available to any user for free? (Choose TWO)", "o": [["A", "AWS Bulletins."], ["B", "AWS TAM."], ["C", "AWS Support APl."], ["D", "AWS Security Blog."], ["E", "AWS Classroom Training."]], "a": ["A", "D"]}, {"n": 33, "q": "How can you protect data stored on Amazon S3 from accidental deletion?", "o": [["A", "By enabling S3 Versioning."], ["B", "By configuring S3 Bucket Policies."], ["C", "By configuring S3 Lifecycle Policies."], ["D", "By disabling S3 Cross-Region Replication (CRR)."]], "a": ["A"]}, {"n": 34, "q": "Which of the following is the responsibility of AWS according to the AWS Shared Responsibility Model?", "o": [["A", "Securing regions and edge locations."], ["B", "Performing auditing tasks."], ["C", "Monitoring AWS resources usage."], ["D", "Securing access to AWS resources."]], "a": ["A"]}, {"n": 35, "q": "Which of the following AWS support plans provides access to only the seven core AWS Trusted Advisor checks?", "o": [["A", "Business & Enterprise Support."], ["B", "Basic & Developer Support."], ["C", "Developer & Enterprise Support."], ["D", "Developer & Business Support."]], "a": ["B"]}, {"n": 36, "q": "Which of the following is NOT a benefit of using AWS Lambda?", "o": [["A", "AWS Lambda runs code without provisioning or managing servers."], ["B", "AWS Lambda provides resizable compute capacity in the cloud."], ["C", "There is no charge when your AWS Lambda code is not running."], ["D", "AWS Lambda can be called directly from any mobile app."]], "a": ["D"]}, {"n": 37, "q": "How does AWS help customers achieve compliance in the cloud?", "o": [["A", "It's not possible to meet regulatory compliance requirements in the Cloud."], ["B", "AWS applies the most common Cloud security standards, and is responsible for complying with customers’ applicable laws and regulations."], ["C", "AWS has many common assurance certifications such as ISO 9001 and HIPAA."], ["D", "Many AWS services are assessed regularly to comply with local laws and regulations."]], "a": ["C"]}, {"n": 38, "q": "Who is responsible for scaling a DynamoDB database in the AWS Shared Responsibility Model?", "o": [["A", "Your security team."], ["B", "Your development team."], ["C", "AWS."], ["D", "Your internal DevOps team."]], "a": ["C"]}, {"n": 39, "q": "You are working as a web app developer. You are currently facing issues in media playback for mobile devices because your media format is not supported. Which of the following AWS services can help you convert your media into another format?", "o": [["A", "Amazon Elastic Transcoder."], ["B", "Amazon Pinpoint."], ["C", "AmazonS3."], ["D", "Amazon Rekognition."]], "a": ["A"]}, {"n": 40, "q": "What are the benefits of the AWS Organizations service? (Choose TWO)", "o": [["A", "Control access to AWS services."], ["B", "Help organizations design and maintain an accelerated path to successful cloud adoption."], ["C", "Manage your organization’s payment methods."], ["D", "Help organization achieve their desired business outcomes with AWS."], ["E", "Consolidate billing across multiple AWS accounts."]], "a": ["A", "E"]}, {"n": 41, "q": "Which AWS service allows you to build a data warehouse in the cloud?", "o": [["A", "AWS Shield."], ["B", "Amazon Redshift."], ["C", "Amazon RDS."], ["D", "Amazon Comprehend."]], "a": ["B"]}, {"n": 42, "q": "What AWS service allows you to buy third-party software solutions and services that run on AWS resources?", "o": [["A", "AWS Application Discovery service."], ["B", "Amazon DevPay."], ["C", "AWS Marketplace."], ["D", "Resource Groups."]], "a": ["C"]}, {"n": 43, "q": "Which of the following services is an AWS repository management system that allows for storing, versioning, and managing your application code?", "o": [["A", "AWS CodePipeline."], ["B", "AWS CodeCommit."], ["C", "AWS X-Ray."], ["D", "Amazon Inspector."]], "a": ["B"]}, {"n": 44, "q": "Which AWS service can be used to route end users to the nearest AWS Region to reduce latency?", "o": [["A", "Amazon Cognito."], ["B", "AWS Systems Manager."], ["C", "AWS Cloud9."], ["D", "Amazon Route 53."]], "a": ["D"]}, {"n": 45, "q": "Which feature enables users to sign into their AWS accounts with their existing corporate credentials?", "o": [["A", "Federation."], ["B", "Access keys."], ["C", "IAM Permissions."], ["D", "WAF rules."]], "a": ["A"]}, {"n": 46, "q": "According to the AWS shared responsibility model, what are the controls that customers fully inherit from AWS? (Choose TWO)", "o": [["A", "Awareness and Training."], ["B", "Communications controls."], ["C", "Data center security controls."], ["D", "Environmental controls."], ["E", "Resource Configuration Management."]], "a": ["C", "D"]}, {"n": 47, "q": "What can you access by visiting the URL: http://status.aws.amazon.com?", "o": [["A", "AWS Billing Dashboard."], ["B", "AWS Cost Dashboard."], ["C", "AWS Service Health Dashboard."], ["D", "AWS Security Dashboard."]], "a": ["C"]}, {"n": 48, "q": "Which of the following procedures can reduce latency when your end users are retrieving data? (Choose TWO)", "o": [["A", "Store media assets in the region closest to your end users."], ["B", "Store media assets on an additional EBS volume and increase the capacity of your server."], ["C", "Replicate media assets to at least two availability zones."], ["D", "Reduce the size of media assets using the Amazon Elastic Transcoder."], ["E", "Store media assets in S3 and use CloudFront to distribute these assets."]], "a": ["A", "E"]}, {"n": 49, "q": "Which of the following are part of the seven design principles for security in the cloud? (Choose TWO)", "o": [["A", "Use manual monitoring techniques to protect your AWS resources."], ["B", "Use IAM roles to grant temporary access instead of long-term credentials."], ["C", "Scale horizontally to protect from failures."], ["D", "Enable real-time traceability."], ["E", "Never store sensitive data in the cloud."]], "a": ["B", "D"]}, {"n": 50, "q": "A company is migrating production workloads to AWS, and they are concerned about cost management across different departments. Which option should the company implement to categorize and track AWS spending?", "o": [["A", "Use the AWS Pricing Calculator service to monitor the costs incurred by each department."], ["B", "Use Amazon Aurora to forecast AWS spending based on usage."], ["C", "Apply cost allocation tags to segment AWS costs by different e projects and departments."], ["D", "Configure AWS Price List API to receive billing updates for each department automatically."]], "a": ["C"]}], "8": [{"n": 1, "q": "What is the main benefit of attaching security groups to an Amazon RDS instance?", "o": [["A", "Manages user access and encryption keys."], ["B", "Controls what IP address ranges can connect to your database instance."], ["C", "Deploys SSL/TLS certificates for use with your database instance."], ["D", "Distributes incoming traffic across multiple targets."]], "a": ["B"]}, {"n": 2, "q": "A company wants to use Amazon Elastic Container Service (Amazon ECS) to run its containerized applications. For compliance reasons, the company wants to retain complete visibility and control over the underlying server cluster. Which Amazon ECS launch type will satisfy these requirements?", "o": [["A", "EC2 launch type."], ["B", "Fargate launch type."], ["C", "Lightsail launch type."], ["D", "Lambda launch type."]], "a": ["A"]}, {"n": 3, "q": "You have multiple standalone AWS accounts and you want to decrease your AWS monthly charges. What should you do?", "o": [["A", "Try to remove unnecessary AWS accounts."], ["B", "Add the accounts to an AWS Organization and use Consolidated Billing."], ["C", "Track the AWS charges that are incurred by the member accounts."], ["D", "Enable AWS tiered-pricing before provisioning resources."]], "a": ["B"]}, {"n": 4, "q": "You have been tasked with auditing the security of your VPC. As part of this process, you need to start by analyzing what inbound and outbound traffic is allowed on your EC2 instances. What two parts of the VPC do you need to check to accomplish this task?", "o": [["A", "Network ACLs and Traffic Manager."], ["B", "Network ACLs and Subnets."], ["C", "Security Groups and Internet Gateways."], ["D", "Security Groups and Network ACLs."]], "a": ["D"]}, {"n": 5, "q": "What does the AWS \"Business\" support plan provide? (Choose TWO)", "o": [["A", "Access to the full set of Trusted Advisor checks."], ["B", "Support Concierge Service."], ["C", "Less than 15 minutes response-time support if your business critical system goes down."], ["D", "AWS Support API."], ["E", "Proactive Technical Account Management."]], "a": ["A", "D"]}, {"n": 6, "q": "You have just finished writing your application code. Which service can be used to automate the deployment and scaling of your application?", "o": [["A", "Amazon Simple Storage Service."], ["B", "AWS Elastic Beanstalk."], ["C", "AWS CodeCommit."], ["D", "Amazon Elastic File System."]], "a": ["B"]}, {"n": 7, "q": "Which statement is true in relation to security in AWS?", "o": [["A", "AWS manages everything related to EC2 operating systems."], ["B", "AWS customers are responsible for patching any database software running on Amazon EC2."], ["C", "Server side encryption is the responsibility of AWS."], ["D", "AWS is responsible for the security of your application."]], "a": ["B"]}, {"n": 8, "q": "Amazon EC2 instances are conceptually very similar to traditional servers. However, using Amazon EC2 server instances in the same manner as traditional hardware server instances is only a starting point. What are the main benefits of using the AWS EC2 instances instead of traditional servers? (Choose TWO)", "o": [["A", "Improves Fault-Tolerance."], ["B", "Provides your business with a seamless remote accessibility."], ["C", "Prevents unauthorized users from getting into your network."], ["D", "Provides automatic data backups."], ["E", "Can be scaled manually in a shorter period of time."]], "a": ["A", "E"]}, {"n": 9, "q": "Which statement is true regarding AWS pricing? (Choose TWO)", "o": [["A", "With the AWS pay-as-you-go pricing model, you don't have to pay any upfront fee."], ["B", "You have no responsibility for third-party software license costs."], ["C", "You only pay for the individual services that you need with no long-term contracts."], ["D", "For some services, you have to pay a startup fee in order to get the service running."], ["E", "There are no reservations on AWS, you only pay for what you use."]], "a": ["A", "C"]}, {"n": 10, "q": "Which AWS service provides the EASIEST way to set up and manage a secure, well-architected, multi-account AWS environment?", "o": [["A", "AWS Control Tower."], ["B", "Amazon Macie."], ["C", "AWS Systems Manager Patch Manager."], ["D", "AWS Security Hub."]], "a": ["A"]}, {"n": 11, "q": "A company is running a large web application that needs to always be available. The application tends to slow down when CPU usage is greater than 60%. How can they track when CPU usage goes above 60% for any of the EC2 Instances in their account?", "o": [["A", "Use CloudFront to monitor the CPU usage."], ["B", "Set the AWS Config CPU threshold to 60% to receive a notification when EC2 usage exceeds that value."], ["C", "Use CloudWatch Alarms to monitor the CPU and alert when the CPU usage is >= 60%."], ["D", "Use SNS to monitor the utilization of the server."]], "a": ["C"]}, {"n": 12, "q": "What is the recommended storage option when hosting an often-changing database on an Amazon EC2 instance?", "o": [["A", "Amazon EBS."], ["B", "Amazon RDS."], ["C", "You can't run a database inside an Amazon EC2 instance."], ["D", "Amazon DynamoDB."]], "a": ["A"]}, {"n": 13, "q": "You are working as a site reliability engineer (SRE) in an AWS environment, which of the following services helps monitor your applications?", "o": [["A", "Amazon CloudWatch."], ["B", "Amazon CloudSearch."], ["C", "Amazon Elastic MapReduce."], ["D", "Amazon CloudHSM."]], "a": ["A"]}, {"n": 14, "q": "What factors determine how you are charged when using AWS Lambda? (Choose TWO)", "o": [["A", "Storage consumed."], ["B", "Number of requests to your functions."], ["C", "Number of volumes."], ["D", "Placement groups."], ["E", "Compute time consumed."]], "a": ["B", "E"]}, {"n": 15, "q": "What are the main differences between an IAM user and an IAM role in AWS? (Choose TWO)", "o": [["A", "An IAM user is uniquely associated with only one person, however a role is intended to be assumable by anyone who needs it."], ["B", "An IAM user has permanent credentials associated with it, however a role has temporary credentials associated with it."], ["C", "IAM users are more cost effective than IAM roles."], ["D", "A role is uniquely associated with only one person, however an IAM user is intended to be assumable by anyone who needs it."], ["E", "An IAM user has temporary credentials associated with it, however a role has permanent credentials associated with it."]], "a": ["A", "B"]}, {"n": 16, "q": "Which of the following actions may reduce Amazon EBS costs? (Choose TWO)", "o": [["A", "Deleting unused buckets."], ["B", "Using reservations."], ["C", "Deleting unnecessary snapshots."], ["D", "Changing the type of the volume."], ["E", "Distributing requests to multiple volumes."]], "a": ["C", "D"]}, {"n": 17, "q": "What does Amazon GuardDuty do to protect AWS accounts and workloads?", "o": [["A", "Notifies AWS customers about abuse events once they are reported."], ["B", "Continuously monitors AWS infrastructure and helps detect threats such as attacker reconnaissance or account compromise."], ["C", "Helps AWS customers identify the root cause of potential security issues."], ["D", "Checks security groups for rules that allow unrestricted access to AWS. resources."]], "a": ["B"]}, {"n": 18, "q": "Which database service should you use if your application and data schema require \"joins\" or complex transactions?", "o": [["A", "Amazon RDS."], ["B", "AWS Outposts."], ["C", "Amazon DocumentDB."], ["D", "Amazon DynamoDB."]], "a": ["A"]}, {"n": 19, "q": "Which of the following makes it easier for you to categorize, manage and filter your resources?", "o": [["A", "Amazon CloudWatch."], ["B", "AWS Service Catalog."], ["C", "AWS Directory Service."], ["D", "AWS Tagging."]], "a": ["D"]}, {"n": 20, "q": "What should you consider when storing data in Amazon Glacier?", "o": [["A", "Amazon Glacier only accepts data in a compressed format."], ["B", "Glacier can only be used to store frequently accessed data and data archives."], ["C", "Amazon Glacier does not provide immediate retrieval of data."], ["D", "Attach Glacier to an EC2 Instance to be able to store data."]], "a": ["C"]}, {"n": 21, "q": "Engineers are wasting a lot of time and effort managing batch computing software in traditional data centers. Which of the following AWS services allows them to easily run thousands of batch computing jobs?", "o": [["A", "Amazon EC2."], ["B", "AWS Batch."], ["C", "Lambda@Edge."], ["D", "AWS Fargate."]], "a": ["B"]}, {"n": 22, "q": "How can you increase your application’s fault-tolerance while it is being hosted in AWS?", "o": [["A", "Deploy your application across multiple EC2 instances."], ["B", "Deploy your application across multiple Availability Zones."], ["C", "Host your application on one powerful EC2 instance type instead of multiple smaller instances."], ["D", "Deploy the underlying application resources across multiple subnets."]], "a": ["B"]}, {"n": 23, "q": "Which of the following AWS Support Plans gives you 24/7 access to Cloud Support Engineers via email & phone? (Choose TWO)", "o": [["A", "Developer."], ["B", "Premium."], ["C", "Enterprise."], ["D", "Standard."], ["E", "Business."]], "a": ["C", "E"]}, {"n": 24, "q": "Which of the following requires an access key ID and a secret access key to get long-lived programmatic access to AWS resources? (Choose TWO)", "o": [["A", "IAM group."], ["B", "IAM user."], ["C", "IAM role."], ["D", "AWS account root user."], ["E", "TAM."]], "a": ["B", "D"]}, {"n": 25, "q": "Which of the following is a benefit of the \"Loose Coupling\" architecture principle?", "o": [["A", "It eliminates the need for change management."], ["B", "It allows for Cross-Region Replication."], ["C", "It helps AWS customers reduce Privileged Access to AWS resources."], ["D", "It allows individual application components or services to be modified without affecting other components."]], "a": ["D"]}, {"n": 26, "q": "A company needs to host a big data application on AWS using EC2 instances. Which of the following AWS Storage services would they choose to automatically get high throughput to multiple compute nodes?", "o": [["A", "Amazon Elastic Block Store."], ["B", "AWS Storage Gateway."], ["C", "Amazon Elastic File System."], ["D", "S3."]], "a": ["C"]}, {"n": 27, "q": "Which of the following Cloud Computing deployment models eliminates the need to run and maintain physical data centers?", "o": [["A", "On-premises."], ["B", "IaaS."], ["C", "PaaS."], ["D", "Cloud."]], "a": ["D"]}, {"n": 28, "q": "What are the benefits of the AWS Marketplace service? (Choose TWO)", "o": [["A", "Protects customers by performing periodic security checks on listed products."], ["B", "Per-second billing."], ["C", "Provides cheaper options for purchasing Amazon EC2 on-demand instances."], ["D", "Provides flexible pricing options that suit most customer needs."], ["E", "Provides software solutions that run on AWS or any other Cloud vendor."]], "a": ["D", "E"]}, {"n": 29, "q": "What is the benefit of Amazon EBS volumes being automatically replicated within the same availability zone?", "o": [["A", "Elasticity."], ["B", "Durability."], ["C", "Traceability."], ["D s."]], "a": ["A"]}, {"n": 39, "q": "A financial services company decides to migrate one of its applications to AWS. The application deals with sensitive data, such as credit card information, and must run on a PCI-compliant environment. Which of the following is the company’s responsibility when building a PCI-compliant environment in AWS? (Choose TWO)", "o": [["A", "Start the migration process immediately as all AWS services are PCI compliant."], ["B", "Ensure that AWS services are configured properly to meet all PCI DSS standards."], ["C", "Restrict any access to cardholder data and create a policy that addresses information security for all personnel."], ["D", "Configure the underlying infrastructure of AWS services to meet all PCI DSS requirements."], ["E", "Ensure that all PCI DSS physical security requirements are met."]], "a": ["B", "C"]}, {"n": 40, "q": "What is the maximum amount of data that can be stored in S3 in a single AWS account?", "o": [["A", "100 PetaBytes."], ["B", "Virtually unlimited storage."], ["C", "5TeraBytes."], ["D", "10 Exabytes."]], "a": ["B"]}, {"n": 41, "q": "Which pillar of the AWS Well-Architected Framework provides recommendations to help customers select the right compute resources based on workload requirements?", "o": [["A", "Operational Excellence."], ["B", "Security."], ["C", "Performance Efficiency."], ["D", "Reliability."]], "a": ["C"]}, {"n": 42, "q": "Which AWS service delivers data, videos, applications, and APIs to users globally with low latency and high transfer speeds?", "o": [["A", "Amazon Route 53."], ["B", "Amazon Connect."], ["C", "Amazon CloudFront."], ["D", "Amazon EC2."]], "a": ["C"]}, {"n": 43, "q": "Which of the following steps should be taken by a customer when conducting penetration testing on AWS?", "o": [["A", "Conduct penetration testing using Amazon Inspector, and then notify AWS support."], ["B", "Request and wait for approval from the customer’s internal security team, and then conduct testing."], ["C" WS Cloud?", "o": [["A", "Permissive security removes the administrative burden."], ["B", "Ability to focus on revenue-generating activities."], ["C", "Control over cloud network hardware."], ["D", "Choice of specific cloud hardware vendors."]], "a": ["B"]}, {"n": 20, "q": "Which of the following are categories of AWS Trusted Advisor? (Select TWO)", "o": [["A", "Fault Tolerance."], ["B", "Instance Usage."], ["C", "Infrastructure."], ["D", "Performance."], ["E", "Storage Capacity."]], "a": ["A", "D"]}, {"n": 21, "q": "What is Amazon CloudWatch?", "o": [["A", "A code repository with customizable build and team commit features."], ["B", "A metrics repository with customizable notification thresholds and channels."], ["C", "A security configuration repository with threat analytics."], ["D", "A rule repository of a web application firewall with automated vulnerability prevention features."]], "a": ["B"]}, {"n": 22, "q": "Under the AWS shared responsibility model, which of the following activities are the customer’s responsibility? (Select TWO)", "o": [["A", "Patching operating system components for Amazon Relational Database Server (Amazon RDS)."], ["B", "Encrypting data on the client-side."], ["C", "Training the data center staff."], ["D", "Configuring Network Access Control Lists (ACL)."], ["E", "Maintaining environmental controls within a data center."]], "a": ["B", "D"]}, {"n": 23, "q": "Under the shared responsibility model, which of the following is a shared control between a customer and AWS?", "o": [["A", "Physical controls."], ["B", "Patch management."], ["C", "Zone security."], ["D", "Data center auditing."]], "a": ["B"]}, {"n": 24, "q": "Which AWS service is used to pay AWS bills, and monitor usage and budget costs?", "o": [["A", "AWS Billing and Cost Management."], ["B", "Consolidated billing."], ["C", "Amazon CloudWatch."], ["D", "Amazon QuickSight."]], "a": ["A"]}, {"n": 25, "q": "How do customers benefit from Amazon’s massive economies of scale?", "o": [["A , "Use any AWS service and implement PCI controls at the application layer"], ["B", "Use an AWS service that is in-scope for PCI compliance and raise an AWS support ticket to enable PCI compliance at the application layer"], ["C", "Use any AWS service and raise an AWS support ticket to enable PCI compliance on that service"], ["D", "Use an AWS service that is in scope for PCI compliance and apply PCI controls at the application layer"]], "a": ["D"]}, {"n": 11, "q": "A company is building an application that requires the ability to send, store, and receive messages between application components. The company has another requirement to process messages in first-in, first-out (FIFO) order. Which AWS service should the company use?", "o": [["A", "AWS Step Functions"], ["B", "Amazon Simple Notification Service (Amazon SNS)"], ["C", "Amazon Kinesis Data Streams"], ["D", "Amazon Simple Queue Service (Amazon SQS)"]], "a": ["D"]}, {"n": 12, "q": "AnyCompany recently purchased Example Corp. Both companies use AWS resources, and AnyCompany wants a single aggregated bill. Which option allows AnyCompany to receive a single bill?", "o": [["A", "Example Corp. must submit a request to its AWS solutions architect or AWS technical account manager to link the accounts and consolidate billing."], ["B", "AnyCompany must create a new support case in the AWS Support Center requesting that both bills be combined."], ["C", "Send an invitation to join the organization from AnyCompany's AWS Organizations master account to Example Corp."], ["D", "Migrate the Example Corp. VPCs, Amazon EC2 instances, and other resources into the AnyCompany AWS account."]], "a": ["C"]}, {"n": 13, "q": "Which tool can be used to create alerts when the actual or forecasted cost of AWS services exceeds a certain threshold?", "o": [["A", "Cost Explorer"], ["B", "AWS Budgets"], ["C", "AWS Cost and Usage Report"], ["D", "AWS CloudTrail"]], "a": ["B"]}, {"n": 14, "q": "A user has limited knowledge of AWS services, but wants to quickly deploy a scalable Node.js application in the AWS Cloud. Which service should be used to deploy the application?", "o": [["A", "AWS CloudFormation"], ["B", "AWS Elastic Beanstalk"], ["C", "Amazon EC2"], ["D", "AWS OpsWorks"]], "a": ["B"]}, {"n": 15, "q": "Which AWS Trusted Advisor check is available to all AWS users?", "o": [["A", "Core checks"], ["B", "All checks"], ["C", "Cost optimization checks"], ["D", "Fault tolerance checks"]], "a": ["A"]}, {"n": 16, "q": "A web developer is concerned that a DDoS attack could target an application. Which AWS services or features can help protect against such an attack? (Choose two.)", "o": [["A", "AWS Shield"], ["B", "AWS CloudTrail"], ["C", "Amazon CloudFront"], ["D", "AWS Support Center"], ["E", "AWS Service Health Dashboard"]], "a": ["A", "C"]}, {"n": 17, "q": "Which AWS service gives users on-demand, self-service access to AWS compliance control reports?", "o": [["A", "AWS Config"], ["B", "Amazon GuardDuty"], ["C", "AWS Trusted Advisor"], ["D", "AWS Artifact"]], "a": ["D"]}, {"n": 18, "q": "A company wants to provide one of its employees with access to Amazon RDS. The company also wants to limit the interaction to only the AWS CLI and AWS software development kits (SDKs). Which combination of actions should the company take to meet these requirements while following the principles of least privilege? (Choose two.)", "o": [["A", "Create an IAM user and provide AWS Management Console access only."], ["B", "Create an IAM user and provide programmatic access only."], ["C", "Create an IAM role and provide AWS Management Console access only."], ["D", "Create an IAM policy with administrator access and attach it to the IAM user."], ["E", "Create an IAM policy with Amazon RDS access and attach it to the IAM user."]], "a": ["B", "E"]}, {"n": 19, "q": "A company has a compliance requirement to record and evaluate configuration changes, as well as perform remediation actions on AWS resources. Which AWS service should the company use?", "o": [["A", "AWS Config"], ["B", "AWS Secrets Manager"], ["C", "AWS CloudTrail"], ["D", "AWS Trusted Advisor"]], "a": ["A"]}, {"n": 20, "q": "What are the advantages of deploying an application with Amazon EC2 instances in multiple Availability Zones? (Choose two.)", "o": [["A", "Preventing a single point of failure"], ["B", "Reducing the operational costs of the application"], ["C", "Allowing the application to serve cross-region users with low latency"], ["D", "Increasing the availability of the application"], ["E", "Increasing the load of the application"]], "a": ["A", "D"]}, {"n": 21, "q": "A workload on AWS will run for the foreseeable future by using a consistent number of Amazon EC2 instances. What pricing model will minimize cost while ensuring that compute resources remain available?", "o": [["A", "Dedicated Hosts"], ["B", "On-Demand Instances"], ["C", "Spot Instances"], ["D", "Reserved Instances"]], "a": ["D"]}, {"n": 22, "q": "Which tool can be used to identify scheduled changes to the AWS infrastructure?", "o": [["A", "AWS Personal Health Dashboard"], ["B", "AWS Trusted Advisor"], ["C", "Billing Dashboard"], ["D", "AWS Config"]], "a": ["A"]}, {"n": 23, "q": "Which of the following is the customer's responsibility when using Amazon RDS?", "o": [["A", "Patching the operating system of underlying hardware"], ["B", "Controlling traffic to and from the database through security groups"], ["C", "Running backups that enable point-in-time recovery of a DB instance"], ["D", "Replacing failed DB instances"]], "a": ["B"]}, {"n": 24, "q": "What is the customer's responsibility when using AWS Lambda?", "o": [["A", "Operating system configuration"], ["B", "Application management"], ["C", "Platform management"], ["D", "Code encryption"]], "a": ["B"]}, {"n": 25, "q": "A company wants to be notified when its AWS Cloud costs or usage exceed defined thresholds. Which AWS service will support these requirements?", "o": [["A", "AWS Budgets"], ["B", "Cost Explorer"], ["C", "AWS CloudTrail"], ["D", "Amazon Macie"]], "a": ["A"]}, {"n": 26, "q": "Which AWS service provides the ability to host a NoSQL database in the AWS Cloud?", "o": [["A", "Amazon Aurora"], ["B", "Amazon DynamoDB"], ["C", "Amazon RDS"], ["D", "Amazon Redshift"]], "a": ["B"]}, {"n": 27, "q": "Which AWS service allows customers to purchase unused Amazon EC2 capacity at an often discounted rate?", "o": [["A", "Reserved Instances"], ["B", "On-Demand Instances"], ["C", "Dedicated Instances"], ["D", "Spot Instances"]], "a": ["D"]}, {"n": 28, "q": "Which AWS service or feature requires an internet service provider (ISP) and a colocation facility to be implemented?", "o": [["A", "AWS VPN"], ["B", "Amazon Connect"], ["C", "AWS Direct Connect"], ["D", "Internet gateway"]], "a": ["C"]}, {"n": 29, "q": "Which AWS services offer compute capabilities? (Choose two.)", "o": [["A", "Amazon EC2"], ["B", "Amazon S3"], ["C", "Amazon Elastic Block Store (Amazon EBS)"], ["D", "Amazon Cognito"], ["E", "AWS Lambda"]], "a": ["A", "E"]}, {"n": 30, "q": "Which AWS service can be used to privately store and manage versions of source code?", "o": [["A", "AWS CodeBuild"], ["B", "AWS CodeCommit"], ["C", "AWS CodePipeline"], ["D", "AWS CodeStar"]], "a": ["B"]}, {"n": 31, "q": "Which AWS service should a cloud practitioner use to identify security vulnerabilities of an AWS account?", "o": [["A", "AWS Secrets Manager"], ["B", "Amazon Cognito"], ["C", "Amazon Macie"], ["D", "AWS Trusted Advisor"]], "a": ["D"]}, {"n": 32, "q": "A company wants to ensure its infrastructure is designed for fault tolerance and business continuity in the event of an environmental disruption. Which AWS infrastructure component should the company replicate across?", "o": [["A", "Edge locations"], ["B", "Availability Zones"], ["C", "Regions"], ["D", "Amazon Route 53"]], "a": ["C"]}, {"n": 33, "q": "Which AWS service or feature is used to send both text and email messages from distributed applications?", "o": [["A", "Amazon Simple Notification Service (Amazon SNS)"], ["B", "Amazon Simple Email Service (Amazon SES)"], ["C", "Amazon CloudWatch alerts"], ["D", "Amazon Simple Queue Service (Amazon SQS)"]], "a": ["A"]}, {"n": 34, "q": "Which AWS Cloud design principles can help increase reliability? (Choose two.)", "o": [["A", "Using monolithic architecture"], ["B", "Measuring overall efficiency"], ["C", "Testing recovery procedures"], ["D", "Adopting a consumption model"], ["E", "Automatically recovering from failure"]], "a": ["C", "E"]}, {"n": 35, "q": "A company is planning to launch an ecommerce site in a single AWS Region to a worldwide user base. Which AWS services will allow the company to reach users and provide low latency and high transfer speeds? (Choose two.)", "o": [["A", "Application Load Balancer"], ["B", "AWS Global Accelerator"], ["C", "AWS Direct Connect"], ["D", "Amazon CloudFront"], ["E", "AWS Lambda"]], "a": ["B", "D"]}, {"n": 36, "q": "A company wants to connect to AWS over a private, low-latency connection from its remote office. What is the recommended method to meet these requirements?", "o": [["A", "Create a VPN tunnel"], ["B", "Connect across the public internet"], ["C", "Use VPC peering to create a connection."], ["D", "Use AWS Direct Connect."]], "a": ["D"]}, {"n": 37, "q": "Which AWS service can be used to retrieve compliance reports on demand?", "o": [["A", "AWS Secrets Manager"], ["B", "AWS Artifact"], ["C", "AWS Security Hub"], ["D", "AWS Certificate Manager"]], "a": ["B"]}, {"n": 38, "q": "A company has an AWS-hosted website located behind an Application Load Balancer. The company wants to safeguard the website from SQL injection or cross-site scripting. Which AWS service should the company use?", "o": [["A", "Amazon GuardDuty"], ["B", "AWS WAF"], ["C", "AWS Trusted Advisor"], ["D", "Amazon Inspector"]], "a": ["B"]}, {"n": 39, "q": "How should a web application be deployed to ensure high availability in the AWS Cloud?", "o": [["A", "Deploy multiple instances of the application in multiple Availability Zones."], ["B", "Deploy multiple instances of the application in a single Availability Zone."], ["C", "Deploy the application to a compute-optimized Amazon EC2 instance in a single Availability Zone."], ["D", "Deploy the application in one Amazon EC2 instance in an Auto Scaling group."]], "a": ["A"]}, {"n": 40, "q": "A company is running a self-managed Oracle database directly on Amazon EC2 for its steady-state database. The company wants to reduce compute costs. Which option should the company use to maximize savings over a 3-year term?", "o": [["A", "EC2 Dedicated Instances"], ["B", "EC2 Spot Instances"], ["C", "EC2 Reserved Instances"], ["D", "EC2 On-Demand Instances"]], "a": ["C"]}, {"n": 41, "q": "An external auditor has requested that a company provide a list of all its IAM users, including the status of users' credentials and access keys. What it the SIMPLEST way to provide this information?", "o": [["A", "Create an IAM user account for the auditor, granting the auditor administrator permissions."], ["B", "Take a screenshot of each user's page in the AWS Management Console, then provide the screenshots to the auditor."], ["C", "Download the IAM credential report, then provide the report to the auditor."], ["D", "Download the AWS Trusted Advisor report, then provide the report to the auditor."]], "a": ["C"]}, {"n": 42, "q": "What are the benefits of consolidated billing for AWS Cloud services? (Choose two.)", "o": [["A", "Volume discounts"], ["B", "A minimal additional fee for use"], ["C", "One bill for multiple accounts"], ["D", "Installment payment options"], ["E", "Custom cost and usage budget creation"]], "a": ["A", "C"]}, {"n": 43, "q": "A company is expecting a short-term spike in internet traffic for its application. During the traffic increase, the application cannot be interrupted. The company also needs to minimize cost and maximize flexibility. Which Amazon EC2 instance type should the company use to meet these requirements?", "o": [["A", "On-Demand Instances"], ["B", "Spot Instances"], ["C", "Reserved Instances"], ["D", "Dedicated Hosts"]], "a": ["A"]}, {"n": 44, "q": "A company wants to track AWS resource configuration changes for compliance reasons. Which AWS feature can be used to meet this requirement?", "o": [["A", "AWS Cost and Usage Report"], ["B", "AWS Organizations service control policies (SCPs)"], ["C", "AWS Config rules"], ["D", "VPC Flow Logs"]], "a": ["C"]}, {"n": 45, "q": "A company is building an application that needs to deliver images and videos globally with minimal latency. Which approach can the company use to accomplish this in a cost effective manner?", "o": [["A", "Deliver the content through Amazon CloudFront."], ["B", "Store the content on Amazon S3 and enable S3 cross-region replication."], ["C", "Implement a VPN across multiple AWS Regions."], ["D", "Deliver the content through AWS PrivateLink."]], "a": ["A"]}, {"n": 46, "q": "The AWS IAM best practice for granting least privilege is to:", "o": [["A", "apply an IAM policy to an IAM group and limit the size of the group."], ["B", "require multi-factor authentication (MFA) for all IAM users."], ["C", "require each IAM user who has different permissions to have multiple passwords."], ["D", "apply an IAM policy only to IAM users who require it."]], "a": ["D"]}, {"n": 47, "q": "Which cloud computing benefit does AWS demonstrate with its ability to offer lower variable costs as a result of high purchase volumes?", "o": [["A", "Pay-as-you-go pricing"], ["B", "High availability"], ["C", "Global reach"], ["D", "Economies of scale"]], "a": ["D"]}, {"n": 48, "q": "A pharmaceutical company operates its infrastructure in a single AWS Region. The company has thousands of VPCs in a various AWS accounts that it wants to interconnect. Which AWS service or feature should the company use to help simplify management and reduce operational costs?", "o": [["A", "VPC endpoint"], ["B", "AWS Direct Connect"], ["C", "AWS Transit Gateway"], ["D", "VPC peering"]], "a": ["C"]}, {"n": 49, "q": "How can AWS enable a company to control expenses as an application's usage changes unpredictably?", "o": [["A", "AWS will refund the cost difference if a customer moves to larger servers."], ["B", "The application can be built to scale up or down automatically as resources are needed"], ["C", "Spot instances will automatically be used if the price is lower than on-demand instances."], ["D", "Amazon CloudWatch will automatically predict what resources are needed."]], "a": ["B"]}, {"n": 50, "q": "Which AWS service or feature can be used to prevent SQL injection attacks?", "o": [["A", "Security groups"], ["B", "Network ACLs"], ["C", "AWS WAF"], ["D", "IAM policy"]], "a": ["C"]}]};

{const sg=document.getElementById("examSeg");sg.innerHTML=EXAMS.map(e=>`<button type="button" id="ex-${e}" data-v="${e}" aria-pressed="${e==="1"}">Đề ${e}</button>`).join("")+`<button type="button" class="allb" id="ex-all" data-v="all" aria-pressed="false">Cả 23 đề</button>`}
const EXP={"1-1": "Management Console là giao diện web để quản lý AWS bằng cách bấm chuột. CLI là dòng lệnh trên terminal, SDK là thư viện lập trình, API là giao tiếp bằng code. Chỉ Console là giao diện web.", "1-2": "Horizontal scaling (mở rộng ngang) là thêm NHIỀU máy cùng cỡ. A, B, C đều là làm một máy to hơn (thêm CPU, RAM), tức là vertical scaling (mở rộng dọc).", "1-3": "CloudTrail ghi lại mọi lệnh API: ai làm, làm gì, lúc nào. Muốn biết ai đã terminate EC2 thì xem CloudTrail. Inspector quét lỗ hổng, Trusted Advisor đưa khuyến nghị, còn «EC2 Instance Usage Report» không cho biết ai thực hiện.", "1-4": "Trụ cột Reliability (độ tin cậy) nói về khả năng phục hồi nhanh khi lỗi (E) và tự động thêm tài nguyên để đáp ứng nhu cầu (B). A thuộc trụ cột Security. C sai vì phần lớn dịch vụ AWS là dịch vụ theo Region, không phải global. D là chính sách bồi thường (SLA), không phải tính tin cậy của kiến trúc.", "1-5": "Trách nhiệm của khách hàng thay đổi tùy dịch vụ. Với EC2 (IaaS), khách hàng phải vá OS. Với RDS hay Lambda (dịch vụ được quản lý), AWS lo phần đó. C sai vì vá OS trên EC2 là việc của khách hàng. B và D đảo ngược trách nhiệm.", "1-6": "Khi bật consolidated billing, mức giảm giá của Reserved Instance được chia sẻ cho TẤT CẢ tài khoản trong tổ chức, không chỉ tài khoản quản lý. RI chỉ là cách tính giá, không làm máy chạy nhanh hơn (C sai). Consolidated billing có lợi ích chi phí thật (D sai).", "1-7": "Triển khai trên nhiều Region VÀ nhiều AZ cho mức sẵn sàng cao nhất: nếu cả một Region gặp sự cố thì Region khác vẫn phục vụ. Nhiều AZ chỉ bảo vệ trong một Region. Edge location dùng cho CloudFront, không chạy ứng dụng. Subnet và VPC không tạo thêm vị trí vật lý.", "1-8": "Snowball là thiết bị vật lý giúp chuyển lượng lớn dữ liệu vào và ra khỏi AWS an toàn (E), và có khả năng xử lý dữ liệu tại chỗ (A), ví dụ bản Snowball Edge Compute Optimized. B là AWS Marketplace. C là Storage Gateway. D (cỡ exabyte) là Snowmobile.", "1-9": "Concierge Support Team là đội chuyên hỗ trợ về hoá đơn và tài khoản, chỉ có trong gói Enterprise. Health Dashboard xem tình trạng dịch vụ AWS. C và D không phải tên dịch vụ cụ thể của AWS.", "1-10": "Cách đơn giản và rẻ nhất là chạy thêm EC2 ở Region gần người dùng Mỹ. A sai vì latency-based routing là tính năng của Route 53, không phải Amazon Connect (tổng đài). B, đăng ký tên miền mới không làm giảm độ trễ. C, xây data center rất đắt và đi ngược lợi ích của cloud.", "1-11": "IAM user group dùng để gom user thành nhóm (team) và gán quyền cho cả nhóm cùng lúc. Role dùng cho quyền tạm thời, user là từng người, còn Organizations quản lý nhiều TÀI KHOẢN chứ không phải nhóm nhân viên trong một tài khoản.", "1-12": "AWS Database Migration Service (DMS) di chuyển CSDL lên AWS trong khi CSDL nguồn vẫn hoạt động bình thường. OpsWorks là công cụ quản lý cấu hình (đã ngừng). Server Migration Service di chuyển máy chủ (đã được thay bằng Application Migration Service). Application Discovery Service chỉ thu thập thông tin để lập kế hoạch.", "1-13": "Tự động tăng giảm tài nguyên theo nhu cầu để không trả tiền thừa chính là Elasticity (tính co giãn). Parallelize là xử lý song song. Monolithic architecture là kiến trúc nguyên khối, ngược với best practice.", "1-14": "Lợi ích: tăng tốc độ và sự linh hoạt (A), và AWS lo toàn bộ bảo mật vật lý cùng phần lớn bảo mật hạ tầng mạng (E). B sai vì khách hàng vẫn phải lo bảo mật trong cloud. C sai vì khách hàng KHÔNG kiểm soát hạ tầng vật lý. D sai vì AWS không vận hành ứng dụng thay khách hàng.", "1-15": "Decoupling (tách rời) giảm sự phụ thuộc giữa các thành phần, nên khi một phần hỏng thì phần khác vẫn chạy. A và C mô tả kiến trúc nguyên khối, ngược với decoupling. D là chức năng của CloudTrail.", "1-16": "Cost and Usage Report cung cấp dữ liệu chi phí chi tiết nhất, xem được hoạt động tính tiền EC2 của tháng trước. Budgets dùng để đặt ngân sách và cảnh báo. Pricing Calculator để ước tính chi phí tương lai. Systems Manager quản lý vận hành máy chủ. (Cost Explorer cũng xem được nhưng không có trong đáp án.)", "1-17": "Consolidated billing gộp mức sử dụng của tất cả tài khoản, nên tổng dùng nhiều hơn và được giảm giá theo khối lượng (volume discount), ví dụ giá S3 rẻ hơn khi dùng nhiều. A sai vì không giảm cố định một nửa. B sai vì có lợi ích chi phí thật. D sai vì Free Tier không được nhân lên.", "1-18": "Để giữ dữ liệu EBS an toàn: tạo snapshot để sao lưu (B), và mã hoá dữ liệu lưu trữ (C). A và E là trách nhiệm của AWS (phần cứng và data center). D không phải cách làm trên cloud.", "1-19": "Elasticity là tự động cấp phát tài nguyên AWS theo thay đổi của nhu cầu. A sai vì nói về tài nguyên on-premises. B sai vì ELB chỉ chia tải, việc scale là của Auto Scaling. C mô tả loose coupling.", "1-20": "Có 2 cách cảnh báo khi hoá đơn vượt ngưỡng: CloudWatch billing alarm kết hợp gửi thông báo qua SNS (A), và AWS Budgets (C). SES là dịch vụ gửi email chứ không theo dõi hoá đơn. CloudTrail chỉ ghi log API. Amazon Connect là tổng đài.", "1-21": "CloudFront dùng Edge Location để lưu bản sao nội dung gần người dùng, giảm độ trễ. Region và AZ là nơi chạy tài nguyên chính. Global Accelerator là một dịch vụ khác, không phải thứ CloudFront dùng.", "1-22": "Least privilege (quyền tối thiểu) nghĩa là chỉ cấp đúng quyền cần thiết, đúng lúc cần, không hơn. B và C cấp quá nhiều quyền. D không cấp quyền gì thì không ai làm việc được.", "1-23": "3 mô hình điện toán đám mây là IaaS (ví dụ EC2), PaaS (ví dụ Elastic Beanstalk) và SaaS (ví dụ Gmail). Networking as a Service không thuộc 3 mô hình chuẩn này.", "1-24": "Video chỉ cần khi có vấn đề pháp lý, tức là gần như không bao giờ truy cập nhưng phải lưu lâu dài. Glacier Deep Archive là lớp rẻ nhất cho trường hợp này. Intelligent-Tiering dùng khi không đoán được tần suất. Marketplace là chợ phần mềm. EBS là ổ đĩa gắn EC2, đắt hơn nhiều.", "1-25": "Route 53 là dịch vụ DNS của AWS. Config theo dõi cấu hình, CloudFront là CDN, EMR xử lý big data.", "1-26": "Shield chống tấn công DDoS ở tầng mạng (layer 3, 4). WAF chống tấn công ở tầng ứng dụng (layer 7), bao gồm các kiểu DDoS dạng HTTP flood. Config, Cognito và KMS không chống DDoS.", "1-27": "ElastiCache là bộ nhớ đệm trong RAM (Redis, Memcached), lưu dữ liệu truy cập thường xuyên để trả về cực nhanh. EBS là ổ đĩa, chậm hơn RAM. Storage Gateway dùng cho hybrid. OpsWorks là công cụ quản lý cấu hình.", "1-28": "Chạy 1 ngày, không được gián đoạn thì chọn On-Demand. Reserved cần cam kết 1 hoặc 3 năm. Spot rẻ nhưng có thể bị thu hồi bất cứ lúc nào. Dedicated đắt và không cần thiết.", "1-29": "Tạo thumbnail cho hàng triệu ảnh, không cần chạy liên tục, chịu được gián đoạn thì Spot là rẻ nhất (giảm tới 90%). Nếu bị ngắt thì chạy lại phần còn lại là được.", "1-30": "CloudFront là mạng phân phối nội dung (CDN) toàn cầu. VPN và Direct Connect là cách kết nối mạng. Region là khu vực địa lý, không phải dịch vụ CDN.", "1-31": "AWS Artifact cho phép xem, chấp nhận và quản lý các thoả thuận pháp lý với AWS (ví dụ BAA), đồng thời tải báo cáo tuân thủ. Certificate Manager quản lý chứng chỉ SSL. Systems Manager quản lý máy chủ. Organizations quản lý nhiều tài khoản.", "1-32": "DynamoDB và EMR là dịch vụ được AWS quản lý: AWS lo hạ tầng, vá lỗi, mở rộng. EC2 thì khách hàng tự quản lý OS. VPC và IAM là tính năng bạn tự cấu hình, không phải dịch vụ vận hành thay bạn.", "1-33": "DynamoDB là CSDL NoSQL của AWS. Aurora là CSDL quan hệ (SQL). EBS là ổ đĩa. Redshift là kho dữ liệu phân tích.", "1-34": "Trong gói Enterprise, Technical Account Manager (TAM) là người liên hệ chính, theo sát và hỗ trợ bạn liên tục. IEM engineer chỉ hỗ trợ cho các sự kiện cụ thể như ngày ra mắt sản phẩm.", "1-35": "Cost Explorer hiển thị biểu đồ chi phí theo dịch vụ, theo thời gian, giúp xem tiền đang tiêu vào đâu. Không cần liên hệ AWS Support hay bộ phận tài chính của AWS.", "1-36": "Để dùng CLI, IAM user cần access key (gồm Access Key ID và Secret Access Key). User name và password chỉ dùng để đăng nhập Management Console.", "1-37": "Khi phát hiện tài nguyên AWS bị dùng vào mục đích xấu, liên hệ AWS Abuse team (Trust & Safety). Việc này làm được với mọi gói support, kể cả Basic. Concierge chỉ có trong Enterprise và lo hoá đơn.", "1-38": "Shared controls là các phần mà AWS và khách hàng cùng làm, mỗi bên ở tầng của mình. Patch Management: AWS vá hạ tầng, khách hàng vá OS và ứng dụng. Configuration Management: AWS cấu hình hạ tầng, khách hàng cấu hình OS, CSDL, ứng dụng. IAM và VPC là việc của khách hàng. Data center là việc của AWS.", "1-39": "Để tự động phát hiện và xử lý lỗi: ELB kiểm tra sức khoẻ và ngừng gửi request tới máy lỗi; Auto Scaling tự thay máy lỗi bằng máy mới. Athena là truy vấn SQL, ECR là kho image, EC2 tự nó không tự phục hồi.", "1-40": "CloudFront là CDN, lưu video ở edge location gần người xem trên toàn thế giới để truyền nhanh. Kinesis Video Streams dùng để thu nhận luồng video từ camera, không phải để phân phối khoá học. SNS gửi thông báo, CloudFormation tạo hạ tầng.", "1-41": "Aurora (tương thích MySQL) có sao lưu tự động. A, MySQL tự cài trên EC2 thì phải tự lo backup. DynamoDB là NoSQL, không phải MySQL. Neptune là CSDL đồ thị.", "1-42": "CloudFormation cho phép quản lý hạ tầng bằng code (Infrastructure as Code) qua template JSON hoặc YAML. Config theo dõi cấu hình, SES gửi email, EMR xử lý big data.", "1-43": "Cấu hình thiết bị hạ tầng (máy chủ vật lý, thiết bị mạng của AWS) là trách nhiệm của AWS. Mã hoá phía client, phía server và cấu hình Security Group đều là việc khách hàng tự quyết định và thiết lập.", "1-44": "AWS Health Dashboard cho bạn góc nhìn cá nhân hoá về tình trạng dịch vụ ảnh hưởng tới tài nguyên của bạn (E), kèm hướng dẫn xử lý chi tiết (A). B là health check của ELB hoặc Auto Scaling. C là Trusted Advisor. D là Inspector.", "1-45": "CloudWatch giám sát hiệu năng EC2 (CPU, mạng, trạng thái), giúp tìm nguyên nhân khi ứng dụng không truy cập được. CloudTrail ghi lại ai làm gì, Config theo dõi cấu hình, Lambda là dịch vụ chạy code.", "1-46": "Trusted Advisor kiểm tra tài khoản và đưa ra khuyến nghị tối ưu, trong đó có nhóm Security (ví dụ cổng mở toang, root chưa bật MFA). Shield chỉ chống DDoS, không đưa khuyến nghị. Secrets Manager lưu mật khẩu.", "1-47": "Hai điều KHÔNG đúng: S3 không chạy được ứng dụng hay backend (B), vì nó chỉ lưu trữ object. S3 tự mở rộng, không cần scale thủ công (D). A, C, E đều đúng: dung lượng không giới hạn, mỗi object tối đa 5 TB, độ bền 11 số 9.", "1-48": "Khách hàng chịu trách nhiệm đặt quy tắc độ phức tạp mật khẩu IAM (D) và cấu hình quy tắc truy cập mạng như Security Group, NACL (E). Huỷ ổ đĩa, kiểm soát truy cập vật lý và vá hạ tầng mạng là việc của AWS.", "1-49": "AWS Quick Start (nay gọi là AWS Partner Solutions) là các bản triển khai tham chiếu dựng sẵn, giúp triển khai công nghệ phổ biến như IBM MQ nhanh nhất theo best practice. Aurora là CSDL, CloudWatch giám sát, OpsWorks quản lý cấu hình (đã ngừng).", "1-50": "Convertible RI cho phép đổi sang RI khác (dòng máy khác, mạnh hơn) trong thời hạn cam kết. Standard RI giảm giá nhiều hơn nhưng không đổi được dòng máy. Elastic RI và Premium RI không tồn tại.", "2-1": "AWS Organizations quản lý tập trung nhiều tài khoản: gộp hoá đơn (consolidated billing) và áp chính sách bảo mật (SCP) cho tất cả. Trusted Advisor đưa khuyến nghị, IAM groups dùng trong một tài khoản, Config theo dõi cấu hình.", "2-2": "S3 là lưu trữ dạng đối tượng (object storage). EBS và Instance Store là lưu trữ dạng khối (block). EFS là lưu trữ dạng file.", "2-3": "Auto Scaling tự động thêm hoặc bớt EC2 để khớp với nhu cầu, tránh trả tiền cho máy dùng không hết. ELB chỉ chia tải. Budgets và Cost Explorer chỉ theo dõi chi phí, không điều chỉnh tài nguyên.", "2-4": "Intelligent-Tiering tự chuyển dữ liệu giữa các lớp theo tần suất truy cập thực tế, phù hợp khi không đoán trước được. Glacier dành cho lưu trữ dài hạn, Standard cho truy cập thường xuyên, Standard-IA cho truy cập ít nhưng có thể đoán trước.", "2-5": "DynamoDB là CSDL NoSQL dạng key-value. Aurora và RDS là CSDL quan hệ. Redshift là kho dữ liệu phân tích.", "2-6": "Câu hỏi tìm điều SAI. On-Demand không có phí khởi tạo. B, C, D đều đúng: trả theo mức dùng, không cam kết, Linux tính tiền theo giây.", "2-7": "Trusted Advisor kiểm tra cấu hình bảo mật tài khoản (cổng mở, MFA chưa bật, bucket S3 công khai). Inspector quét lỗ hổng trên EC2 và container. SNS là gửi thông báo, CloudWatch giám sát hiệu năng, Concierge lo hoá đơn.", "2-8": "MFA (xác thực đa yếu tố) thêm một lớp bảo mật ngoài user name và mật khẩu, bằng mã từ app hoặc thiết bị. KMS quản lý khoá mã hoá dữ liệu, không phải cơ chế đăng nhập.", "2-9": "Infrastructure Event Management (IEM) có trong gói Enterprise, giúp lên kế hoạch kiến trúc và mở rộng cho các sự kiện lớn như ra mắt sản phẩm, đợt khuyến mãi. Knowledge Center là kho bài viết, Health Dashboard xem tình trạng dịch vụ, Concierge lo hoá đơn.", "2-10": "RDS là CSDL quan hệ được quản lý: AWS lo cài đặt, sao lưu, vá lỗi, khôi phục thảm họa, để DBA tập trung vào thiết kế dữ liệu. Redshift là kho dữ liệu, DynamoDB là NoSQL (không phải MySQL), CloudWatch là giám sát.", "2-11": "Best practice là tự động hoá mọi chỗ có thể, giúp thử nghiệm kiến trúc dễ dàng. A sai vì trên cloud đổi thiết kế rất dễ. B sai vì môi trường test chạy ngắn hạn, không nên mua reservation. D sai vì nên dùng elasticity thay vì cấp sẵn quá nhiều tài nguyên.", "2-12": "Khách hàng được tự kiểm thử xâm nhập (penetration test) trên tài nguyên của mình mà không cần xin phép trước, với danh sách dịch vụ được AWS cho phép (EC2, RDS, Lambda…). AWS không tự pen test hộ bạn.", "2-13": "SQS là hàng đợi tin nhắn. Tin nằm trong hàng đợi cho tới khi được xử lý xong, nên không bị mất nếu thành phần xử lý gặp sự cố. SES gửi email, Direct Connect là đường truyền riêng, Connect là tổng đài.", "2-14": "Để thiết kế chịu lỗi: dùng nhiều Availability Zone (B) để nếu một AZ hỏng thì AZ khác chạy tiếp, và Elastic Load Balancing (C) để chuyển request khỏi máy bị lỗi. MFA và pen test là bảo mật. Vertical scaling chỉ làm một máy to hơn, vẫn là điểm lỗi duy nhất.", "2-15": "Amazon VPC là mạng ảo riêng dành cho tài khoản của bạn. VPN là kết nối mã hoá, subnet là một phần của VPC, Dedicated Host là máy chủ vật lý riêng.", "2-16": "Khách hàng phải bảo vệ dữ liệu khi truyền tới S3 (B, ví dụ dùng HTTPS) và vá ứng dụng cài trên EC2 (E). Sự kiện môi trường ở data center, truy cập vật lý vào Region và cấu hình máy chủ vật lý bên dưới EC2 đều là việc của AWS.", "2-17": "EC2 (máy chủ ảo) và Lambda (chạy code serverless) là dịch vụ tính toán (compute). VPC là mạng, CloudWatch là giám sát, S3 là lưu trữ.", "2-18": "S3 là lựa chọn phù hợp để lưu ảnh và video: dung lượng không giới hạn, bền, truy cập qua internet. EBS gắn vào một EC2. Instance Store mất dữ liệu khi stop. SQS là hàng đợi tin nhắn.", "2-19": "Access key (Access Key ID + Secret Access Key) tương đương user name và mật khẩu, dùng cho truy cập bằng chương trình (CLI, SDK, API). Key pair dùng để SSH vào EC2. MFA là lớp bảo mật bổ sung.", "2-20": "ElastiCache cung cấp bộ nhớ đệm trong RAM (Redis, Memcached) cho ứng dụng đọc nhiều, giảm tải cho CSDL. B sai vì ElastiCache không tương thích Ehcache. C là AWS Marketplace. D là Route 53.", "2-21": "AWS Organizations quản lý mọi tài khoản AWS từ một tài khoản quản lý (management account, trước gọi là master). WAF là tường lửa web, Trusted Advisor đưa khuyến nghị, Config theo dõi cấu hình.", "2-22": "Dedicated Host cho phép thấy và kiểm soát máy chủ vật lý (số socket, core), nên hỗ trợ gần như mọi trường hợp mang bản quyền phần mềm của mình (BYOL) tính theo máy chủ. Dedicated Instance không cho thấy chi tiết phần cứng.", "2-23": "Chuyển lên AWS giúp giảm chi phí đầu tư ban đầu (CapEx), thay bằng chi phí biến đổi theo mức dùng. A sai vì chỉ Basic support là miễn phí. B sai vì bảo vệ dữ liệu vẫn là trách nhiệm của khách hàng. D sai vì AWS không quản lý ứng dụng của khách hàng.", "2-24": "Hai nguyên tắc thiết kế quan trọng: tự động hoá mọi chỗ có thể (D), và loại bỏ điểm lỗi duy nhất (E). A sai vì phần lớn dịch vụ là theo Region. B sai vì nên chọn mô hình giá phù hợp (đôi khi RI hoặc Savings Plans rẻ hơn). C sai vì nên coi máy chủ là tài nguyên dùng xong thì bỏ, không phải cố định.", "2-25": "Direct Connect tạo đường kết nối mạng riêng, chuyên dụng giữa data center của bạn và AWS, không đi qua internet. CloudFront là CDN, Snowball là thiết bị chuyển dữ liệu vật lý, Route 53 là DNS.", "2-26": "VPC tạo mạng riêng tách biệt, nên mỗi dự án có VPC riêng với cấu hình mạng khác nhau. Internet gateway chỉ là cổng ra internet. Security Group là tường lửa cho instance, không tách cả cấu hình mạng.", "2-27": "AWS WAF là tường lửa ứng dụng web, chặn SQL injection, cross-site scripting và các tấn công vào lỗ hổng ứng dụng. Cognito lo đăng nhập, IAM lo quyền, Aurora là CSDL.", "2-28": "Amazon EMR chạy Hadoop, Spark để phân tích và xử lý lượng dữ liệu lớn. Amazon MQ là message broker, SNS gửi thông báo, SQS là hàng đợi.", "2-29": "AWS hoàn toàn chịu trách nhiệm về việc tạo và quản lý hypervisor (C) và bảo trì phần cứng (E). Cài phần mềm trên EC2 và cấu hình ACL là việc của khách hàng. Giám sát hiệu năng mạng thì cả hai bên đều làm ở phần của mình.", "2-30": "EC2 cho bạn quyền kiểm soát cao nhất: chọn OS, cài phần mềm, cấu hình mọi thứ. Redshift, DynamoDB và RDS là dịch vụ được quản lý, AWS kiểm soát phần hạ tầng bên dưới.", "2-31": "Để đăng nhập Management Console, IAM user dùng user name và mật khẩu. Access key dùng cho CLI, SDK. MFA là lớp bổ sung, không phải mặc định bắt buộc.", "2-32": "AMI (Amazon Machine Image) là mẫu chứa OS và phần mềm, dùng để tạo nhiều EC2 giống hệt nhau. EBS snapshot chỉ là bản sao lưu ổ đĩa. IAM quản lý quyền, internet gateway là cổng mạng.", "2-33": "Cloud cho hạ tầng phân tán trên nhiều Region và AZ (C), giúp loại bỏ điểm lỗi duy nhất (B). Reserved capacity, máy ảo hoá và dedicated hosting đều có thể có ở data center truyền thống, nên không phải lợi thế riêng của cloud.", "2-34": "AWS quản lý vá phần cứng (D) và bảo vệ hạ tầng vật lý toàn cầu (E). Mã hoá EBS, bảo mật VPC và phân quyền truy cập là việc khách hàng tự cấu hình.", "2-35": "Operational Excellence (vận hành xuất sắc) là khả năng giám sát hệ thống và liên tục cải thiện quy trình vận hành. A thuộc Reliability, B thuộc Performance Efficiency. D sai vì khách hàng không quản lý data center.", "2-36": "Câu hỏi tìm điều KHÔNG đúng. Edge location không dùng để chia tải giữa các instance; đó là việc của Elastic Load Balancer. A, B, D đúng: edge location cache nội dung, tăng tốc upload, phân phối nội dung với độ trễ thấp.", "2-37": "CloudTrail ghi lại ai đã thay đổi gì qua API. Config ghi lại lịch sử cấu hình tài nguyên đã thay đổi thế nào. Hai dịch vụ này kết hợp để kiểm toán thay đổi. Comprehend phân tích văn bản, Transit Gateway nối mạng, X-Ray truy vết request.", "2-38": "Amazon ECS chạy ứng dụng container trên cụm EC2 (hoặc Fargate). Data Pipeline là dịch vụ chuyển dữ liệu (đã ngừng). Cloud9 là IDE. Personal Health Dashboard (nay là Health Dashboard) xem tình trạng dịch vụ.", "2-39": "CloudTrail ghi lại toàn bộ hoạt động trong tài khoản, cung cấp bằng chứng phục vụ kiểm toán và tuân thủ. CloudFront là CDN. CloudEndure Migration là công cụ di chuyển (nay là Application Migration Service). CloudWatch giám sát hiệu năng. Lưu ý: AWS Config và Audit Manager cũng hỗ trợ tuân thủ nhưng không có trong đáp án.", "2-40": "Chọn đúng lớp lưu trữ S3 cho từng loại dữ liệu (Standard, IA, Glacier…) giúp giảm chi phí. A sai vì Import/Export không tự chuyển file sang Glacier; việc đó dùng Lifecycle policy. C sai vì S3 không chọn AZ (trừ One Zone). D sai vì EBS đắt hơn S3.", "2-41": "Auto Scaling (B) tự thay thế máy lỗi và giữ đủ số máy. Elastic Load Balancer (C) chia tải và tránh máy lỗi. Hai dịch vụ này giữ hệ thống luôn sẵn sàng và chịu lỗi. Direct Connect là đường truyền, CloudFormation tạo hạ tầng, NACL là tường lửa.", "2-42": "Auto Scaling giảm số máy khi tải thấp, nên không trả tiền cho máy rảnh. B, NLB dùng cho TCP chứ không tiết kiệm tiền cho HTTP. C, xoá tag chỉ làm mất khả năng theo dõi chi phí. D, Multi-AZ tăng tính sẵn sàng nhưng thường tốn thêm tiền.", "2-43": "S3 Transfer Acceleration dùng edge location của CloudFront để tăng tốc upload file lên S3 từ khắp thế giới. WAF là tường lửa. Snowmobile và Snowball là thiết bị vật lý chuyển dữ liệu offline.", "2-44": "Security Group gắn vào EC2 và lọc lưu lượng đi vào (và đi ra) instance. Network ACL thì gắn vào subnet, không gắn vào instance. X-Ray truy vết request, VPC Flow Logs chỉ ghi log lưu lượng.", "2-45": "Global Accelerator đưa lưu lượng vào mạng toàn cầu của AWS sớm nhất. CloudFront cache nội dung ở edge location. Cả hai đều giảm độ trễ cho người dùng toàn cầu. KMS quản lý khoá, Direct Connect là kết nối riêng tới data center, Glue là ETL.", "2-46": "Với RDS, khách hàng tự thiết kế schema CSDL (A) và quản lý cài đặt của CSDL như parameter group (C). Sao lưu, vá phần mềm CSDL và cài đặt CSDL do AWS làm tự động.", "2-47": "Dữ liệu có cấu trúc (bảng, quan hệ) phù hợp với CSDL quan hệ, nên chọn RDS. DynamoDB là NoSQL. SNS là dịch vụ thông báo. ElastiCache là bộ nhớ đệm, không lưu trữ chính.", "2-48": "Công ty đã tạo ra SẢN PHẨM, giải pháp phần mềm giúp khách hàng AWS, nên thuộc APN Technology Partners. Consulting Partners là công ty cung cấp DỊCH VỤ tư vấn, triển khai. TAM và Professional Services là người của AWS.", "2-49": "Lambda là dịch vụ serverless: chạy code mà không phải quản lý máy chủ. Lightsail, RDS instance và EC2 đều có máy chủ mà bạn phải quản lý ở mức nào đó.", "2-50": "Ba máy hỏng mà khách hàng không bị ảnh hưởng nghĩa là hệ thống chịu lỗi (fault tolerant): vẫn chạy bình thường khi một phần bị hỏng. Elastic là co giãn theo tải, scalable là mở rộng được, encrypted là mã hoá. Không cái nào mô tả đúng tình huống này.", "3-1": "EFS (hệ thống file dùng chung) và EBS (ổ đĩa gắn EC2) đều dùng để lưu file. SNS là dịch vụ gửi thông báo, ECS chạy container, EMR xử lý big data, không phải nơi lưu trữ.", "3-2": "SQS (Simple Queue Service) lưu tin nhắn trong hàng đợi và chuyển giao tin cậy giữa các thành phần của hệ thống phân tán. Storage Gateway là lưu trữ hybrid, SES gửi email, S3 lưu object.", "3-3": "Cam kết dùng EC2 1 hoặc 3 năm để được giảm giá là mô hình «Save when you reserve» (tiết kiệm khi đặt trước), ví dụ Reserved Instance, Savings Plans. Pay as you go là trả theo mức dùng. Pay less by using more là giảm giá theo khối lượng (ví dụ S3 càng dùng nhiều càng rẻ).", "3-4": "Right-sizing (chọn đúng kích cỡ) trước và sau khi chuyển giúp không thuê CSDL quá to so với nhu cầu, nên chi phí thấp nhất. Kiến trúc nhiều Region (B, D) làm tăng chi phí. C: Savings Plans không áp dụng cho RDS.", "3-5": "RDS lưu dữ liệu trên ổ EBS gắn vào instance CSDL. S3 chỉ dùng để lưu snapshot sao lưu. Glacier là lưu trữ lưu trữ dài hạn, EFS là file system dùng chung.", "3-6": "X-Ray truy vết đường đi của request qua các microservice, chỉ ra service nào chậm hoặc lỗi. CodePipeline là CI/CD, Inspector quét lỗ hổng, CloudTrail ghi log API.", "3-7": "S3 (lớp Standard) tự lưu dữ liệu trên ít nhất 3 AZ, DynamoDB cũng tự sao chép dữ liệu qua 3 AZ, không cần cấu hình. EBS chỉ nằm trong 1 AZ. Redshift mặc định chạy trong 1 AZ. Snowball là thiết bị vật lý.", "3-8": "Multi-AZ tạo bản standby ở AZ khác và tự failover khi AZ chính lỗi. Read Replica tạo bản sao chỉ đọc, giảm tải và có thể nâng cấp thành CSDL chính khi cần. Region và Edge Location không phải tính năng của RDS. Tự vá lỗi không tăng tính sẵn sàng.", "3-9": "CloudFront cache nội dung ở edge location gần người dùng châu Á, giảm độ trễ mà không phải chuyển ứng dụng. A, nhiều AZ trong cùng Region us-west-1 vẫn xa châu Á. B và C không hợp lý và tốn công.", "3-10": "IAM kiểm soát mỗi developer được truy cập dịch vụ nào và làm gì. RDS là CSDL, Network ACL kiểm soát lưu lượng mạng chứ không phải người dùng, EMR xử lý big data.", "3-11": "EC2 là IaaS (hạ tầng như dịch vụ): bạn thuê máy chủ ảo và tự quản lý OS, phần mềm. PaaS ví dụ Elastic Beanstalk, SaaS ví dụ Gmail.", "3-12": "Tách rời (decouple) các thành phần để chúng chạy độc lập là best practice. A sai vì bảo mật vật lý là việc của AWS. B, phần cứng do AWS lo. C, IAM policy quản lý quyền, không liên quan hiệu năng.", "3-13": "S3 là nơi lưu ảnh và video phù hợp nhất: không giới hạn dung lượng, độ bền cao, truy cập qua internet. EBS gắn 1 EC2, Instance Store mất dữ liệu khi stop, SQS là hàng đợi.", "3-14": "Glacier phù hợp cho dữ liệu lưu trữ (active archive, ví dụ Glacier Instant Retrieval) và dữ liệu phân tích lưu lâu dài. Tài nguyên website động, CSDL đang hoạt động và dữ liệu cache cần truy cập liên tục, không hợp với Glacier.", "3-15": "Elastic Beanstalk là PaaS: bạn tải code lên, nó tự triển khai EC2, load balancer, Auto Scaling. B là Fargate, C là EFS hoặc Storage Gateway, D là DynamoDB.", "3-16": "Inspector tự động đánh giá EC2 để tìm lỗ hổng phần mềm và mạng bị mở không an toàn. Kinesis xử lý dữ liệu luồng. Security Group và NACL là tường lửa, không quét lỗ hổng.", "3-17": "Khách hàng «thừa hưởng hoàn toàn» (fully inherit) từ AWS các kiểm soát môi trường (điện, làm mát, chống cháy) và kiểm soát vật lý (bảo vệ data center). Patch management là kiểm soát chung (shared). Database và đào tạo nhận thức là việc của khách hàng.", "3-18": "Chạy ít nhất 3 năm thì dùng Reserved Instance. Trả trước một phần (Partial Upfront) giảm giá nhiều hơn No Upfront. All Upfront còn rẻ hơn nhưng không có trong đáp án. On-Demand đắt, Spot không áp dụng cho RDS và có thể bị ngắt.", "3-19": "Global reach (tiếp cận toàn cầu): AWS có Region và edge location khắp thế giới, nên đặt ứng dụng gần người dùng quốc tế để giảm độ trễ. Elasticity là co giãn, durability là độ bền dữ liệu, high availability là sẵn sàng cao.", "3-20": "Savings Plans áp dụng cho EC2, Lambda và Fargate (Compute Savings Plans), cùng SageMaker (gói riêng). Batch, Outposts và Lightsail không có Savings Plans.", "3-21": "Không chấp nhận downtime và phải phòng thảm họa thiên nhiên (có thể ảnh hưởng cả một vùng) thì triển khai sang Region khác theo chiến lược Active-Active. B, nhiều AZ cùng Region vẫn có thể bị ảnh hưởng chung. A, edge location không chạy workload. C, khôi phục từ backup gây downtime.", "3-22": "Service limit (nay là Service Quotas) có thể xin tăng bằng cách liên hệ AWS Support (A), và Trusted Advisor có mục kiểm tra Service Limits (D). B sai vì limit tính theo tài khoản và Region, không theo IAM user. C sai vì có limit. E sai vì SES không làm việc này.", "3-23": "AWS CLI cho phép viết script quản lý mọi dịch vụ và tài nguyên AWS. Console là giao diện web bấm tay. Service Catalog là danh mục sản phẩm được duyệt. OpsWorks là công cụ quản lý cấu hình Chef/Puppet (đã ngừng).", "3-24": "Kết nối on-premises với AWS để xây hybrid cloud dùng Direct Connect (đường truyền riêng) hoặc VPN (kết nối mã hoá qua internet). Artifact là báo cáo tuân thủ, Cloud9 là IDE, CloudTrail là log API.", "3-25": "Application Load Balancer phân phối request HTTP/HTTPS (tầng 7) đều giữa các instance. NLB dùng cho TCP/UDP (tầng 4), không tối ưu cho HTTP. Auto Scaling thêm bớt máy chứ không chia tải. EC2 Auto Recovery khôi phục một instance lỗi.", "3-26": "Aurora tương thích MySQL (và PostgreSQL), bản Aurora Serverless tự điều chỉnh dung lượng theo nhu cầu. Neptune là CSDL đồ thị. RDS for SQL Server và RDS for PostgreSQL không tương thích MySQL.", "3-27": "Security Group và Network ACL lọc lưu lượng, chỉ cho phép đúng cổng và IP cần thiết, giúp giảm bề mặt tấn công DDoS. CloudHSM lưu khoá mã hoá trên phần cứng, Batch chạy job, IAM quản lý quyền. (Shield và WAF là dịch vụ chính chống DDoS nhưng không có trong đáp án.)", "3-28": "Redshift là kho dữ liệu (data warehouse), truy vấn nhanh trên lượng dữ liệu rất lớn. Kinesis xử lý dữ liệu luồng, DynamoDB là NoSQL, RDS là CSDL quan hệ cho ứng dụng.", "3-29": "Phân tích TCO so sánh chi phí hạ tầng: phần cứng vật lý, điện, làm mát, mặt bằng, nhân sự IT. Phát triển ứng dụng, nghiên cứu thị trường và phân tích nghiệp vụ tốn chi phí như nhau dù chạy on-prem hay AWS.", "3-30": "EC2 Linux tính tiền theo từng giây, tối thiểu 60 giây (1 phút). Windows và một số OS có tính phí bản quyền tính theo giờ.", "3-31": "Giá EC2 phụ thuộc vào loại instance (A) và vị trí chạy (B; giá khác nhau theo Region, và chuyển dữ liệu giữa các AZ có tính phí). Load balancing là dịch vụ riêng tính tiền riêng. Bucket thuộc S3. IP private miễn phí.", "3-32": "Tạo AMI từ EC2 cũ (đã cấu hình xong), rồi dùng AMI đó tạo EC2 mới giống hệt. Config không tạo template để chạy máy. EBS snapshot chỉ sao lưu ổ đĩa, không đủ cấu hình để khởi động máy trực tiếp. Aurora là CSDL.", "3-33": "Service Control Policies (SCP) của Organizations giới hạn dịch vụ và hành động tối đa được phép trong từng tài khoản (kể cả root của tài khoản thành viên). IAM policy chỉ cấp quyền trong một tài khoản. Fargate chạy container.", "3-34": "Agility (sự nhanh nhẹn) nghĩa là tạo tài nguyên trong vài phút thay vì vài tuần chờ mua máy, giúp thử nghiệm và đổi mới nhanh. A là Global reach. B sai, AWS không cho tùy chỉnh phần cứng. D là cách giảm giá, không phải agility.", "3-35": "RDS giảm gánh nặng quản trị (A) vì AWS lo cài đặt, vá, backup, và cho phép thay đổi năng lực tính toán (C) bằng cách đổi loại instance. B sai, không kiểm soát máy chủ bên dưới. D sai, đổi cỡ instance không tự động. E sai, đó là DynamoDB.", "3-36": "Site-to-Site VPN dùng IPSec để tạo kết nối mã hoá giữa mạng on-prem và AWS qua internet. Direct Connect là đường truyền riêng, mặc định không mã hoá. Internet Gateway là cổng ra internet. AWS IQ là chợ thuê chuyên gia.", "3-37": "Business Support là gói thấp nhất có hỗ trợ kỹ thuật 24/7 qua điện thoại và chat. Developer chỉ có email trong giờ hành chính. Basic không có hỗ trợ kỹ thuật. Enterprise cũng có 24/7 nhưng không phải mức thấp nhất.", "3-38": "Network ACL (cấp subnet) và Security Group (cấp instance) kiểm soát lưu lượng mạng. Key pair dùng để SSH, access key dùng cho CLI, IAM policy quản lý quyền người dùng.", "3-39": "Ứng dụng chịu được việc máy bị ngắt và phục hồi nhanh thì dùng Spot, rẻ nhất (giảm tới 90%). Chuyển mã media (transcoding) là việc dạng batch, bị ngắt thì chạy lại.", "3-40": "Service Health Dashboard (nay gộp vào AWS Health Dashboard) hiển thị tình trạng tất cả dịch vụ AWS ở mọi Region, công khai cho mọi người. Personal Health Dashboard chỉ hiện sự kiện ảnh hưởng tới tài khoản của bạn. CloudWatch giám sát tài nguyên của bạn.", "3-41": "AWS SDK là bộ thư viện cho nhiều ngôn ngữ lập trình (Python, Java, JavaScript, Go…) để gọi dịch vụ AWS từ code. CLI là dòng lệnh, CodeDeploy triển khai ứng dụng, Console là giao diện web.", "3-42": "Route 53 cho phép đăng ký tên miền mới, ngoài chức năng DNS. Personalize là dịch vụ gợi ý bằng ML, KMS quản lý khoá, Config theo dõi cấu hình.", "3-43": "CloudFormation (Infrastructure as Code) và Elastic Beanstalk (tự triển khai ứng dụng) là công cụ tự động hoá giúp triển khai nhanh hơn. Migration Hub theo dõi di chuyển, IAM quản lý quyền, Macie tìm dữ liệu nhạy cảm.", "3-44": "Trusted Advisor đưa khuyến nghị tối ưu chi phí, như tài nguyên dùng ít, EBS không gắn máy, nên mua RI. Pricing Calculator chỉ ước tính giá. QuickSight là BI. X-Ray truy vết request.", "3-45": "Transit Gateway là hub trung tâm kết nối hàng trăm VPC (kể cả khác Region qua inter-Region peering) và mạng on-prem, đơn giản hơn nhiều so với tạo từng kết nối VPC Peering. Amazon Connect là tổng đài.", "3-46": "Nhược điểm: RI cần cam kết ít nhất 1 năm (B). Ưu điểm: giảm giá đáng kể so với On-Demand (D). A mô tả Spot. C sai, dedicated instance có phí riêng. E sai, RI hợp với workload chạy ổn định liên tục, không phải định kỳ.", "3-47": "Mỗi Region có nhiều AZ để bạn xây kiến trúc chịu lỗi và sẵn sàng cao: một AZ hỏng thì AZ khác vẫn chạy. B sai, nhiều AZ thường tốn hơn. C, global reach đến từ nhiều Region. D sai, AZ không nhằm tăng dung lượng.", "3-48": "Chỉ chạy 2 tháng nên không thể dùng RI (cam kết ít nhất 1 năm). Phải luôn sẵn sàng nên không dùng Spot (có thể bị thu hồi). Còn lại On-Demand là lựa chọn phù hợp. (Savings Plans cũng cần cam kết 1 năm.)", "3-49": "Chạy trên nhiều AZ làm tăng tính sẵn sàng: một AZ gặp sự cố thì ứng dụng vẫn chạy ở AZ khác. Không giúp vượt service limit, không giảm độ trễ cho người dùng toàn cầu (đó là nhiều Region hoặc CloudFront).", "3-50": "Khi thiết bị lưu trữ hết vòng đời, AWS tiêu huỷ chúng theo các tiêu chuẩn ngành (ví dụ NIST 800-88) để đảm bảo dữ liệu khách hàng không bị lộ. AWS không bán, không tái chế hay cất giữ thiết bị chứa dữ liệu.", "4-1": "Để có chứng chỉ SSL/TLS cho HTTPS, dùng AWS Certificate Manager (ACM), cách được khuyến nghị và miễn phí. IAM cũng lưu được chứng chỉ server (cách cũ, dùng khi Region không có ACM). Route 53 là DNS, Directory Service là AD, Data Pipeline chuyển dữ liệu.", "4-2": "S3 và Lambda tự mở rộng mà không cần bạn làm gì. EC2 cần Auto Scaling, EMR cần thêm node, EBS cần chỉnh dung lượng.", "4-3": "Với Lambda (serverless), AWS lo quản lý dung lượng (B) và bảo trì hệ điều hành (D). Khách hàng vẫn lo code ứng dụng, kiểm soát quyền truy cập và dữ liệu.", "4-4": "ELB kiểm tra sức khoẻ (health check) các target và chỉ gửi request tới target khoẻ mạnh, nên ứng dụng không bị lỗi khi một máy hỏng. ELB không làm việc với S3, không sao chép dữ liệu, không tạo Read Replica.", "4-5": "Dedicated Instance chạy trên phần cứng không chia sẻ với khách hàng AWS khác. On-Demand, Spot và Reserved là cách tính tiền, mặc định vẫn chạy trên phần cứng dùng chung.", "4-6": "60 PB là lượng dữ liệu khổng lồ, nên dùng Snowmobile (xe tải chở tới 100 PB). Snowball chỉ khoảng 80 TB mỗi thiết bị, phải dùng hàng trăm cái. Transfer Acceleration truyền qua mạng, quá chậm cho 60 PB. Lưu ý: Snowmobile nay đã ngừng nhận đơn mới, nhưng đề cũ vẫn dùng.", "4-7": "Lưu 5 năm, lấy lại trong vòng 5 tiếng thì Glacier (Flexible Retrieval, chế độ Standard lấy trong 3 đến 5 giờ) là rẻ nhất. S3 Standard, EFS và EBS đều đắt hơn nhiều cho dữ liệu lưu trữ.", "4-8": "IAM quản lý người dùng và quyền của họ. Security Group là tường lửa mạng, ECS chạy container, AWS Support là hỗ trợ kỹ thuật.", "4-9": "Concierge Support (đội hỗ t
