ng cho instance, không áp dụng cho S3.", "13-22": "Diễn đàn (nay là re:Post), blog và whitepaper bảo mật đều miễn phí. Gọi AWS Support cần gói trả phí (Business trở lên). Professional Services có phí. Lớp học ở trường đại học cũng tốn phí.", "13-23": "Convertible RI cho phép đổi thuộc tính (dòng máy, OS, tenancy) miễn là RI mới có giá trị bằng hoặc lớn hơn. Standard RI không đổi được dòng máy. Scheduled RI đã ngừng. Dedicated RI không phải loại RI.", "13-24": "Tính toán co giãn (elastic computing) giảm TCO vì chỉ dùng và trả cho tài nguyên khi cần. Mô hình trách nhiệm chung và mã hoá liên quan bảo mật. Single tenancy (phần cứng riêng) làm tăng chi phí.", "13-25": "Elastic Load Balancing tự mở rộng năng lực của chính nó khi lưu lượng web tăng. CodePipeline là CI/CD, EBS phải tự chỉnh dung lượng, Direct Connect có băng thông cố định.", "13-26": "Tài liệu tuân thủ như báo cáo SOC 1 nằm ở AWS Artifact. Inspector quét lỗ hổng, CloudTrail ghi log, Certificate Manager quản lý SSL.", "13-27": "Khách hàng chịu trách nhiệm mã hoá phía client (B) và cấu hình Network ACL (D). Vá OS của RDS, đào tạo nhân viên data center và kiểm soát môi trường data center là việc của AWS.", "13-28": "Mẫu thiết kế sẵn sàng cao: thiết kế ứng dụng chịu được việc bất kỳ thành phần đơn lẻ nào bị hỏng (không có điểm lỗi duy nhất). A liên quan hiệu năng. B gây lãng phí, nên dùng Auto Scaling. D là kiến trúc nguyên khối, dễ sập toàn bộ.", "13-29": "Best practice là dùng các thành phần liên kết lỏng (loosely coupled). Liên kết chặt khiến một phần lỗi kéo theo phần khác. «Infrequently» và «frequently coupled» không phải thuật ngữ chuẩn.", "13-30": "Tăng bảo mật cho IAM user: dùng MFA (D) và bắt buộc mật khẩu mạnh, có thời hạn (E). Rekognition là phân tích ảnh, Shield chống DDoS, Security Group lọc lưu lượng mạng chứ không bảo vệ user.", "13-31": "Dữ liệu đọc ghi thay đổi liên tục thì dùng RDS (CSDL) và EFS (file system dùng chung). Glacier dùng lưu trữ dài hạn. Snowball chuyển dữ liệu offline. Redshift tối ưu cho phân tích, không cho ghi liên tục.", "13-33": "Aurora tương thích MySQL và dễ mở rộng (tự tăng dung lượng lưu trữ, có bản Serverless tự điều chỉnh năng lực). Redshift là kho dữ liệu, DynamoDB là NoSQL, ElastiCache là bộ nhớ đệm.", "13-34": "Availability Zone gồm một hoặc nhiều data center riêng biệt, nối với nhau bằng đường truyền độ trễ thấp. Edge location dùng cho CDN. Region gồm nhiều AZ.", "13-36": "Để có tính sẵn sàng cao, triển khai trên tối thiểu 2 AZ, để một AZ hỏng thì AZ còn lại vẫn phục vụ.", "13-37": "Lên cloud giúp doanh nghiệp tập trung vào hoạt động kinh doanh. A sai, vẫn có hoá đơn IT. B không hợp lý. D sai, vẫn phải vá máy chủ.", "13-38": "S3 là lựa chọn bền (11 số 9), giá thấp và lấy dữ liệu ngay lập tức. Glacier (bản cổ điển) mất vài phút đến vài giờ. EBS đắt hơn và gắn một EC2. Instance Store mất dữ liệu khi stop.", "13-39": "Access key cho phép developer truy cập dịch vụ AWS qua CLI. User name và password dùng cho Console. SSH key dùng vào EC2. «API keys» không phải tính năng của IAM (đó là của API Gateway).", "13-40": "DynamoDB là CSDL NoSQL nhanh, đáng tin cậy. Redshift là kho dữ liệu, RDS là CSDL quan hệ, S3 là object storage.", "13-41": "Agility thể hiện ở việc giảm thời gian có được tài nguyên tính toán mới (vài phút). A và B là tính năng, C là tính năng thanh toán.", "13-42": "AWS Organizations dùng để hợp nhất và quản lý tập trung nhiều tài khoản AWS. IAM quản lý quyền trong một tài khoản. SCT chuyển đổi schema CSDL. Config theo dõi cấu hình.", "13-43": "Chuyển mã nhiều file video riêng lẻ thì chạy nhiều instance song song, nhanh và tận dụng tính co giãn (có thể dùng Spot). Một máy lớn hay phần cứng riêng chậm hơn và không theo nguyên tắc kiến trúc cloud.", "13-44": "Kiểm toán an ninh vật lý (data center) hoàn toàn là trách nhiệm của AWS. IAM policy, bucket policy và log CloudTrail là thứ khách hàng tự cấu hình và kiểm tra.", "13-45": "Global reach (tiếp cận toàn cầu) giúp đặt ứng dụng gần khách hàng ở mọi nơi để giảm độ trễ. Fault tolerance, pay-as-you-go và high availability không giải quyết độ trễ.", "13-46": "Vá EC2 (OS và phần mềm trên đó) là trách nhiệm của khách hàng. Vá hạ tầng bên dưới, an ninh vật lý và vá hạ tầng mạng là của AWS.", "13-47": "Dùng consolidated billing của AWS Organizations để gộp mức dùng và hưởng giảm giá theo khối lượng mà không phải di chuyển tài nguyên. A ảnh hưởng lớn tới tài nguyên. B không giải quyết việc gộp. D, gói Enterprise không tặng giảm giá khối lượng.", "13-48": "CloudWatch Logs giám sát log theo thời gian thực (D) và cho phép tùy chỉnh thời gian lưu giữ log (E). Không miễn phí hoàn toàn (tính phí lưu trữ, nạp log). Không có phân tích Elasticsearch miễn phí hay bản tóm tắt qua SNS.", "13-49": "Route 53 là dịch vụ DNS do AWS quản lý. Neptune là CSDL đồ thị, SageMaker là ML, Lightsail là máy chủ ảo đơn giản.", "13-50": "Chọn Region dựa vào độ trễ thấp tới người dùng (A) và tuân thủ chủ quyền dữ liệu (C), cùng giá và dịch vụ có sẵn. Ngôn ngữ giao diện, chi phí làm mát (AWS chịu) và khoảng cách tới văn phòng (không thể vào data center) không liên quan.", "14-1": "S3 có thể host website tĩnh với chi phí thấp. Glacier là lưu trữ dài hạn, không truy cập ngay. DynamoDB là CSDL. EFS là file system gắn EC2, không host web trực tiếp.", "14-2": "Spot Instance được giảm giá tới 90% so với On-Demand. Reserved giảm tới khoảng 72%. Dedicated Host là đắt nhất.", "14-3": "Mã hoá dữ liệu là trách nhiệm của khách hàng. Kiểm soát truy cập vật lý, huỷ thiết bị lưu trữ an toàn và quản lý rủi ro môi trường là của AWS.", "14-4": "Chạy CSDL quan hệ do khách hàng tự quản lý thì dùng EC2 (tự cài và quản lý phần mềm CSDL). Route 53 là DNS, ElastiCache là bộ nhớ đệm, DynamoDB là NoSQL được AWS quản lý.", "14-5": "Redshift là giải pháp kho dữ liệu mở rộng được. S3 là lưu trữ, DynamoDB là NoSQL, Kinesis xử lý dữ liệu luồng.", "14-7": "Cách hợp lệ để làm việc với dịch vụ AWS: CLI (A) và SDK (C), cùng Management Console và API. On-premises, SaaS, Hybrid là mô hình triển khai hoặc dịch vụ, không phải cách tương tác.", "14-8": "Nhiều Region trên thế giới là ví dụ của hạ tầng toàn cầu (global infrastructure), giúp triển khai gần người dùng. Agility là nhanh nhẹn, elasticity là co giãn, pay-as-you-go là cách tính tiền.", "14-10": "EC2 trên AWS truy cập ứng dụng cũ ở data center công ty, tức là kiến trúc hybrid (kết hợp cloud và on-prem). Cloud-native là chạy hoàn toàn trên cloud. IaaS là mô hình dịch vụ.", "14-11": "Dịch vụ được quản lý như ElastiCache, RDS giúp đơn giản hoá việc vá và cập nhật hệ điều hành bên dưới vì AWS lo. A sai, AWS tự thay instance lỗi. B, hiệu năng không chắc tốt hơn. D sai, bạn vẫn phải chọn loại và cỡ instance phù hợp.", "14-12": "S3 là object storage, dung lượng gần như không giới hạn, độ bền cao (11 số 9). Redshift là kho dữ liệu, EFS là file storage, ECS chạy container.", "14-13": "Access key ID và secret access key gắn với IAM user (và root user) để dùng CLI. Role dùng thông tin tạm thời. Group và policy không có thông tin đăng nhập.", "14-14": "AWS cung cấp kiểm tra bảo mật của Trusted Advisor (B) và mã hoá dữ liệu (C, KMS, mã hoá S3, EBS). AWS không tự pen test hộ bạn, không phát hiện nội dung có bản quyền trên S3. Token MFA vật lý do bên thứ ba bán.", "14-15": "Amazon RDS là dịch vụ được quản lý để chạy CSDL. Batch chạy job, Artifact là báo cáo tuân thủ, Data Pipeline chuyển dữ liệu.", "14-16": "Amazon EFS là hệ thống file dùng chung, đơn giản, mở rộng được, cho máy chủ Linux trên AWS và on-prem. S3 là object storage, Glacier là lưu trữ dài hạn, EBS gắn một EC2.", "14-17": "Áp dụng tính co giãn (elasticity) là nguyên tắc thiết kế chính: tăng giảm tài nguyên theo nhu cầu. A và B gây lãng phí. C, Scrum là quy trình phát triển phần mềm, không phải nguyên tắc kiến trúc cloud.", "14-18": "Glacier dùng để lưu bản sao lưu dài hạn với chi phí thấp. RDS là CSDL, Snowball là thiết bị chuyển dữ liệu, EBS là ổ đĩa đắt hơn.", "14-20": "AWS Marketplace là danh mục phần mềm từ nhà cung cấp độc lập để tìm, thử, mua và triển khai trên AWS. Lumberyard là game engine (đã ngừng), Artifact là báo cáo tuân thủ, CloudSearch là dịch vụ tìm kiếm.", "14-21": "AWS giúp tập trung vào hoạt động tạo ra doanh thu thay vì lo vận hành data center. A sai, «bảo mật dễ dãi» không phải lợi ích. C và D sai, khách hàng không kiểm soát hay chọn phần cứng mạng của AWS.", "14-22": "Cần cách ly vật lý workload thì tính chi phí Dedicated Host (máy chủ vật lý riêng). Reserved, On-Demand và No Upfront RI là cách tính tiền trên phần cứng dùng chung.", "14-23": "CloudFormation quản lý hạ tầng dưới dạng code. CodePipeline là CI/CD, CodeDeploy triển khai ứng dụng, Direct Connect là đường truyền mạng.", "14-24": "AWS Config ghi lại lịch sử thay đổi cấu hình tài nguyên, dùng để kiểm toán quản lý thay đổi. Trusted Advisor đưa khuyến nghị, CloudWatch giám sát hiệu năng, Inspector quét lỗ hổng.", "14-25": "CloudWatch là kho số liệu (metrics) với ngưỡng cảnh báo và kênh thông báo tùy chỉnh (alarm qua SNS…). A là CodeCommit. C gần với GuardDuty hoặc Security Hub. D là WAF.", "14-26": "AWS Organizations (với consolidated billing) gộp mức dùng của nhiều tài khoản để được giảm giá theo khối lượng. Server Migration Service di chuyển máy chủ, Budgets đặt ngân sách, Trusted Advisor đưa khuyến nghị.", "14-27": "Triển khai ứng dụng lên máy chủ on-prem: OpsWorks (Chef, Puppet, hỗ trợ máy on-prem, nay đã ngừng) và CodeDeploy. Elastic Beanstalk chỉ triển khai trên AWS. Batch chạy job. X-Ray truy vết.", "14-28": "Giá Spot thay đổi theo cung và cầu dung lượng EC2 dư thừa. On-Demand và Reserved có giá cố định.", "14-29": "Khi tái kiến trúc ứng dụng nguyên khối: áp dụng liên kết lỏng (C) và thiết kế để mở rộng được (E). Giám sát thủ công, máy chủ cố định và phụ thuộc vào từng thành phần đơn lẻ đều ngược best practice.", "14-30": "Gói Business là mức thấp nhất có thời gian phản hồi mục tiêu 1 giờ (khi hệ thống production sập). Developer nhanh nhất là 12 giờ. Basic không có hỗ trợ kỹ thuật.", "14-32": "Personal Health Dashboard (nay là AWS Health Dashboard) cho góc nhìn cá nhân hoá về tình trạng các dịch vụ AWS đang chạy workload của bạn. Service Health Dashboard hiện tình trạng chung cho mọi người.", "14-33": "Consolidated billing giúp đủ điều kiện hưởng giá theo khối lượng. Nó không chia sẻ quyền truy cập, không tạo nhiều hoá đơn (ngược lại là một hoá đơn), và vẫn cần tag để phân bổ chi phí.", "14-34": "Đáp án theo đề là D (xin AWS cho phép trước). Lưu ý quan trọng: đây là quy định CŨ. Từ năm 2019, AWS không cần xin phép trước khi pen test các dịch vụ trong danh sách cho phép (EC2, RDS, Lambda…), giống Đề 2 câu 12. Nếu đề thi thật có đáp án «không cần xin phép với các dịch vụ được phép» thì chọn đáp án đó.", "14-35": "AMI (Amazon Machine Image) dùng để tạo EC2 đã cấu hình sẵn. EBS là ổ đĩa, Systems Manager quản lý máy chủ, AppStream stream ứng dụng.", "14-36": "Gắn IAM policy vào IAM group, thì mọi user trong nhóm cùng nhận quyền, dễ quản lý cho nhiều người. C làm được nhưng khó quản lý. Role dùng cho quyền tạm thời. Cognito dành cho người dùng ứng dụng, không phải nhân viên.", "14-37": "Cost and Usage Report cho dữ liệu chi tiết nhất về hoá đơn (theo giờ, theo tài nguyên, theo tag). Cost Explorer và Billing dashboard là xem tổng quan. Budgets là đặt ngân sách và cảnh báo.", "14-38": "Tạo cụm RDS mới bằng CloudFormation (template) hoặc Management Console. Concierge lo hoá đơn, S3 là lưu trữ, Auto Scaling thêm bớt EC2.", "14-39": "Liên kết lỏng là nguyên tắc thiết kế kiến trúc AWS Cloud. Điểm lỗi duy nhất và thiết kế nguyên khối là ngược best practice. Cloud ưu tiên scale ngang hơn scale dọc.", "14-40": "Bảo vệ truy cập tài khoản: cấp quyền tối thiểu cho IAM user (B) và bật MFA cho người dùng có đặc quyền (E). CloudTrail chỉ ghi log, không bảo vệ truy cập. C là vi phạm best practice. CloudFront là CDN.", "14-41": "Storage Gateway là dịch vụ lưu trữ hybrid, cho ứng dụng on-prem dùng lưu trữ cloud liền mạch. Glacier là lưu trữ dài hạn, Snowball chuyển dữ liệu vật lý, EBS gắn EC2.", "14-42": "Với EC2, khách hàng phải tự lo cấu hình hệ điều hành, vá bảo mật và cấu hình mạng. RDS, ElastiCache và Fargate là dịch vụ được quản lý, AWS lo phần OS.", "14-43": "Dùng nhiều Availability Zone là nguyên tắc thiết kế quan trọng để tăng sẵn sàng và chịu lỗi. B sai, nên liên kết lỏng. C không phải nguyên tắc kiến trúc. D sai, nên dùng co giãn thay vì cấp dư.", "14-44": "TAM (Technical Account Manager) riêng chỉ có ở gói Enterprise. Enterprise On-Ramp có một nhóm TAM dùng chung. Business, Developer, Basic không có TAM.", "14-45": "RDS so với quản lý CSDL truyền thống: AWS lo bảo trì hệ điều hành (cùng vá CSDL, sao lưu). A sai, dữ liệu trong bảng là của khách hàng. C sai, không tự đổi cỡ instance. D sai, khách hàng tự chọn loại CSDL.", "14-46": "ElastiCache lưu kết quả truy vấn hay dùng trong RAM, giảm tải truy cập CSDL. Machine Learning là dịch vụ ML (cũ), SQS là hàng đợi, Instance Store là ổ tạm của một EC2.", "14-48": "Học về bảo mật có giảng viên: AWS Online Tech Talks (webinar do chuyên gia AWS trình bày) và AWS Classroom Training (lớp học có giảng viên). Trusted Advisor là công cụ, Blog và Forums là tài liệu tự đọc.", "14-49": "Trong VPC Dashboard bạn cấu hình được Security Group và Subnet (cùng route table, gateway, NACL…). CloudFront, Route 53 và ELB có console riêng (ELB nằm ở EC2 console).", "14-50": "Tạo AWS Organization từ tài khoản thanh toán (payer account) rồi mời các tài khoản khác tham gia, như vậy là bật được consolidated billing. Budgets chỉ đặt ngân sách. Support không gộp hoá đơn. D phức tạp và không gộp hoá đơn thật.", "15-1": "Nhờ lợi thế quy mô khổng lồ, AWS vận hành hiệu quả hơn và định kỳ giảm giá cho khách hàng. Đây là định nghĩa chuẩn của economies of scale. B, C, D là lợi ích khác, không phải do quy mô.", "15-2": "CloudTrail (ghi lại ai làm gì qua API) và CloudWatch (log, số liệu, sự kiện) thu thập thông tin về hoạt động tài khoản. CloudFront là CDN, Cloud9 là IDE, CloudHSM lưu khoá mã hoá.", "15-3": "Với dịch vụ được quản lý như RDS, AWS lo vá phần mềm CSDL (A) và sao lưu CSDL (C), giải phóng nhân lực IT. Test ứng dụng, thiết kế schema và pen test vẫn là việc của khách hàng.", "15-4": "Spot phù hợp với các job không thường xuyên và chịu được gián đoạn. Website chính, ứng dụng cần uptime 99.999% và CSDL dùng nhiều thì không được gián đoạn.", "15-5": "Availability Zone là tính năng dùng để đạt tính sẵn sàng cao: chạy ứng dụng trên nhiều AZ. Direct Connect là kết nối mạng. Khách hàng không chọn data center trực tiếp. VPC là mạng ảo.", "15-6": "Infrastructure Event Management miễn phí từ gói Enterprise (và Enterprise On-Ramp). Gói Business phải trả thêm phí. Developer và Basic không có.", "15-7": "Amazon S3 phục vụ được website tĩnh (HTML, CSS, JS, ảnh). Route 53 là DNS (trỏ tên miền tới website nhưng không lưu nội dung), QuickSight là BI, X-Ray truy vết.", "15-8": "AWS rút ngắn thời gian cấp phát tài nguyên IT nhờ khả năng tạo tài nguyên bằng chương trình (API, CLI, IaC) trong vài phút. Các đáp án khác không phải cách AWS hoạt động.", "15-9": "Edge location dùng để đưa nội dung tới gần người dùng (B) và giảm tải cho máy chủ gốc bằng cách cache phản hồi (D). Edge location không host ứng dụng, không chạy cache NoSQL (đó là ElastiCache), không gửi thông báo (đó là SNS).", "15-10": "IAM policy (cùng bucket policy) giới hạn người dùng nào được truy cập bucket S3. Key pair dùng để SSH. Inspector quét lỗ hổng. Security Group lọc lưu lượng mạng cho instance, không áp dụng cho S3.", "15-11": "Hỗ trợ tăng người dùng, lưu lượng, dữ liệu mà không giảm hiệu năng là nguyên tắc co giãn (implement elasticity) theo whitepaper Cloud Best Practices. Think parallel là xử lý song song. Decouple là tách rời. Design for failure là thiết kế cho lỗi.", "15-12": "Bảo mật hypervisor của EC2 là trách nhiệm của AWS. Mã hoá phía client, cấu hình IAM role và chính sách mật khẩu là việc của khách hàng.", "15-13": "On-Demand chỉ trả cho thời gian dùng thực tế. A, đấu giá là cơ chế cũ của Spot. B sai. D mô tả Reserved Instance.", "15-14": "AWS Quick Start (nay là AWS Partner Solutions) là các bản triển khai tham chiếu dựng sẵn, giúp triển khai nhanh các giải pháp IT phổ biến và dùng ngay. Well-Architected Framework là tài liệu nguyên tắc, không triển khai gì. CloudFront là CDN. CodeCommit lưu mã nguồn.", "15-15": "Lambda thuộc nhóm nền tảng serverless. EMR và ELB dựa trên máy chủ, và EMR bạn phải quản lý cụm. Mobile Hub là dịch vụ cũ, đã được thay bằng Amplify.", "15-16": "Step Functions, DynamoDB và SNS đều là serverless. Các lựa chọn khác đều có EC2 hoặc EMR (dựa trên máy chủ).", "15-17": "Quản lý bản vá là kiểm soát chung: AWS vá hạ tầng, khách hàng vá OS và ứng dụng của mình. Kiểm soát vật lý, bảo mật zone và kiểm toán data center là việc của AWS.", "15-18": "Edge location dùng để đưa nội dung tới gần người dùng (B) và giảm tải cho máy chủ gốc bằng cách cache phản hồi (D). Edge location không host ứng dụng, không chạy cache NoSQL (đó là ElastiCache), không gửi thông báo (đó là SNS).", "15-19": "Auto Scaling cho phép năng lực tính toán tự điều chỉnh theo tải. Load balancing chia tải. Automatic failover chuyển sang dự phòng khi lỗi. Round robin là thuật toán chia tải lần lượt.", "15-20": "Route 53 và CloudFront là dịch vụ toàn cầu (global), cùng với IAM và WAF cho CloudFront. EC2, DynamoDB là dịch vụ theo Region. S3 tạo bucket theo Region dù tên bucket là duy nhất toàn cầu.", "15-21": "AWS Artifact cung cấp báo cáo và chứng nhận tuân thủ. Lambda chạy code. Inspector quét lỗ hổng. Certificate Manager cấp chứng chỉ SSL/TLS (không phải chứng nhận tuân thủ, đừng nhầm vì cùng chữ «certificate»).", "15-22": "Khách hàng đảm bảo dữ liệu ứng dụng được mã hoá khi lưu trữ (A) và người dùng của mình được đào tạo bảo mật khi dùng AWS (C). Máy chủ NTP của AWS, hạn chế truy cập data center và huỷ phần cứng là việc của AWS.", "15-23": "Amazon EC2 cho phép tự tay tạo instance theo cấu hình CPU, RAM cần thiết. EBS là ổ đĩa, S3 là lưu trữ, ECS chạy container (có thể tạo EC2 nhưng không phải dịch vụ dùng để tạo instance).", "15-24": "Workload không được gián đoạn, chạy 3 năm thì Reserved Instance là tiết kiệm nhất. Spot có thể bị ngắt. On-Demand đắt hơn. Dedicated đắt và không cần.", "15-27": "Kết nối VPC với data center on-premises dùng VPN (qua internet, mã hoá) hoặc Direct Connect (đường truyền riêng). Redshift là kho dữ liệu, API Gateway tạo API.", "15-28": "Lambda cho phép chạy code mà không cần máy chủ, giảm hạ tầng tính toán vật lý mà developer phải quản lý. EC2 là máy chủ ảo. DynamoDB là CSDL (cũng serverless nhưng không chạy code). CodeCommit lưu mã nguồn.", "15-29": "Personal Health Dashboard (nay là AWS Health Dashboard) cảnh báo khi sự kiện của AWS có thể ảnh hưởng tài nguyên của bạn. Service Health Dashboard chỉ hiện tình trạng chung. IEM là dịch vụ hỗ trợ sự kiện của gói Enterprise.", "15-30": "5 nhóm kiểm tra của Trusted Advisor: Cost Optimization, Performance, Security, Fault Tolerance, Service Limits (Service Quotas). Instance Usage, Infrastructure và Storage Capacity không phải tên nhóm.", "15-31": "Với EC2, khách hàng phải tự lo cấu hình hệ điều hành, vá bảo mật và cấu hình mạng. RDS, ElastiCache và Fargate là dịch vụ được quản lý, AWS lo phần OS.", "15-32": "Chuyển lên cloud đổi chi phí đầu tư lớn trả trước (CapEx) thành chi phí vận hành biến đổi (OpEx). Các lựa chọn khác đảo ngược hoặc sai bản chất.", "15-33": "Theo đề, dùng Simple Monthly Calculator để dự báo chi phí cho ứng dụng mới. Công cụ này nay đã được thay bằng AWS Pricing Calculator. Aurora Backtrack là khôi phục CSDL. Billing Alarm cảnh báo chi phí. Cost and Usage Report là chi phí đã phát sinh.", "15-34": "Gói Business là gói thấp nhất có hỗ trợ kỹ thuật qua điện thoại. Developer chỉ có email.", "15-35": "Quản lý edge location là trách nhiệm hoàn toàn của AWS. Bảo mật ứng dụng và dữ liệu phía client là của khách hàng. Quản lý bản vá là trách nhiệm chung (shared).", "15-50": "Multi-site active-active có xác suất ngừng hoạt động thấp nhất vì cả hai nơi đều đang chạy. Thứ tự từ chậm phục hồi đến nhanh: Backup & Restore, Pilot Light, Warm Standby, Multi-site.", "16-21": "Tăng bảo mật đăng nhập: bật MFA (B) và đặt chính sách mật khẩu mạnh (D). Certificate Manager quản lý SSL. Cognito dành cho người dùng ứng dụng. Organizations quản lý nhiều tài khoản.", "16-24": "AWS Artifact cung cấp tài liệu bảo mật và tuân thủ của AWS. B là AWS Config. C là Skill Builder. D là Inspector.", "16-27": "Instance store là lưu trữ tạm (ephemeral), dữ liệu bị xoá khi instance bị stop hoặc terminate. EBS, EFS và S3 đều lưu bền vững.", "16-29": "Lambda là dịch vụ tính toán được AWS quản lý hoàn toàn (serverless). EC2 thì bạn tự quản lý OS. SWF là dịch vụ điều phối workflow. Aurora là CSDL.", "16-31": "AWS SDK cho phép developer gọi dịch vụ AWS từ trong code ứng dụng. Console là giao diện web, CodePipeline là CI/CD, Config theo dõi cấu hình.", "16-35": "CodeCommit có mục đích chính là quản lý phiên bản phần mềm (Git). CodeStar là công cụ quản lý dự án (đã ngừng), CLI là dòng lệnh, Cognito lo đăng nhập.", "16-38": "Mô hình giá AWS là trả theo mức dùng (pay-as-you-go) và chi phí biến đổi (variable cost). Fixed-term và planned mô tả mô hình truyền thống. Colocation là thuê chỗ đặt máy chủ ở data center.", "16-45": "Thảm họa ảnh hưởng cả một vùng địa lý thì cần triển khai trên nhiều Region. Nhiều AZ trong một Region vẫn có thể bị ảnh hưởng chung. Artifact là báo cáo tuân thủ, không lưu artifact ứng dụng.", "16-49": "WAF (chặn tấn công tầng ứng dụng) và CloudFront (phân tán lưu lượng ở edge, có Shield Standard) có tính năng giảm thiểu DDoS. DynamoDB, EC2 và Inspector không có.", "17-10": "CloudFront giúp website tĩnh có độ trễ thấp và tốc độ truyền cao. Lambda chạy code. DAX là cache cho DynamoDB. Route 53 là DNS.", "17-12": "TCO Calculator (nay là Migration Evaluator) cho thấy khoản tiết kiệm có thể đạt được khi chuyển từ on-prem lên AWS. Budgets và Cost Explorer dùng cho chi phí AWS đã có. Well-Architected Tool đánh giá kiến trúc.", "17-16": "AWS Shield bảo vệ ứng dụng khỏi DDoS với khả năng phát hiện luôn bật và giảm thiểu tự động ngay trên đường truyền. Inspector quét lỗ hổng. WAF lọc request web. ELB chia tải.", "17-21": "Consolidated billing của AWS Organizations cho phép chia sẻ giảm giá Reserved Instance giữa các tài khoản. Dedicated Instance, Cost Explorer và Budgets không làm được.", "17-25": "Mở rộng kiến trúc on-prem lên AWS: Direct Connect (kết nối mạng riêng) và Storage Gateway (lưu trữ hybrid). EBS là ổ đĩa, CloudFront là CDN, Connect là tổng đài.", "17-31": "Liên kết lỏng các thành phần là nguyên tắc thiết kế cloud. A sai, nên scale out (ngang) thay vì scale up (dọc). C sai, tránh kiến trúc nguyên khối. D không phải nguyên tắc kiến trúc.", "17-32": "Khách hàng chịu trách nhiệm vá hệ điều hành (B, trên EC2) và cấu hình security group (E). Firmware hạ tầng mạng, hypervisor và an ninh vật lý là của AWS.", "17-35": "Quản lý cấu hình là kiểm soát chung: AWS cấu hình thiết bị hạ tầng, khách hàng cấu hình OS, CSDL, ứng dụng của mình.", "17-40": "AWS Organizations quản lý tập trung quyền truy cập nhiều tài khoản (qua SCP). Service Catalog là danh mục sản phẩm, Config theo dõi cấu hình, Trusted Advisor đưa khuyến nghị.", "17-44": "Với khách hàng ở nhiều nước: triển khai ở nhiều Region để giảm độ trễ (A), và CloudFront có nhiều edge location trên thế giới (C). B sai, Translate không tự dịch website bên thứ ba. D, Comprehend phân tích văn bản, không phải lợi ích về hạ tầng. E sai, ELB chỉ hoạt động trong một Region.", "18-2": "Gói Basic không có hỗ trợ kỹ thuật từ kỹ sư, nên hỏi qua diễn đàn thảo luận (nay là AWS re:Post). Senior Support Engineers và TAM cần gói cao hơn. Trusted Advisor là công cụ tự động.", "18-3": "6 trụ cột của Well-Architected gồm: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability. Nhiều AZ, mã hoá và high availability là kỹ thuật hoặc đặc tính, không phải tên trụ cột.", "18-7": "Để ứng dụng trong VPC truy cập tài nguyên on-prem: tạo VPN giữa thiết bị on-prem và virtual private gateway của VPC (B), hoặc dùng Direct Connect (D). Service Catalog, Athena và CloudFront không tạo kết nối mạng.", "18-11": "Amazon Athena truy vấn trực tiếp dữ liệu trong S3 bằng SQL chuẩn, serverless. Glue là ETL, Data Pipeline chuyển dữ liệu, CloudSearch là dịch vụ tìm kiếm.", "18-21": "Amazon Macie dùng học máy tự động nhận diện và phân loại dữ liệu nhạy cảm (thông tin cá nhân, sở hữu trí tuệ) trên S3. GuardDuty phát hiện mối đe doạ, Inspector quét lỗ hổng, Shield chống DDoS.", "18-35": "AWS Config ghi lại lịch sử cấu hình tài nguyên, cho biết tài nguyên đã thay đổi gì theo thời gian. Inspector quét lỗ hổng, Service Catalog là danh mục sản phẩm, IAM quản lý quyền.", "18-36": "AWS giảm TCO chủ yếu nhờ loại bỏ các khoản đầu tư lớn ban đầu (CapEx) như mua máy chủ, xây data center. B sai, bạn vẫn lo bản quyền phần mềm bên thứ ba. C sai, vẫn có chi phí vận hành. D sai, AWS không quản lý ứng dụng của bạn.", "18-37": "Đảm bảo ổ EBS được sao lưu (tạo snapshot) là việc của khách hàng. Kết nối mạng từ AWS ra internet, vá hạ tầng và an ninh vật lý là của AWS.", "18-38": "Ưu điểm của AWS: không cần đoán dung lượng (B) và tăng tốc ra thị trường (C). AWS không có giá cố định hằng tháng, giảm (không tăng) CapEx, và không cho vào data center.", "18-40": "Consolidated billing cộng dồn mức dùng của các tài khoản thành viên để đạt các bậc giá theo khối lượng (usage tiers). SCP giới hạn quyền. All Upfront RI là cách mua. Cost Explorer xem chi phí.", "18-43": "Người dùng không phải chờ cấp phát hạ tầng (vài phút thay vì vài tuần), nên làm việc hiệu quả hơn. B không chắc đúng. C và D sai, khách hàng vẫn lo cấu hình ứng dụng và tuân thủ.", "19-24": "Tăng bảo mật khi đăng nhập Console: bật MFA (C) và đặt chính sách mật khẩu mạnh (E). Secrets Manager lưu mật khẩu ứng dụng, Certificate Manager quản lý chứng chỉ SSL, Security Group là tường lửa mạng, không liên quan đăng nhập Console.", "19-27": "Trusted Advisor đưa danh sách khuyến nghị tối ưu chi phí theo mức dùng hiện tại (B) và phát hiện lỗ hổng bảo mật tiềm ẩn do cấu hình quyền (C, ví dụ bucket S3 công khai). Nó không quét lỗ hổng phần mềm (Inspector), không tự sửa lỗi, không cảnh báo EC2 bị xâm nhập (GuardDuty).", "19-31": "AWS Billing and Cost Management là nơi thanh toán hoá đơn, theo dõi mức dùng và ngân sách (gồm Bills, Cost Explorer, Budgets…). Consolidated billing là một tính năng gộp hoá đơn. CloudWatch giám sát. QuickSight là BI.", "19-32": "Availability Zone gồm một hoặc nhiều data center riêng biệt, mỗi cái có điện, mạng và kết nối dự phòng, đặt ở các toà nhà riêng. Region chứa nhiều AZ. Edge location dùng cho CloudFront.", "19-34": "Đáp án theo đề là Auto Scaling: tự tăng giảm tài nguyên mà không cần lên kế hoạch dung lượng. Lưu ý: Lambda cũng tự mở rộng mà không cần lên kế hoạch dung lượng, nên câu này có thể gây tranh cãi. Redshift và CloudTrail không liên quan.", "19-35": "Concierge team (hỗ trợ hoá đơn và tài khoản) chỉ có ở gói Enterprise. Trusted Advisor (bản cơ bản) và support case có ở các gói khác. Amazon Connect là dịch vụ tổng đài.", "19-37": "Chỉ cần bắt đầu tạo tài nguyên ở Region thứ hai, không cần ký hợp đồng mới hay tải gì. AZ không di chuyển được giữa các Region. Console là web, không cần tải về.", "19-38": "Yêu cầu chạy trên máy chủ vật lý riêng và quản lý bản quyền phần mềm (theo socket, core) thì chọn Dedicated Host. Dedicated Instance không cho thấy, kiểm soát máy chủ vật lý cụ thể để quản lý bản quyền.", "19-40": "TCO Calculator (nay là Migration Evaluator) đưa báo cáo chi tiết về khoản tiết kiệm ước tính sau khi chuyển lên AWS. Cost Explorer xem chi phí đã dùng, Budgets đặt ngân sách, Migration Hub theo dõi tiến độ di chuyển.", "19-41": "Đánh giá ứng dụng để chuyển lên cloud: nhờ AWS Professional Services (B) hoặc đối tác trong AWS Partner Network (D). Trusted Advisor, Systems Manager và Secrets Manager không dùng để đánh giá việc di chuyển.", "19-45": "Giá trị của AWS: không cần hợp đồng dài hạn. A sai, bảo mật TRONG cloud là của khách hàng. C sai, tạo máy chủ trong vài phút chứ không phải vài ngày. D sai.", "20-21": "Region là thành phần của hạ tầng toàn cầu AWS. Alexa là trợ lý giọng nói, Lightsail là dịch vụ máy chủ, Organizations quản lý tài khoản.", "20-23": "ELB xử lý được việc lưu lượng mạng thay đổi liên tục, tự mở rộng năng lực của chính nó và chia tải cho các target. (File gốc bị lỗi tách dòng các đáp án, mình đã sắp xếp lại cho đúng như Đề 20 câu 23.) ELB không chuyển đổi loại load balancer, không tự thêm EC2 (đó là Auto Scaling), và có tính phí.", "20-26": "Chặn request từ một mạng cụ thể: WAF chặn theo IP hoặc dải IP ở tầng ứng dụng (A), và Network ACL có quy tắc deny chặn IP ở cấp subnet (E). Trusted Advisor, Direct Connect và Organizations không chặn lưu lượng.", "21-26": "Tính co giãn giúp không phải đoán trước nhu cầu hạ tầng: cần bao nhiêu dùng bấy nhiêu. A là global reach. B là bảo mật. D là economies of scale.", "21-27": "Truy cập bằng chương trình cần access key ID (A) và secret access key (C). Primary key, secondary key và user ID không phải thông tin xác thực của AWS.", "22-8": "Tăng tính sẵn sàng bằng cách đặt các EC2 ở nhiều AZ trong một Region. B, cùng một AZ thì sập chung. C sai vì một AZ thuộc về một Region duy nhất. D, Spot có thể bị thu hồi nên không tăng tính sẵn sàng.", "23-35": "Website ở một Region phục vụ người dùng toàn cầu với độ trễ thấp và tốc độ cao: Global Accelerator (đưa lưu lượng vào mạng AWS sớm) và CloudFront (cache ở edge). ALB chia tải trong Region. Direct Connect nối on-prem. Lambda chạy code."};
const VI={"1-1": {"q": "AWS cho phép người dùng quản lý tài nguyên qua một giao diện web. Giao diện này tên là gì?", "o": ["AWS CLI.", "AWS API.", "AWS SDK.", "AWS Management Console."]}, "1-2": {"q": "Đâu là ví dụ về mở rộng theo chiều ngang (horizontal scaling) trên AWS Cloud?", "o": ["Thay một EC2 đang có bằng một EC2 lớn hơn, mạnh hơn.", "Tăng năng lực tính toán của một EC2 để đáp ứng nhu cầu ngày càng tăng của ứng dụng.", "Thêm RAM cho một EC2.", "Thêm nhiều EC2 cùng kích cỡ để xử lý lượng truy cập tăng lên."]}, "1-3": {"q": "Bạn nhận thấy một số EC2 quan trọng đã bị xoá (terminate). Dịch vụ AWS nào giúp bạn biết ai đã làm việc này?", "o": ["Amazon Inspector.", "AWS CloudTrail.", "AWS Trusted Advisor.", "Báo cáo sử dụng EC2 (EC2 Instance Usage Report)."]}, "1-4": {"q": "Những lựa chọn nào dưới đây liên quan tới độ tin cậy (reliability) của AWS? (Chọn 2)", "o": ["Áp dụng nguyên tắc quyền tối thiểu cho mọi tài nguyên AWS.", "Tự động cấp phát tài nguyên mới để đáp ứng nhu cầu.", "Mọi dịch vụ AWS đều là dịch vụ toàn cầu, thiết kế này giúp khách hàng phục vụ người dùng quốc tế.", "Bồi thường cho khách hàng khi có sự cố.", "Khả năng phục hồi nhanh sau sự cố."]}, "1-5": {"q": "Phát biểu nào đúng về Mô hình Trách nhiệm Chung (Shared Responsibility Model) của AWS?", "o": ["Trách nhiệm thay đổi tùy theo dịch vụ được sử dụng.", "Bảo mật của các dịch vụ IaaS là trách nhiệm của AWS.", "Vá hệ điều hành khách (guest OS) luôn là trách nhiệm của AWS.", "Bảo mật của các dịch vụ được quản lý là trách nhiệm của khách hàng."]}, "1-6": {"q": "Bạn đã thiết lập thanh toán gộp (consolidated billing) cho nhiều tài khoản AWS. Một tài khoản đã mua một số Reserved Instance thời hạn 3 năm. Điều nào sau đây đúng?", "o": ["Mức giảm giá Reserved Instance chỉ được chia sẻ với tài khoản chính (master).", "Tất cả tài khoản đều được hưởng lợi ích giảm giá theo giờ của Reserved Instance.", "Các instance đã mua sẽ có hiệu năng tốt hơn On-Demand.", "Consolidated billing không có lợi ích chi phí, chỉ để tham khảo."]}, "1-7": {"q": "Một công ty phát triển ứng dụng web thương mại điện tử trên AWS. Họ nên làm gì để ứng dụng có tính sẵn sàng cao nhất?", "o": ["Triển khai trên nhiều Availability Zone và Edge Location.", "Triển khai trên nhiều Availability Zone và subnet.", "Triển khai trên nhiều Region và Availability Zone.", "Triển khai trên nhiều VPC và subnet."]}, "1-8": {"q": "AWS Snowball cung cấp những gì? (Chọn 2)", "o": ["Khả năng tính toán tích hợp, cho phép xử lý dữ liệu tại chỗ.", "Danh mục phần mềm bên thứ ba mà khách hàng cần để xây giải pháp và vận hành kinh doanh.", "Lưu trữ đám mây lai giữa môi trường on-premises và AWS.", "Dịch vụ truyền dữ liệu quy mô exabyte, chuyển lượng dữ liệu cực lớn lên AWS.", "Truyền an toàn lượng lớn dữ liệu vào và ra khỏi AWS."]}, "1-9": {"q": "Một công ty có gói AWS Enterprise Support. Họ muốn được hướng dẫn nhanh và hiệu quả về các câu hỏi hoá đơn và tài khoản. Họ nên dùng gì?", "o": ["AWS Health Dashboard.", "AWS Support Concierge.", "AWS Customer Service.", "AWS Operations Support."]}, "1-10": {"q": "Một công ty Nhật chạy ứng dụng trên EC2 ở Region Tokyo. Công ty mở chi nhánh mới ở Mỹ và người dùng Mỹ phàn nàn độ trễ cao. Công ty có thể làm gì để giảm độ trễ cho người dùng Mỹ mà vẫn tiết kiệm chi phí?", "o": ["Áp dụng chính sách định tuyến theo độ trễ của Amazon Connect.", "Đăng ký tên miền Mỹ mới để phục vụ người dùng Mỹ.", "Xây data center mới ở Mỹ và áp dụng mô hình hybrid.", "Triển khai EC2 mới ở một Region đặt tại Mỹ."]}, "1-11": {"q": "Một tổ chức có nhiều nhân viên kỹ thuật vận hành hạ tầng AWS. AWS cung cấp gì để chia họ thành các nhóm rồi gán quyền phù hợp cho từng nhóm?", "o": ["IAM role.", "IAM user.", "IAM user group.", "AWS Organizations."]}, "1-12": {"q": "Một công ty quyết định chuyển CSDL Oracle lên AWS. Dịch vụ nào giúp làm việc này mà không ảnh hưởng tới hoạt động của CSDL nguồn?", "o": ["AWS OpsWorks.", "AWS Database Migration Service.", "AWS Server Migration Service.", "AWS Application Discovery Service."]}, "1-13": {"q": "Điều chỉnh năng lực tính toán một cách linh hoạt để giảm chi phí là áp dụng best practice nào của AWS Cloud?", "o": ["Đặt bảo mật ở mọi tầng.", "Song song hoá các tác vụ.", "Áp dụng tính co giãn (elasticity).", "Dùng kiến trúc nguyên khối."]}, "1-14": {"q": "Lợi ích của việc đặt hạ tầng trên AWS là gì? (Chọn 2)", "o": ["Tăng tốc độ và sự linh hoạt.", "Không cần lo về bảo mật.", "Kiểm soát hoàn toàn hạ tầng vật lý.", "Vận hành ứng dụng thay cho khách hàng.", "Toàn bộ bảo mật vật lý và phần lớn bảo mật dữ liệu, mạng đã được lo cho bạn."]}, "1-15": {"q": "Lợi ích của việc «tách rời» (decoupling) ứng dụng theo khuyến nghị của AWS là gì?", "o": ["Cho phép coi ứng dụng là một khối thống nhất.", "Giảm phụ thuộc lẫn nhau, để lỗi không ảnh hưởng các thành phần khác của ứng dụng.", "Cho phép cập nhật ứng dụng nguyên khối nhanh và dễ dàng.", "Cho phép theo dõi mọi lệnh API gọi tới dịch vụ AWS."]}, "1-16": {"q": "Công cụ nào giúp khách hàng xem hoạt động tính tiền EC2 của tháng trước?", "o": ["AWS Budgets.", "AWS Pricing Calculator.", "AWS Systems Manager.", "AWS Cost & Usage Reports."]}, "1-17": {"q": "Bạn được gì khi thiết lập consolidated billing cho 5 tài khoản AWS dưới một tài khoản chính?", "o": ["Chi phí dịch vụ AWS giảm còn một nửa.", "Tính năng consolidated billing chỉ để sắp xếp tổ chức.", "Mỗi tài khoản được giảm giá theo khối lượng.", "Mỗi tài khoản được gấp 5 lần dung lượng Free Tier."]}, "1-18": {"q": "Bạn nên làm gì để giữ an toàn dữ liệu trên ổ EBS? (Chọn 2)", "o": ["Thường xuyên cập nhật firmware của thiết bị EBS.", "Tạo EBS snapshot.", "Đảm bảo dữ liệu EBS được mã hoá khi lưu trữ.", "Lưu bản sao lưu hằng ngày vào ổ cứng ngoài.", "Ngăn mọi truy cập trái phép vào data center của AWS."]}, "1-19": {"q": "Một best practice quan trọng nhất của AWS là nguyên tắc kiến trúc co giãn (elasticity). Nguyên tắc này cải thiện thiết kế kiến trúc của bạn như thế nào?", "o": ["Tự động mở rộng tài nguyên on-premises theo thay đổi nhu cầu.", "Tự động mở rộ  cụ thể tới ứng dụng web trên AWS? (Chọn 2)", "o": ["AWS WAF.", "AWS Trusted Advisor.", "AWS Direct Connect.", "AWS Organizations.", "Network ACL."]}, "21-26": {"q": "Lợi ích nào của AWS Cloud giúp người dùng không phải cố ước tính mức dùng hạ tầng tương lai?", "o": ["Triển khai ứng dụng dễ và nhanh ở nhiều Region trên thế giới.", "Bảo mật của AWS Cloud.", "Tính co giãn của AWS Cloud.", "Chi phí biến đổi thấp hơn nhờ lợi thế quy mô lớn."]}, "21-27": {"q": "Cần thành phần thông tin đăng nhập nào để truy cập tài khoản AWS bằng chương trình? (Chọn 2)", "o": ["Access key ID.", "Primary key.", "Secret access key.", "User ID.", "Secondary key."]}, "22-8": {"q": "Một người dùng định chạy thêm 2 EC2 để tăng tính sẵn sàng. Người dùng nên làm gì?", "o": ["Chạy các instance trên nhiều Availability Zone trong một Region.", "Chạy các instance dạng Reserved Instance trong cùng Region và cùng AZ.", "Chạy các instance ở nhiều Region nhưng cùng một AZ.", "Chạy các instance dạng Spot Instance trong cùng Region nhưng khác AZ."]}, "23-35": {"q": "Một công ty định ra mắt website thương mại điện tử ở một Region cho người dùng khắp thế giới. Dịch vụ AWS nào giúp tiếp cận người dùng với độ trễ thấp và tốc độ truyền cao? (Chọn 2)", "o": ["Application Load Balancer.", "AWS Global Accelerator.", "AWS Direct Connect.", "Amazon CloudFront.", "AWS Lambda."]}};
const KEY="clf-practice-v1";
let st={};               // id -> {pick:[...], done:true, peek:true}
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let exam="1",filter="all",revealAll=false,confirming=false;

const ALL=[];
EXAMS.forEach(e=>DATA[e].forEach(q=>ALL.push({...q,e,id:e+"-"+q.n})));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const isRight=q=>{const s=st[q.id];return s&&s.done&&same(s.pick,q.a)};
const scope=()=>ALL.filter(q=>exam==="all"||q.e===exam);

function seg(id,cb){const el=document.getElementById(id);el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));cb(b.dataset.v)})}
seg("examSeg",v=>{exam=v;confirming=false;render()});
seg("filterSeg",v=>{filter=v;render()});
document.getElementById("revealAll").onclick=function(){revealAll=!revealAll;this.textContent=revealAll?"Ẩn đáp án chưa làm":"Hiện tất cả đáp án";render()};

function stats(){
  const s=scope(),n=s.length,done=s.filter(q=>st[q.id]&&st[q.id].done).length,ok=s.filter(isRight).length,bad=done-ok;
  const pct=done?Math.round(ok/done*100):0;
  document.getElementById("stats").innerHTML=`<span>Đã làm <b>${done}/${n}</b></span><span class="good">Đúng <b>${ok}</b></span><span class="wrong">Sai <b>${bad}</b></span><span>Tỉ lệ đúng <b>${pct}%</b></span><span>${done===n&&n?(pct>=70?"Đạt mức đậu (≥70%)":"Chưa đạt 70%, ôn lại câu sai nhé"):""}</span>`;
  const t=document.getElementById("track").children;t[0].style.width=(ok/n*100)+"%";t[1].style.width=(bad/n*100)+"%";
  const rb=document.getElementById("resetBox");
  rb.innerHTML=confirming?`<span class="confirm">Xoá kết quả ${exam==="all"?"cả 23 đề":"đề "+exam}? <button type="button" class="btn" id="yesReset">Xoá</button><button type="button" class="btn" id="noReset">Huỷ</button></span>`:`<button type="button" class="btn" id="resetBtn">${exam==="all"?"Làm lại cả 23 đề":"Làm lại đề này"}</button>`;
  if(confirming){document.getElementById("yesReset").onclick=()=>{scope().forEach(q=>delete st[q.id]);save();confirming=false;render()};document.getElementById("noReset").onclick=()=>{confirming=false;stats()}}
  else document.getElementById("resetBtn").onclick=()=>{confirming=true;stats()};
}

function card(q){
  const s=st[q.id]||{pick:[]},multi=q.a.length>1,shown=s.done||s.peek||revealAll;
  const opts=q.o.map(([k,t])=>{
    let c="";
    if(shown){if(q.a.includes(k))c="right";else if(s.done&&s.pick.includes(k))c="wrongpick"}
    else if(s.pick.includes(k))c="sel";
    return `<button type="button" class="opt ${c}" data-q="${q.id}" data-k="${k}" ${shown?"disabled":""}><span class="letter">${k}</span><span class="t">${esc(t)}</span></button>`}).join("");
  let state="";
  if(s.done)state=isRight(q)?`<span class="state ok">Đúng</span>`:`<span class="state bad">Sai</span>`;
  let actions="";
  if(!shown){
    actions=`<div class="actions">${multi?`<button type="button" class="btn primary" data-check="${q.id}" ${s.pick.length===q.a.length?"":"disabled"}>Kiểm tra</button><span class="hint">Chọn ${q.a.length} đáp án (đã chọn ${s.pick.length})</span>`:""}<button type="button" class="link" data-peek="${q.id}">Xem đáp án</button></div>`;
  }else if(!s.done&&s.peek){
    actions=`<div class="actions"><button type="button" class="link" data-unpeek="${q.id}">Ẩn và tự làm</button></div>`;
  }else if(s.done){
    actions=`<div class="actions"><button type="button" class="link" data-retry="${q.id}">Làm lại câu này</button></div>`;
  }
  const exp=shown?`<div class="exp"><span class="ans">Đáp án: ${q.a.join(", ")}</span><p>${esc(EXP[q.id]||"")}</p>${VI[q.id]?`<div class="tr"><span class="lbl">Dịch câu hỏi</span><p>${esc(VI[q.id].q)}</p><ul>${VI[q.id].o.map((x,i)=>{const k=q.o[i][0];return `<li class="${q.a.includes(k)?"ok":""}"><b>${k}</b><span>${esc(x)}</span></li>`}).join("")}</ul></div>`:""}</div>`:"";
  return `<article class="q" id="q-${q.id}"><div class="qhead"><span class="qnum">ĐỀ ${q.e} · CÂU ${q.n}</span>${multi?`<span class="multi">Chọn ${q.a.length}</span>`:""}${state}</div><p class="qtext">${esc(q.q)}</p><div class="opts">${opts}</div>${actions}${exp}</article>`;
}

function render(){
  stats();
  const rows=scope().filter(q=>{const s=st[q.id];if(filter==="todo")return!(s&&s.done);if(filter==="wrong")return s&&s.done&&!isRight(q);return true});
  document.getElementById("list").innerHTML=rows.length?rows.map(card).join(""):`<div class="empty">${filter==="wrong"?"Không có câu sai nào. Tốt lắm!":"Bạn đã làm hết các câu trong phần này."}</div>`;
}
function rerender(id){const q=ALL.find(x=>x.id===id),el=document.getElementById("q-"+id);if(el)el.outerHTML=card(q);stats()}

document.getElementById("list").addEventListener("click",e=>{
  const o=e.target.closest(".opt");
  if(o&&!o.disabled){
    const id=o.dataset.q,k=o.dataset.k,q=ALL.find(x=>x.id===id);
    const s=st[id]||(st[id]={pick:[]});
    if(q.a.length===1){s.pick=[k];s.done=true}
    else{s.pick=s.pick.includes(k)?s.pick.filter(x=>x!==k):(s.pick.length<q.a.length?[...s.pick,k]:s.pick)}
    save();rerender(id);return;
  }
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.check){const s=st[b.dataset.check];s.done=true;s.pick.sort();save();rerender(b.dataset.check)}
  else if(b.dataset.peek){(st[b.dataset.peek]||(st[b.dataset.peek]={pick:[]})).peek=true;save();rerender(b.dataset.peek)}
  else if(b.dataset.unpeek){const s=st[b.dataset.unpeek];if(s)s.peek=false;save();rerender(b.dataset.unpeek)}
  else if(b.dataset.retry){delete st[b.dataset.retry];save();rerender(b.dataset.retry)}
});
render();
</script>

</body></html>
