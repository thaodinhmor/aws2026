ựa vào độ trễ thấp tới người dùng (A) và tuân thủ chủ quyền dữ liệu (C), cùng giá và dịch vụ có sẵn. Ngôn ngữ giao diện, chi phí làm mát (AWS chịu) và khoảng cách tới văn phòng (không thể vào data center) không liên quan.", "11-47": "Personal Health Dashboard (nay là AWS Health Dashboard) cảnh báo khi sự kiện của AWS có thể ảnh hưởng tài nguyên của bạn. Service Health Dashboard chỉ hiện tình trạng chung. IEM là dịch vụ hỗ trợ sự kiện của gói Enterprise.", "11-48": "Multi-site active-active có xác suất ngừng hoạt động thấp nhất vì cả hai nơi đều đang chạy. Thứ tự từ chậm phục hồi đến nhanh: Backup & Restore, Pilot Light, Warm Standby, Multi-site.", "11-49": "CodeCommit có mục đích chính là quản lý phiên bản phần mềm (Git). CodeStar là công cụ quản lý dự án (đã ngừng), CLI là dòng lệnh, Cognito lo đăng nhập.", "11-50": "Tăng bảo mật đăng nhập: bật MFA (B) và đặt chính sách mật khẩu mạnh (D). Certificate Manager quản lý SSL. Cognito dành cho người dùng ứng dụng. Organizations quản lý nhiều tài khoản.", "12-1": "Availability Zone gồm một hoặc nhiều data center riêng biệt, nối với nhau bằng đường truyền độ trễ thấp. Edge location dùng cho CDN. Region gồm nhiều AZ.", "12-2": "On-Demand chỉ trả cho thời gian dùng thực tế. A, đấu giá là cơ chế cũ của Spot. B sai. D mô tả Reserved Instance.", "12-3": "Đánh giá ứng dụng để chuyển lên cloud: nhờ AWS Professional Services (B) hoặc đối tác trong AWS Partner Network (D). Trusted Advisor, Systems Manager và Secrets Manager không dùng để đánh giá việc di chuyển.", "12-4": "Edge location giúp giảm độ trễ và cải thiện hiệu năng cho người dùng. Edge location không chạy EC2 thông thường. C sai, cache dữ liệu ít thay đổi chứ không phải dữ liệu thay đổi liên tục. D sai, không phải làm mới hằng ngày.", "12-5": "Cách hợp lệ để làm việc với dịch vụ AWS: CLI (A) và SDK (C), cùng Management Console và API. On-premises, SaaS, Hybrid là mô hình triển khai hoặc dịch vụ, không phải cách tương tác.", "12-6": "Giá trị của AWS: không cần hợp đồng dài hạn. A sai, bảo mật TRONG cloud là của khách hàng. C sai, tạo máy chủ trong vài phút chứ không phải vài ngày. D sai.", "12-7": "Workload không được gián đoạn, chạy 3 năm thì Reserved Instance là tiết kiệm nhất. Spot có thể bị ngắt. On-Demand đắt hơn. Dedicated đắt và không cần.", "12-8": "AWS Config theo dõi, ghi lại và kiểm toán thay đổi cấu hình tài nguyên. Shield chống DDoS, IAM quản lý quyền, Inspector quét lỗ hổng.", "12-9": "Global reach (tiếp cận toàn cầu) giúp đặt ứng dụng gần khách hàng ở mọi nơi để giảm độ trễ. Fault tolerance, pay-as-you-go và high availability không giải quyết độ trễ.", "12-10": "Consolidated billing của AWS Organizations cho phép chia sẻ giảm giá Reserved Instance giữa các tài khoản. Dedicated Instance, Cost Explorer và Budgets không làm được.", "12-11": "AWS giúp thiết kế sẵn sàng cao dễ dàng (C, nhiều AZ) và đáp ứng dễ dàng khi nhu cầu thay đổi (D, co giãn). A sai, AWS không tự phân phối dữ liệu toàn cầu. B và E sai, vận hành và vá ứng dụng là việc của khách hàng.", "12-12": "Với EC2, khách hàng phải tự lo cấu hình hệ điều hành, vá bảo mật và cấu hình mạng. RDS, ElastiCache và Fargate là dịch vụ được quản lý, AWS lo phần OS.", "12-13": "Tăng bảo mật cho IAM user: dùng MFA (D) và bắt buộc mật khẩu mạnh, có thời hạn (E). Rekognition là phân tích ảnh, Shield chống DDoS, Security Group lọc lưu lượng mạng chứ không bảo vệ user.", "12-14": "Storage Gateway là dịch vụ lưu trữ hybrid, cho ứng dụng on-prem dùng lưu trữ cloud liền mạch. Glacier là lưu trữ dài hạn, Snowball chuyển dữ liệu vật lý, EBS gắn EC2.", "12-15": "AWS Marketplace là danh mục phần mềm từ nhà cung cấp độc lập để tìm, thử, mua và triển khai trên AWS. Lumberyard là game engine (đã ngừng), Artifact là báo cáo tuân thủ, CloudSearch là dịch vụ tìm kiếm.", "12-16": "Region là thành phần của hạ tầng toàn cầu AWS. Alexa là trợ lý giọng nói, Lightsail là dịch vụ máy chủ, Organizations quản lý tài khoản.", "12-17": "Giá Spot thay đổi theo cung và cầu dung lượng EC2 dư thừa. On-Demand và Reserved có giá cố định.", "12-18": "Để ứng dụng trong VPC truy cập tài nguyên on-prem: tạo VPN giữa thiết bị on-prem và virtual private gateway của VPC (B), hoặc dùng Direct Connect (D). Service Catalog, Athena và CloudFront không tạo kết nối mạng.", "12-19": "Cách ĐƠN GIẢN NHẤT là chạy Trusted Advisor, nó có sẵn mục kiểm tra security group mở không giới hạn. A làm tay, tốn công. C sai, IAM không quản lý security group. D phức tạp.", "12-20": "AWS cung cấp kiểm tra bảo mật của Trusted Advisor (B) và mã hoá dữ liệu (C, KMS, mã hoá S3, EBS). AWS không tự pen test hộ bạn, không phát hiện nội dung có bản quyền trên S3. Token MFA vật lý do bên thứ ba bán.", "12-21": "WAF (chặn tấn công tầng ứng dụng) và CloudFront (phân tán lưu lượng ở edge, có Shield Standard) có tính năng giảm thiểu DDoS. DynamoDB, EC2 và Inspector không có.", "12-22": "AMI (Amazon Machine Image) dùng để tạo EC2 đã cấu hình sẵn. EBS là ổ đĩa, Systems Manager quản lý máy chủ, AppStream stream ứng dụng.", "12-23": "Hỗ trợ tăng người dùng, lưu lượng, dữ liệu mà không giảm hiệu năng là nguyên tắc co giãn (implement elasticity) theo whitepaper Cloud Best Practices. Think parallel là xử lý song song. Decouple là tách rời. Design for failure là thiết kế cho lỗi.", "12-24": "Tính co giãn giúp không phải đoán trước nhu cầu hạ tầng: cần bao nhiêu dùng bấy nhiêu. A là global reach. B là bảo mật. D là economies of scale.", "12-25": "AWS Artifact cung cấp tài liệu bảo mật và tuân thủ của AWS. B là AWS Config. C là Skill Builder. D là Inspector.", "12-26": "So với data center truyền thống, AWS có chi phí biến đổi thấp hơn (nhờ quy mô) và chi phí trả trước thấp hơn (không cần mua máy).", "12-27": "CloudFront giúp website tĩnh có độ trễ thấp và tốc độ truyền cao. Lambda chạy code. DAX là cache cho DynamoDB. Route 53 là DNS.", "12-28": "Auto Scaling Group tự thêm hoặc thay instance trên nhiều AZ khi cần, giúp sẵn sàng cao. A sai, chỉ trong một Region. C là CloudFront. D là Load Balancer.", "12-30": "Theo đề, dùng Simple Monthly Calculator để dự báo chi phí cho ứng dụng mới. Công cụ này nay đã được thay bằng AWS Pricing Calculator. Aurora Backtrack là khôi phục CSDL. Billing Alarm cảnh báo chi phí. Cost and Usage Report là chi phí đã phát sinh.", "12-31": "Tài liệu tuân thủ như báo cáo SOC 1 nằm ở AWS Artifact. Inspector quét lỗ hổng, CloudTrail ghi log, Certificate Manager quản lý SSL.", "12-32": "Bảo mật hypervisor của EC2 là trách nhiệm của AWS. Mã hoá phía client, cấu hình IAM role và chính sách mật khẩu là việc của khách hàng.", "12-33": "Khách hàng chịu trách nhiệm vá hệ điều hành (B, trên EC2) và cấu hình security group (E). Firmware hạ tầng mạng, hypervisor và an ninh vật lý là của AWS.", "12-34": "Redshift là giải pháp kho dữ liệu mở rộng được. S3 là lưu trữ, DynamoDB là NoSQL, Kinesis xử lý dữ liệu luồng.", "12-35": "Mở rộng kiến trúc on-prem lên AWS: Direct Connect (kết nối mạng riêng) và Storage Gateway (lưu trữ hybrid). EBS là ổ đĩa, CloudFront là CDN, Connect là tổng đài.", "12-36": "Ưu điểm của AWS: không cần đoán dung lượng (B) và tăng tốc ra thị trường (C). AWS không có giá cố định hằng tháng, giảm (không tăng) CapEx, và không cho vào data center.", "12-37": "Người dùng không phải chờ cấp phát hạ tầng (vài phút thay vì vài tuần), nên làm việc hiệu quả hơn. B không chắc đúng. C và D sai, khách hàng vẫn lo cấu hình ứng dụng và tuân thủ.", "12-38": "Triển khai ứng dụng lên máy chủ on-prem: OpsWorks (Chef, Puppet, hỗ trợ máy on-prem, nay đã ngừng) và CodeDeploy. Elastic Beanstalk chỉ triển khai trên AWS. Batch chạy job. X-Ray truy vết.", "12-39": "Agility thể hiện ở việc giảm thời gian có được tài nguyên tính toán mới (vài phút). A và B là tính năng, C là tính năng thanh toán.", "12-40": "AWS Shield bảo vệ ứng dụng khỏi DDoS với khả năng phát hiện luôn bật và giảm thiểu tự động ngay trên đường truyền. Inspector quét lỗ hổng. WAF lọc request web. ELB chia tải.", "12-42": "CSDL tự quản lý, tắt mỗi đêm thì dùng EC2 với ổ EBS (dữ liệu vẫn còn khi stop). Instance store mất dữ liệu khi stop. Redshift và DynamoDB là dịch vụ được quản lý, không tự host.", "13-16": "Theo đề: cost allocation tags, Simple Monthly Calculator và TCO Calculator hỗ trợ ước tính chi phí. Lưu ý: Simple Monthly Calculator nay là Pricing Calculator, TCO Calculator nay là Migration Evaluator. «Cost Eliminator» không tồn tại. Báo cáo hoá đơn chi tiết là chi phí đã phát sinh.", "13-32": "RDS đơn giản hoá các tác vụ quản trị CSDL quan hệ (cài đặt, vá, sao lưu). B sai, con số này không đúng. C sai, RDS không tự đổi cỡ instance theo tải. D sai, bạn phải tự đổi loại instance.", "13-35": "Nâng cao nhận thức và đào tạo là kiểm soát chung: AWS đào tạo nhân viên AWS, khách hàng đào tạo nhân viên của mình. A và B là của khách hàng. C là của AWS.", "14-6": "Elastic Load Balancing phân phối lưu lượng ứng dụng đến cho một hoặc nhiều EC2. A là Route 53. C là CloudWatch. D là Auto Scaling.", "14-9": "Lưu video trên S3 và phân phối qua CloudFront cho độ trễ thấp nhất. Storage Gateway dùng cho hybrid, EFS là file system, Glacier không truy cập ngay.", "14-19": "Lưu ý: file gốc ghi đáp án B (mã hoá dữ liệu khi truyền), nhưng việc đó là trách nhiệm của KHÁCH HÀNG. Đáp án đúng là C: cập nhật firmware của máy chủ vật lý chạy EC2 là việc của AWS (giống Đề 9 câu 8). Cấp quyền và cập nhật OS cũng là việc của khách hàng.", "14-31": "Báo cáo tuân thủ và chứng nhận của AWS tải ở AWS Artifact. Concierge lo hoá đơn, Certificate Manager quản lý chứng chỉ SSL (không phải chứng nhận tuân thủ), Trusted Advisor đưa khuyến nghị.", "14-47": "Kiểm toán tài sản vật lý ở data center hoàn toàn do AWS quản lý. Vá OS, mã hoá dữ liệu và bắt buộc MFA là việc của khách hàng (vá OS với dịch vụ được quản lý thì AWS lo, nhưng với EC2 thì không).", "15-25": "Lợi ích tài chính: giảm TCO (A) và giảm chi phí vận hành (C). AWS giảm CapEx chứ không tăng. AWS không cho startup trả chậm hay vay tín dụng.", "15-26": "Kiểm soát vật lý và môi trường (data center, điện, làm mát) hoàn toàn là trách nhiệm của AWS. Vá OS khách (EC2) và chính sách mật khẩu IAM là của khách hàng. Đào tạo nhận thức là kiểm soát chung.", "15-36": "IAM group dùng để gán một bộ quyền cho nhiều user cùng lúc. MFA là xác thực, password policy là quy tắc mật khẩu, access key dùng cho CLI.", "15-37": "Lợi ích của AWS Cloud: tính co giãn (B) và sự nhanh nhẹn (C). Không có «uptime vô hạn». Colocation là thuê chỗ đặt máy ở data center. AWS giảm chứ không tăng chi phí đầu tư.", "15-38": "Theo đề, AWS Directory Service (Managed Microsoft AD) cho phép đăng nhập một lần (SSO) vào AWS Console bằng tài khoản AD công ty. Hiện nay cách được khuyến nghị là IAM Identity Center. Connect là tổng đài, Pinpoint gửi tin marketing, Rekognition phân tích ảnh.", "15-39": "Các vị trí cách ly trong một Region, nối với nhau bằng mạng độ trễ thấp, gọi là Availability Zone. Direct Connect là đường truyền, VPC là mạng ảo, edge location dùng cho CDN.", "15-40": "Lưu ý: file gốc ghi đáp án A, B, nhưng A sai: AWS KHÔNG tự đảm bảo workload của bạn tuân thủ (bạn phải tự cấu hình). Đáp án đúng là B và C: AWS duy trì tài liệu về các khung tuân thủ phổ biến (B), và đảm bảo với khách hàng rằng AWS duy trì an ninh vật lý và bảo vệ dữ liệu ở tầng hạ tầng (C).", "15-41": "AWS Artifact cung cấp báo cáo tuân thủ của AWS theo yêu cầu. IAM quản lý quyền, GuardDuty phát hiện mối đe doạ, KMS quản lý khoá.", "15-42": "Lưu ý: file gốc ghi đáp án D (quản lý người dùng và truy cập), nhưng đó là việc của KHÁCH HÀNG. Đáp án đúng là A: quản lý bảo mật data center (kiểm soát vật lý và môi trường) là thứ khách hàng thừa hưởng hoàn toàn từ AWS. Patch và Configuration management là kiểm soát chung.", "15-43": "So sánh TCO cần tính phần cứng lưu trữ (C) và máy chủ vật lý (D), cùng điện, mặt bằng, nhân sự. Phát triển phần mềm, quản lý dự án và bản quyền antivirus như nhau ở cả hai môi trường.", "15-44": "Khách hàng quản lý network ACL của VPC (B) và mã hoá dữ liệu khi truyền và khi lưu (C). Bảo trì phần cứng EC2, thay ổ cứng hỏng và triển khai phần cứng ở các AZ là việc của AWS.", "15-45": "Tính co giãn: tăng giảm số EC2 theo lưu lượng (A), và đổi cỡ RDS khi nhu cầu kinh doanh thay đổi (B). C là cân bằng tải. D là tuân thủ. E là Infrastructure as Code.", "15-46": "Spot có lợi khi ứng dụng linh hoạt về thời điểm chạy (có thể bị ngắt và chạy lại sau). Workload quan trọng, cần dung lượng chuyên dụng hay không được dừng thì không dùng Spot.", "15-47": "Phân tích TCO cần tính điện năng của data center (B) và chi phí nhân công thay máy chủ cũ (C). Tính sẵn sàng của EC2, thời gian của developer và dung lượng engine CSDL không phải chi phí hạ tầng để so sánh.", "15-48": "Lambda tính tiền theo số request và tài nguyên tính toán đã dùng (thời gian chạy nhân bộ nhớ). Không đấu giá, không có kỳ hạn trả trước 1, 3, 5 năm, không tính theo dung lượng lưu trữ.", "15-49": "Security group hoạt động như tường lửa ảo cho EC2, kiểm soát lưu lượng vào và ra. B là IAM. C là Shield. D là CloudFront.", "16-1": "TCO Calculator (nay là Migration Evaluator) phân tích chi phí và lợi ích khi chuyển lên AWS so với on-prem. Cost Explorer xem chi phí AWS đã dùng. Simple Monthly Calculator ước tính giá AWS. Trusted Advisor đưa khuyến nghị.", "16-2": "Tài khoản liên kết (linked account) cùng consolidated billing cho phép chia sẻ lợi ích giảm giá Reserved Instance giữa các tài khoản. Cost Explorer và các báo cáo chỉ dùng để xem.", "16-3": "AWS Organizations (consolidated billing) đơn giản hoá và gộp hoá đơn của nhiều tài khoản. Cost and Usage Report, Cost Explorer và Budgets dùng để phân tích, theo dõi chi phí.", "16-4": "CloudFront là CDN, cache dữ liệu ở edge location gần người dùng toàn cầu. Direct Connect là đường truyền riêng. Route 53 là DNS, không cache dữ liệu ứng dụng. S3 Transfer Acceleration chỉ tăng tốc upload lên S3.", "16-5": "Mô hình Cloud (all-in) cho phép đổi hoàn toàn chi phí đầu tư IT thành chi phí vận hành. On-prem vẫn cần CapEx. Hybrid còn một phần on-prem. PaaS là mô hình dịch vụ, không phải mô hình triển khai.", "16-6": "Trên AWS, có thể lấy metadata của tài sản (instance, ổ đĩa, IP, tag) một cách tin cậy chỉ bằng vài lệnh API. A, B, C không phải tính năng mặc định của AWS.", "16-7": "Cross-Region read replica tạo bản sao CSDL ở Region khác, giúp có CSDL dự phòng toàn cầu. Snapshot là bản sao lưu. Tự vá không liên quan. Provisioned IOPS là hiệu năng ổ đĩa.", "16-8": "Chỉ cấp quyền truy cập đúng tài nguyên cần cho công việc gọi là quyền tối thiểu (least privilege). Các tên khác không phải thuật ngữ chuẩn.", "16-9": "Tách chi phí theo phòng ban: tạo tài khoản riêng cho mỗi phòng ban (B), hoặc gắn tag theo phòng ban cho tài nguyên (D). MFA là bảo mật. RI là giảm giá. Purchase order là cách trả tiền.", "16-10": "Khách hàng chịu trách nhiệm cấu hình hệ điều hành, mạng và tường lửa. Bảo vệ phần cứng và cơ sở vật chất, cung cấp báo cáo tuân thủ và lấy chứng nhận ngành là việc của AWS.", "16-11": "Trusted Advisor đưa hướng dẫn theo thời gian thực về best practice bảo mật (và chi phí, hiệu năng…). X-Ray truy vết, CloudWatch giám sát, Systems Manager quản lý máy chủ.", "16-12": "EC2 Auto Scaling thêm tính co giãn cho EC2, tự tăng giảm theo nhu cầu. Resource Groups gom tài nguyên. Lifecycle policy dùng cho S3 hoặc EBS snapshot. ALB chia tải chứ không thêm bớt máy.", "16-13": "Khách hàng chịu trách nhiệm quản lý mã hoá (C) và quản lý tường lửa (E, security group, NACL). Ảo hoá, phần cứng và cơ sở vật chất là việc của AWS.", "16-14": "Storage Gateway cho ứng dụng on-prem dùng lưu trữ AWS liền mạch qua các giao thức lưu trữ file chuẩn (NFS, SMB). Direct Connect là đường truyền mạng. Snowball và Snowball Edge là thiết bị chuyển dữ liệu offline.", "16-15": "Cập nhật firmware của máy chủ vật lý chạy EC2 là trách nhiệm của AWS. Cập nhật NACL, security group và vá OS trên EC2 là việc của khách hàng.", "16-16": "RDS Multi-AZ thể hiện nguyên tắc «thiết kế cho lỗi» (design for failure): có bản standby để tự failover khi AZ chính lỗi.", "16-17": "Quyền tối thiểu là chỉ cấp đúng quyền cần để làm một công việc. A, B không đúng định nghĩa. C là cấp quyền quá mức.", "16-18": "Liên kết lỏng ngăn lỗi lan dây chuyền giữa các thành phần. A không phải lợi ích chính. B ngược lại, liên kết lỏng giảm phụ thuộc. D sai.", "16-19": "Direct Connect tạo kết nối hybrid riêng, không qua internet công cộng. NAT Gateway cho subnet private ra internet. S3 Transfer Acceleration tăng tốc upload. WAF là tường lửa web.", "16-20": "Thành phần phụ thuộc chặt khiến một phần lỗi làm sập cả ứng dụng, thì cần tách rời (decouple) các thành phần để mỗi phần vẫn chạy khi phần khác lỗi. Elasticity, chạy song song hay nhân đôi tài nguyên không giải quyết sự phụ thuộc.", "16-22": "AWS Organizations quản lý tập trung quyền truy cập nhiều tài khoản (qua SCP). Service Catalog là danh mục sản phẩm, Config theo dõi cấu hình, Trusted Advisor đưa khuyến nghị.", "16-23": "AWS Budgets gửi cảnh báo khi chi phí sắp chạm một số tiền nhất định. Cost and Usage Report và Cost Explorer dùng để phân tích, Trusted Advisor đưa khuyến nghị.", "16-25": "Gói Enterprise là gói thấp nhất có Technical Account Manager riêng được chỉ định. (Enterprise On-Ramp có nhóm TAM dùng chung.)", "16-26": "Khả năng phục hồi sau lỗi là nguyên tắc thiết kế của trụ cột Reliability. Một AZ là ngược tính tin cậy. C thuộc Cost Optimization. D thuộc Operational Excellence.", "16-28": "Không phải đoán trước nhu cầu dung lượng là ưu điểm của AWS. B và C không đúng. D sai, khách hàng vẫn phải tự kiểm toán phần của mình.", "16-30": "Thiết kế cho lỗi là nguyên tắc kiến trúc quan trọng. A sai, nên lưu backup ở Region khác. B sai, nên liên kết lỏng. C không phải nguyên tắc.", "16-32": "Chạy 24 giờ mỗi năm, không được gián đoạn thì On-Demand là tiết kiệm nhất. RI cần cam kết 1 năm. Spot có thể bị ngắt. Dedicated đắt.", "16-33": "Aurora tương thích MySQL và tự động tăng dung lượng lưu trữ khi cần (tới 128 TB). RDS for MySQL cũng có storage autoscaling nhưng Aurora là đáp án chuẩn. EC2 và Lightsail không phải dịch vụ CSDL.", "16-34": "VPC peering kết nối hai VPC với nhau. VPC endpoint truy cập dịch vụ AWS riêng tư. ClassicLink là tính năng cũ (đã ngừng). Direct Connect nối on-prem với AWS.", "16-36": "TCO Calculator (nay là Migration Evaluator) so sánh chi phí chạy workload on-prem với chạy trên AWS. Simple Monthly Calculator chỉ ước tính giá AWS. Billing console và Cost Explorer xem chi phí đã dùng.", "16-37": "Snowmobile chuyển dữ liệu quy mô exabyte (tới 100 PB mỗi xe). Snowball dùng cho TB đến PB. Batch chạy job. Migration Hub theo dõi di chuyển. Lưu ý: Snowmobile đã ngừng nhận đơn mới.", "16-39": "ELB có các loại: Application Load Balancer, Network Load Balancer, Gateway Load Balancer và Classic Load Balancer. Trong đáp án có Classic (C) và Application (E). A, B, D không phải loại của ELB.", "16-40": "AWS không cần hợp đồng dài hạn và trả theo mức dùng. A sai, không kiểm soát tài nguyên bên dưới. C sai, không có edge location ở mọi quốc gia. D sai, có service quota.", "16-41": "CloudFront cache dữ liệu truy cập thường xuyên ở edge location, cho thời gian phản hồi nhanh nhất tới người dùng ở nhiều Region. CloudTrail ghi log, CloudFormation tạo hạ tầng, VPN gateway qua Direct Connect là kết nối mạng.", "16-42": "AWS Artifact là cổng tự phục vụ để truy cập báo cáo tuân thủ của AWS theo yêu cầu. Config theo dõi cấu hình, Certificate Manager quản lý SSL, Inspector quét lỗ hổng.", "16-43": "EC2 dùng để chạy CSDL tự quản lý. Route 53 là DNS, X-Ray truy vết, Snowmobile chuyển dữ liệu.", "16-44": "Lợi ích độc quyền của gói Enterprise trong đáp án là được truy cập Technical Account Manager (TAM). Cloud Support Engineer có ở Business. «Technical Project Manager» không tồn tại.", "16-46": "AWS giảm chi phí tính toán hiệu quả nhất cho startup đang tăng trưởng nhờ tài nguyên theo nhu cầu cho lúc cao điểm, không phải mua dư máy. B, C không phải lợi ích chính. D sai, AWS không có ngân sách cố định.", "16-47": "Cần ra thị trường nhanh và yêu cầu có thể thay đổi thì sự nhanh nhẹn (agility) là đặc điểm phù hợp: thử nghiệm và thay đổi nhanh. Elasticity là co giãn theo tải.", "16-48": "Gói Business và Enterprise (cả Enterprise On-Ramp) có đầy đủ các kiểm tra Trusted Advisor. Basic và Developer chỉ có các kiểm tra cốt lõi.", "16-50": "Mô hình TCO cho workload trên AWS cần tính chi phí compute (A), lưu trữ (C) và truyền dữ liệu (D). Cơ sở vật chất, hạ tầng mạng và vòng đời phần cứng là chi phí AWS đã bao gồm (chỉ tính ở phía on-prem).", "17-1": "Rekognition tự động nhận diện đối tượng trong ảnh, tiết kiệm thời gian gắn nhãn thủ công. Nó không đóng dấu ảnh, không đổi kích thước ảnh, không dùng Mechanical Turk.", "17-2": "So sánh TCO cần tính chi phí bảo mật data center. Phân tích nghiệp vụ, quản lý dự án và quản trị hệ điều hành tồn tại ở cả hai môi trường (với EC2 bạn vẫn quản trị OS).", "17-3": "AWS chịu trách nhiệm quản lý hạ tầng mạng. Cấu hình VPC, quản lý code ứng dụng và lưu lượng ứng dụng là việc của khách hàng.", "17-4": "Ước tính chi phí dự án mới trên AWS thì dùng Simple Monthly Calculator (nay là AWS Pricing Calculator). TCO Calculator so sánh với on-prem. Cost Explorer API xem chi phí đã dùng. Budgets đặt ngân sách.", "17-5": "Trusted Advisor phát hiện security group mở truy cập internet không giới hạn tới một số cổng. Organizations quản lý tài khoản. Usage Report và EC2 dashboard không có kiểm tra này.", "17-6": "CloudWatch (billing alarm) tạo cảnh báo dựa trên chi phí ước tính hằng tháng. Config theo dõi cấu hình, X-Ray truy vết, CloudTrail ghi log API.", "17-7": "All Upfront Reserved Instance 3 năm cho mức giảm giá lớn nhất: thời hạn dài nhất và trả trước toàn bộ.", "17-8": "Tiêu huỷ vật lý thiết bị lưu trữ khi hết vòng đời là trách nhiệm của AWS (theo chuẩn NIST 800-88). Tạo IAM user, group, vá OS khách và cấu hình bảo mật EC2 là việc của khách hàng.", "17-9": "Không phải đoán nhu cầu dung lượng là ưu điểm của AWS. A sai, AWS không kiểm toán dữ liệu người dùng. B sai, dữ liệu không tự an toàn. D sai, khách hàng vẫn lo tuân thủ của mình.", "17-11": "Elastic Beanstalk (tự triển khai code và hạ tầng) và CloudFormation (triển khai bằng template) quản lý và tự động hoá việc triển khai. CodeCommit lưu code, Data Pipeline chuyển dữ liệu, Config theo dõi cấu hình.", "17-13": "Nguyên tắc độ tin cậy: thiết kế tự động phục hồi khi lỗi (A) và dùng nhiều AZ (B). C thuộc Operational Excellence. D sai, phải test với tải cao. E không phải nguyên tắc chính.", "17-14": "Nghi tài khoản bị xâm nhập: đổi (xoay vòng) mật khẩu và access key (A), và liên hệ AWS Support (E). Xoá MFA, chuyển Region hay xoá CloudTrail đều làm tình hình tệ hơn.", "17-15": "Tính sẵn sàng cao là ứng dụng vẫn truy cập được dù một tài nguyên bị lỗi. A là gói support. C là pay-as-you-go. D là global reach.", "17-17": "CloudWatch giám sát CPU của EC2. CloudTrail ghi log API, Cost and Usage Report là chi phí, SNS gửi thông báo.", "17-18": "IAM role là thực thể định nghĩa một bộ quyền để dùng với tài nguyên hoặc dịch vụ AWS (thông tin đăng nhập tạm thời). Role không phải user, group hay thông tin MFA.", "17-19": "Ưu điểm của RI: giảm giá so với On-Demand (A), và có thể đặt trước dung lượng ở một AZ (E, với zonal RI). RI không cho thêm loại instance, không thêm khả năng mạng, không tự nâng cấp khi có loại mới.", "17-20": "Auto Scaling Group tự thêm hoặc thay instance trên nhiều AZ khi cần. A sai, chỉ trong một Region. C là CloudFront. D là Load Balancer.", "17-22": "EC2 Amazon Linux On-Demand tính tiền theo giây (tối thiểu 60 giây), nên trả đúng 3 giờ 5 phút 6 giây.", "17-23": "Lambda và ECS cung cấp tài nguyên tính toán. CodeDeploy triển khai, Glacier lưu trữ, Organizations quản lý tài khoản.", "17-24": "CloudFormation triển khai hạ tầng dưới dạng code, tự động cấp phát tài nguyên. GameLift là host game server, Data Pipeline chuyển dữ liệu, Glue là ETL.", "17-26": "Direct Connect tạo kết nối mạng chuyên dụng từ mạng nội bộ tới AWS. CloudHSM lưu khoá, VPN đi qua internet, Connect là tổng đài.", "17-27": "CloudFront và AWS Shield dùng edge location (Shield bảo vệ ở edge). EC2, RDS và ElastiCache chạy trong Region.", "17-28": "Lưu ý: file gốc ghi đáp án A (VPC), nhưng VPC chỉ là mạng ảo trong AWS. Dịch vụ cung cấp KẾT NỐI mạng giữa on-prem và AWS trong kiến trúc hybrid là Direct Connect (B), nên mình sửa đáp án thành B. Directory Service là AD, API Gateway tạo API.", "17-29": "TCO Calculator so sánh chi phí chạy ứng dụng ở môi trường hosting truyền thống với chạy trên AWS. Cost Explorer, Budgets và Cost and Usage Report chỉ dùng cho chi phí AWS.", "17-30": "Phần mềm từ Marketplace trả tiền theo giờ hoặc tháng tùy bản quyền (A), và chạy chỉ với 1 cú click (B). Mã hoá vẫn do bạn quản lý. Vẫn phải nâng cấp phiên bản. Vẫn nên test trước khi dùng.", "17-33": "AWS Config kiểm toán và theo dõi thay đổi tài nguyên AWS. Trusted Advisor đưa khuyến nghị, GuardDuty phát hiện mối đe doạ, Inspector quét lỗ hổng.", "17-34": "Trusted Advisor phát hiện security group cho phép truy cập không giới hạn. CloudTrail ghi log, CloudWatch giám sát, Inspector quét lỗ hổng trên EC2.", "17-36": "CloudFront là CDN phân phối an toàn dữ liệu, video và ứng dụng tới người dùng toàn cầu với độ trễ thấp và tốc độ cao. CloudFormation tạo hạ tầng, Direct Connect là đường truyền, Pinpoint gửi tin marketing.", "17-37": "Tính co giãn (elasticity) giúp khớp nguồn cung tài nguyên với nhu cầu workload thay đổi. Security, Reliability và High availability là các đặc tính khác.", "17-38": "Thấy IP thuộc AWS tham gia tấn công DDoS thì liên hệ AWS Abuse team trước tiên. Premium Support, TAM và Solutions Architect không phải kênh xử lý lạm dụng.", "17-39": "Lợi ích: không cần cam kết trả trước (A) và tạo tài nguyên theo nhu cầu (C). B sai, bảo mật trong cloud là của khách hàng. D sai, không miễn phí. E sai, không kiểm soát hạ tầng vật lý.", "17-41": "Trusted Advisor là công cụ trực tuyến với các kiểm tra tự động, đưa khuyến nghị về tối ưu chi phí, hiệu năng, bảo mật (và chịu lỗi, giới hạn dịch vụ). Nó không phải nhân viên, mạng đối tác hay TAM.", "17-42": "Cost Explorer giúp trực quan hoá, hiểu và quản lý chi phí, mức dùng AWS theo thời gian. Budgets đặt ngân sách. Organizations quản lý tài khoản. Consolidated billing gộp hoá đơn.", "17-43": "AWS Artifact cung cấp báo cáo bảo mật và tuân thủ của AWS theo yêu cầu. CloudTrail ghi log, AWS Health báo sự kiện, CloudWatch giám sát.", "17-45": "Elastic Beanstalk lo các chi tiết triển khai: cấp phát dung lượng, cân bằng tải, Auto Scaling và giám sát sức khoẻ ứng dụng. Config theo dõi cấu hình, Route 53 là DNS, CloudFront là CDN.", "17-46": "Network ACL (inbound và outbound) là tính năng của Amazon VPC. IAM quản lý quyền, Connect là tổng đài, API Gateway tạo API.", "17-47": "Đặt web server ở nhiều Region làm tăng tính sẵn sàng. Coupling không liên quan. Bảo mật và độ bền dữ liệu không tăng chỉ vì có nhiều Region.", "17-48": "Pay-as-you-go giảm chi phí đầu tư (CapEx) vì không phải mua máy trước. B sai, không cần trả trước. C sai, áp dụng cho hầu hết dịch vụ. D, chi phí vận hành không nhất thiết giảm.", "17-49": "AWS chịu trách nhiệm an ninh vật lý của hạ tầng toàn cầu. Quản lý vòng đời thông tin đăng nhập IAM, mã hoá EBS và cấu hình tường lửa là việc của khách hàng.", "17-50": "AWS Organizations cho phép gộp hoá đơn của nhiều tài khoản. QuickSight là BI, Budgets đặt ngân sách, Forecast dự báo bằng ML.", "18-1": "«Bảo mật TRONG cloud» là việc của khách hàng, ví dụ cấu hình tường lửa (security group, NACL). Quản lý edge location, an ninh vật lý và hạ tầng toàn cầu là «bảo mật CỦA cloud» do AWS lo.", "18-4": "Với đặt trước Dedicated Host, trả trước toàn bộ (All upfront) được giảm giá nhiều nhất, giống Reserved Instance.", "18-5": "Nhiều AZ giúp sẵn sàng cao hơn vì chịu được sự cố ở một AZ. A cần nhiều Region. C sai, các AZ gần nhau. D sai, không giảm độ trễ.", "18-6": "Ước tính chi phí ứng dụng mới thì dùng Simple Monthly Calculator (nay là Pricing Calculator). A chỉ nói mô hình giá. QuickSight là BI. AppStream stream ứng dụng.", "18-8": "AWS WAF chặn request độc hại từ một nhóm IP lặp lại (IP set rule, rate-based rule). IAM quản lý quyền, GuardDuty chỉ phát hiện, SNS gửi thông báo.", "18-9": "Infrastructure as Code cho phép tự động hoá việc cấp phát hạ tầng. Nó không di chuyển phần cứng on-prem, không phải kiểm toán, không giao code ứng dụng cho AWS.", "18-10": "Direct Connect tạo kết nối mạng chuyên dụng giữa on-prem và AWS. VPN đi qua internet. API Gateway tạo API. Connect là tổng đài.", "18-12": "CloudFormation giúp mô hình hoá và cấp phát tài nguyên. Cập nhật code là CodeDeploy, data lake là Lake Formation, báo cáo hoá đơn là Cost and Usage Report.", "18-13": "Amazon Redshift là dịch vụ CSDL (kho dữ liệu). EBS là ổ đĩa, Glacier là lưu trữ dài hạn, Snowball chuyển dữ liệu.", "18-14": "Cách ĐƠN GIẢN NHẤT là chạy Trusted Advisor và xem kết quả kiểm tra security group. A làm tay. C sai, IAM không quản lý security group. D phức tạp.", "18-15": "AWS giúp thiết kế sẵn sàng cao dễ dàng (C) và đáp ứng dễ dàng khi nhu cầu thay đổi (D). AWS không tự phân phối dữ liệu toàn cầu, không vận hành hay vá ứng dụng cho bạn.", "18-16": "Amazon Inspector tạo báo cáo đánh giá bảo mật tự động, phát hiện truy cập mạng ngoài ý muốn tới EC2 và lỗ hổng trên EC2. Security group là tường lửa, Config theo dõi cấu hình, Macie tìm dữ liệu nhạy cảm.", "18-17": "Tách chi phí production và non-production bằng cách dùng tài khoản AWS riêng cho mỗi môi trường. IAM role không tách chi phí. C không hợp lý. CloudWatch chỉ giám sát.", "18-18": "AWS Marketplace có danh mục các nhà cung cấp giải pháp bảo mật bên thứ ba được AWS công nhận. Service Catalog là danh mục nội bộ công ty. Quick Start là mẫu triển khai. CodeDeploy triển khai ứng dụng.", "18-19": "Lưu dữ liệu 7 năm để tuân thủ, chi phí thấp nhất thì dùng S3 Glacier (đặc biệt Deep Archive). S3 Standard đắt hơn. Snowball chuyển dữ liệu. Redshift là kho phân tích.", "18-20": "Lợi ích ngay lập tức: chi phí đầu tư được thay bằng chi phí biến đổi (B), và tăng sự nhanh nhẹn (D). Không tăng nhân sự IT, không kiểm soát hạ tầng, bảo mật trong cloud là của khách hàng.", "18-22": "Storage Gateway kết nối lưu trữ on-premises với AWS Cloud. A sai, độ bền 11 số 9 là của S3. B là Snowball. C không phải mục đích.", "18-23": "Cài ứng dụng ở các vị trí cách ly về địa lý thì triển khai trên nhiều Region. Internet gateway và NAT gateway là thành phần mạng. Một VPC chỉ thuộc một Region.", "18-24": "Hệ thống chịu được lỗi của một hay nhiều thành phần là ví dụ của tính sẵn sàng cao (theo đề; còn gọi là chịu lỗi). Elasticity là co giãn, scalability là mở rộng, agility là nhanh nhẹn.", "18-25": "Direct Connect cho kết nối ổn định, chuyên dụng giữa AWS và hệ thống on-prem. VPN đi qua internet nên không ổn định bằng. Connect là tổng đài. Data Pipeline chuyển dữ liệu.", "18-26": "Bảo mật và tuân thủ là trách nhiệm chung giữa AWS và khách hàng. Đó chính là ý nghĩa của mô hình trách nhiệm chung.", "18-27": "Để dùng CLI cần tạo access key và secret key. Password policy dùng cho mật khẩu. Managed policy là quyền. API key không phải thông tin IAM.", "18-28": "AWS KMS cung cấp khoá để mã hoá Amazon EBS. Certificate Manager quản lý SSL, Systems Manager quản lý máy chủ, Config theo dõi cấu hình.", "18-29": "Lambda tính tiền theo thời gian chạy hàm (A) và số request (C). Số phiên bản, ngôn ngữ lập trình và số hàm không ảnh hưởng chi phí.", "18-30": "Số edge location nhiều hơn số Region (B), và số AZ nhiều hơn số Region (E, mỗi Region có ít nhất 3 AZ). Edge location không phải AZ.", "18-31": "AWS Shield Standard cung cấp bảo vệ DDoS miễn phí cho mọi khách hàng. WAF rule là của WAF, quyền là của IAM, mã hoá là của KMS.", "18-32": "Xây ứng dụng trên cloud giúp giảm chi phí phần cứng cần để chạy ứng dụng mới. Viết code, pen test và viết test case vẫn tốn chi phí như cũ.", "18-33": "AWS Marketplace cho phép bán giải pháp cho người dùng AWS khác (B) và mua phần mềm bên thứ ba chạy trên AWS (C). Không bán Spot dư (chỉ bán RI ở RI Marketplace), không mua tài liệu tuân thủ (miễn phí ở Artifact), không đặt Snowball.", "18-34": "Hybrid cloud nghĩa là một số tài nguyên chạy on-premises, một số chạy trên AWS Cloud. A là on-prem, C là all-in cloud, B không liên quan cloud.", "18-39": "So sánh TCO cần tính chi phí mua và lắp đặt phần cứng máy chủ on-prem (B), và chi phí quản trị hạ tầng như cài OS, vá, sao lưu, phục hồi lỗi (C). Phí thẻ tín dụng, pen test và quảng cáo không liên quan.", "18-41": "Bảo mật ứng dụng là trách nhiệm của khách hàng. Hạ tầng ảo hoá, hạ tầng mạng và an ninh vật lý phần cứng là của AWS.", "18-42": "Dùng edge location (CloudFront) để đưa nội dung gần mọi người dùng, giảm độ trễ toàn cầu. A, một Region «ở giữa» vẫn xa nhiều người. B, thêm AZ không giảm độ trễ. C, cache trong Region vẫn xa người dùng ở nơi khác.", "18-44": "AWS Organizations cung cấp cách nhanh và tự động để tạo, quản lý tài khoản AWS (gọi API CreateAccount). QuickSight là BI, Lightsail là máy chủ, Connect là tổng đài.", "18-45": "RDS đạt tính sẵn sàng cao bằng Multi-AZ. Reserved Instance là giảm giá, Provisioned IOPS là hiệu năng, Enhanced monitoring là giám sát.", "18-46": "Báo cáo tài nguyên AWS bị dùng vào mục đích xấu cho AWS Abuse team. Shield chống DDoS, Support là hỗ trợ kỹ thuật, Developer Forums là diễn đàn.", "18-47": "Bật CloudTrail để theo dõi mọi thay đổi tài khoản người dùng trên Management Console. SNS gửi thông báo, VPC Flow Logs ghi lưu lượng, CloudHSM lưu khoá.", "18-48": "Tính sẵn sàng cao là best practice thiết kế. Liên kết chặt, điểm lỗi duy nhất và cấp phát dư tài nguyên đều ngược best practice.", "18-49": "AWS tiết kiệm hơn với workload thay đổi vì có thể tạo EC2 theo nhu cầu khi cần (và tắt khi không cần). A sai, EC2 tính theo giây. B không liên quan chi phí. D là cách làm truyền thống, gây lãng phí.", "18-50": "AWS DMS đơn giản hoá việc di chuyển CSDL lên AWS. Storage Gateway dùng cho hybrid. EC2 là máy chủ. AppStream stream ứng dụng.", "19-1": "AWS Marketplace giúp tìm, mua và dùng ngay giải pháp phần mềm trong môi trường AWS. Config theo dõi cấu hình, OpsWorks quản lý cấu hình bằng Chef/Puppet, SDK là thư viện lập trình.", "19-2": "Amazon VPC tạo mạng ảo trong AWS. Config theo dõi cấu hình, Route 53 là DNS, Direct Connect là đường truyền tới on-prem.", "19-3": "Bảo trì phần cứng vật lý là trách nhiệm của AWS. Cấu hình ứng dụng bên thứ ba, bảo vệ truy cập ứng dụng và dữ liệu, và quản lý AMI tùy chỉnh là việc của khách hàng.", "19-4": "CloudFront dùng edge location để phân phối nội dung với độ trễ thấp. Region và AZ là nơi chạy tài nguyên chính. VPC là mạng ảo.", "19-5": "Bật MFA để thêm một lớp bảo mật đăng nhập Console. Cloud Directory tổ chức dữ liệu phân cấp. Kiểm tra IAM role và bật CloudTrail không thêm lớp đăng nhập.", "19-6": "CloudTrail xác định được người dùng đã gọi API terminate EC2. CloudWatch giám sát hiệu năng, X-Ray truy vết request, IAM quản lý quyền.", "19-7": "SNS gửi thông báo khi CloudWatch alarm kích hoạt (email, SMS…). CloudTrail ghi log, Trusted Advisor đưa khuyến nghị, Route 53 là DNS.", "19-8": "AWS Acceptable Use Policy nêu các hành vi bị cấm trên hạ tầng AWS. Trusted Advisor đưa khuyến nghị, IAM quản lý quyền, Billing Console xem hoá đơn.", "19-9": "Lên AWS giảm chi phí trả trước bằng cách thay khoản đầu tư lớn bằng chi phí biến đổi thấp hơn. A đảo ngược. C và D là cách làm cố định, không tận dụng co giãn.", "19-10": "Tăng tính sẵn sàng cho ứng dụng 3 tầng: dùng Auto Scaling cho EC2 (A) và phân bố tài nguyên trên nhiều AZ (C). NACL không kiểm tra sức khoẻ dịch vụ. SMS là công cụ di chuyển. Points of presence (edge) không chạy ứng dụng 3 tầng.", "19-11": "Phân tán tải tính toán qua nhiều tài nguyên là best practice (tận dụng co giãn, tránh điểm lỗi duy nhất). Phụ thuộc cố định, gom dịch vụ vào một máy và một AZ đều ngược best practice.", "19-12": "Best practice quản lý IAM user: bắt đổi mật khẩu sau một thời gian (A) và không cho dùng lại mật khẩu cũ (B). Dùng chung mật khẩu với web khác, lưu mật khẩu dạng văn bản thô và tắt MFA đều sai.", "19-13": "Cần hỗ trợ thực hành khi di chuyển: dùng AWS Professional Services để hướng dẫn và thiết lập Landing Zone (C), hoặc chọn đối tác APN (D). Marketplace không làm migration. Support case không phải để thực hiện dự án. Amazon Connect là tổng đài.", "19-14": "Đội Concierge của gói Enterprise trả lời các câu hỏi về hoá đơn và tài khoản. Họ không hỗ trợ phát triển, kiến trúc hay case kỹ thuật.", "19-15": "Ứng dụng trải trên nhiều AZ được mô tả là có tính sẵn sàng cao. Global reach cần nhiều Region. Economies of scale là lợi thế quy mô. Elasticity là co giãn.", "19-16": "Phải ở một vùng địa lý (một Region) nhưng cần sẵn sàng cao, thì đặt EC2 ở ít nhất 2 Availability Zone. Nhiều Region vi phạm yêu cầu. Subnet và placement group có thể vẫn cùng một AZ.", "19-17": "Theo đề, đáp án là Pricing Calculator. Thật ra công cụ chuyên để so sánh on-prem với AWS là TCO Calculator, nay là Migration Evaluator, nhưng không có trong lựa chọn. Simple Monthly Calculator đã được thay bằng Pricing Calculator. Trusted Advisor và Cost Explorer không so sánh với on-prem.", "19-18": "Lưu ý: file gốc ghi A, nhưng đáp án đúng theo tài liệu AWS là C. RI mua ở tài khoản nào thì ưu tiên áp dụng cho tài khoản đó. Muốn RI chỉ dùng cho một tài khoản thì mua RI ở chính tài khoản liên kết đó và tắt chia sẻ RI cho tài khoản đó từ cấp payer. Mua ở tài khoản payer rồi tắt chia sẻ thì RI chỉ dùng được cho tài khoản payer.", "19-19": "Báo cho AWS Abuse team khi có hành vi tấn công xâm nhập xuất phát từ IP thuộc AWS. Sự cố AZ thì xem Health Dashboard. Lỗi truy cập S3 hay đổi phương thức thanh toán thì liên hệ Support.", "19-20": "Website ở một Region phục vụ người dùng toàn cầu với độ trễ thấp và tốc độ cao: Global Accelerator (đưa lưu lượng vào mạng AWS sớm) và CloudFront (cache ở edge). ALB chia tải trong Region. Direct Connect nối on-prem. Lambda chạy code.", "19-21": "AWS Lambda là serverless. EC2, Lightsail và ElastiCache (bản truyền thống) đều chạy trên instance.", "19-22": "Thành phần của VPC: subnet (B) và internet gateway (D), cùng route table, NACL… Object và bucket thuộc S3. Access key thuộc IAM.", "19-23": "Lưu ý: file gốc ghi đáp án C, nhưng AWS Budgets không trực tiếp đặt giới hạn tài nguyên. Chức năng chuẩn của Budgets là gửi cảnh báo, ví dụ khi tỉ lệ dùng Reserved Instance xuống dưới một mức phần trăm (B). Vì vậy mình sửa đáp án thành B. A là IAM hoặc SCP. D không phải tính năng của Budgets.", "19-25": "Trusted Advisor kiểm tra quyền của bucket S3 (A) và việc root user đã bật MFA chưa (C). Sự cố dịch vụ xem ở Health Dashboard. Bản vá phần mềm là Systems Manager hoặc Inspector. Số người dùng không phải mục kiểm tra.", "19-26": "AWS KMS dùng để tạo và quản lý khoá mã hoá và giải mã dữ liệu. Access key là của IAM. KMS không quản lý khoá MFA.", "19-28": "Ưu điểm: AWS lo bảo trì hạ tầng cloud (A) và lên kế hoạch dung lượng cho máy chủ vật lý (C). Bảo mật ứng dụng, phát triển ứng dụng và lập kế hoạch chi phí cho máy chủ ảo là việc của khách hàng.", "19-29": "RDS Multi-AZ thuộc trụ cột Reliability (độ tin cậy): tự phục hồi khi một AZ lỗi.", "19-30": "Kết nối AWS với on-prem: AWS VPN và AWS Direct Connect. Amazon Connect là tổng đài, Cognito lo đăng nhập, Managed Services là dịch vụ vận hành.", "19-33": "VPC Flow Logs ghi lại thông tin lưu lượng IP tới và từ các network interface trong VPC. Security group và NACL lọc lưu lượng chứ không ghi log. ENI là card mạng ảo.", "19-36": "Không có ngân sách thuê DBA lo cấp phát, vá, sao lưu thì dùng RDS (được quản lý, hỗ trợ MySQL). DynamoDB và DocumentDB là NoSQL. ElastiCache là bộ nhớ đệm.", "19-39": "Tạo khoá mã hoá dữ liệu: AWS KMS (C) và AWS CloudHSM (E). Macie tìm dữ liệu nhạy cảm, Certificate Manager quản lý chứng chỉ SSL, Secrets Manager lưu mật khẩu.", "19-42": "AWS CloudHSM giúp đáp ứng yêu cầu bảo mật dữ liệu theo hợp đồng và quy định bằng thiết bị phần cứng chuyên dụng (HSM) trong AWS Cloud. KMS dùng HSM chung do AWS quản lý. Secrets Manager lưu mật khẩu. Directory Service là AD.", "19-43": "Khách hàng quản lý cấu hình security group và ACL (B), và vá hệ điều hành của EC2 (E). Huỷ thiết bị, vá OS của RDS và kiểm soát truy cập vật lý là của AWS.", "19-44": "AWS Lambda phù hợp workload hướng sự kiện (chạy khi có sự kiện). EC2 và Elastic Beanstalk chạy liên tục. Lumberyard là game engine.", "19-46": "Cross-Region Replication của S3 có thể dùng cho bucket cùng một tài khoản hoặc khác tài khoản. A sai, phải BẬT versioning. B sai, hai bucket ở khác Region. D sai.", "19-47": "Khi chạy ứng dụng trên AWS, người dùng chịu trách nhiệm cập nhật phần mềm ứng dụng. Phần cứng, hypervisor và danh sách người được vào data center là việc của AWS.", "19-48": "Cần nhanh chóng đưa tính năng mới theo từng vòng lặp, rút ngắn thời gian ra thị trường, thì đó là sự nhanh nhẹn (agility).", "19-49": "Theo dõi chi phí của tài khoản: Cost and Usage Report (A) và billing alert cùng CloudWatch alarm (D). Trang sản phẩm, Simple Monthly Calculator và Price List API cho biết giá, không theo dõi chi phí thực tế.", "19-50": "Route 53 cho phép đăng ký tên miền DNS. Mã hoá khi truyền là TLS. Chứng chỉ SSL là ACM. Kết nối chuyên dụng là Direct Connect.", "20-1": "Amazon GuardDuty phát hiện hoạt động độc hại hoặc trái phép trong tài khoản và workload. Rekognition phân tích ảnh, Trusted Advisor đưa khuyến nghị, CloudWatch giám sát hiệu năng.", "20-2": "AWS Marketplace cho phép dùng thử (free trial) giải pháp bên thứ ba trước khi quyết định dùng lâu dài. APN là mạng đối tác, Managed Services là dịch vụ vận hành, Service Catalog là danh mục nội bộ.", "20-3": "DynamoDB là CSDL NoSQL được quản lý. Redshift là kho dữ liệu. Aurora và RDS for MariaDB là CSDL quan hệ.", "20-4": "Billing alarm được tạo trong Amazon CloudWatch. Trusted Advisor đưa khuyến nghị, CloudTrail ghi log, QuickSight là BI.", "20-5": "Docker trên EC2: AWS chỉ lo bảo trì phần cứng ở cơ sở của AWS. Mở rộng ứng dụng, lập lịch container và quản lý OS khách là việc của khách hàng (vì đang tự chạy trên EC2, không dùng ECS hay Fargate).", "20-6": "CloudFront giảm độ trễ cho người dùng toàn cầu nhờ cache ở edge. Direct Connect nối on-prem. Auto Scaling thêm máy, không giảm khoảng cách. Transit Gateway nối VPC.", "20-7": "Best practice IAM: đặt chính sách mật khẩu mạnh (A) và xoay vòng access key thường xuyên (D). Không chia sẻ thông tin đăng nhập, access key không dùng để đăng nhập Console, và nên dùng IAM role để ủy quyền.", "20-8": "VPC Flow Logs ghi lại thông tin lưu lượng vào và ra trong VPC. Config theo dõi cấu hình, Trusted Advisor đưa khuyến nghị, CloudTrail ghi log API.", "20-9": "Global Accelerator liên tục giám sát sức khoẻ endpoint và chuyển lưu lượng sang endpoint khoẻ mạnh ở Region khác trong chưa tới 30 giây. Inspector quét lỗ hổng, CloudWatch giám sát nhưng không định tuyến, CloudFront là CDN.", "20-10": "Quản lý thay đổi để đạt độ tin cậy: dùng AWS Config lập danh sách tài nguyên (A) và CloudTrail ghi lệnh API vào log có thể kiểm toán (C). Service limit không dùng để ngăn thay đổi. Certificate Manager quản lý SSL. GuardDuty phát hiện mối đe doạ.", "20-11": "CloudWatch (kết hợp EventBridge và sự kiện CloudTrail) dùng để giám sát và cảnh báo khi root user đăng nhập Console. Config theo dõi cấu hình, Trusted Advisor đưa khuyến nghị, IAM quản lý quyền.", "20-12": "Thiết kế các thành phần liên kết lỏng là nguyên tắc nên áp dụng. A sai, nên coi máy chủ là thứ dùng xong bỏ. B sai, nên tích hợp bất đồng bộ. D nghe đúng về bảo mật nhưng không phải nguyên tắc kiến trúc trong đáp án chuẩn.", "20-13": "Chuyển dữ liệu từ on-prem lên AWS: Snowball (thiết bị vật lý) và DMS (di chuyển CSDL). Lambda chạy code, ElastiCache là bộ nhớ đệm, API Gateway tạo API.", "20-14": "Nhu cầu tăng gấp đôi mỗi tháng thì phân tán ứng dụng ra nhiều EC2 và chạy song song (scale ngang), không giới hạn. Máy to hơn, đổi dòng máy hay bare metal đều sẽ chạm giới hạn.", "20-15": "Tạo một tài khoản AWS mới, cấu hình AWS Organizations và mời các tài khoản hiện có tham gia, để tập trung quản trị và gộp thanh toán. C sai, mỗi tài khoản chỉ thuộc một organization. A, D không gộp thanh toán thật.", "20-16": "Mở rộng ngang EC2 theo nhu cầu là ví dụ của tính co giãn (elasticity).", "20-17": "EC2 Auto Scaling điều chỉnh linh hoạt tài nguyên theo nhu cầu (có thể dùng scheduled hoặc predictive scaling cho ngày lễ mua sắm). CloudTrail ghi log, Forecast chỉ dự báo, Config theo dõi cấu hình.", "20-18": "AWS VPN cho phép kết nối an toàn (mã hoá) tới tài nguyên AWS qua internet công cộng. VPC peering nối VPC. Direct Connect không đi qua internet. Pinpoint gửi tin marketing.", "20-19": "Cost Explorer dự báo chi tiêu AWS. Trusted Advisor đưa khuyến nghị, Organizations quản lý tài khoản, Inspector quét lỗ hổng.", "20-20": "CloudFront cache nội dung tĩnh truy cập thường xuyên ở gần người dùng toàn cầu. ElastiCache là cache trong Region cho CSDL. EFS và EBS là lưu trữ.", "20-22": "CloudWatch cho biết ứng dụng trên EC2 có đủ CPU không (qua số liệu CPUUtilization). Config theo dõi cấu hình, CloudTrail ghi log API, Inspector quét lỗ hổng.", "20-24": "Khách hàng chịu trách nhiệm quản lý cấu hình ứng dụng của mình (C) và cấu hình security group (E). Quản lý truy cập cơ sở vật chất, vòng đời phần cứng và bảo vệ hạ tầng mạng là của AWS.", "20-25": "Giảm phụ thuộc lẫn nhau để thay đổi hay lỗi ở một thành phần không lan sang thành phần khác là nguyên tắc liên kết lỏng (loose coupling).", "20-27": "Nhiều EC2 truy cập đồng thời một file system dùng chung thì dùng Amazon EFS. EBS thường gắn một EC2. S3 là object storage. Artifact là báo cáo tuân thủ.", "20-28": "AWS chịu trách nhiệm chống giả mạo IP (IP spoofing) và nghe lén gói tin (packet sniffing) ở tầng mạng (B), và vá bảo mật cho RDS instance (C). Quét virus trên EC2, mã hoá giao tiếp giữa EC2 và ELB, cấu hình security group và NACL là việc của khách hàng.", "20-29": "Lợi ích của tính co giãn là tự động điều chỉnh năng lực tính toán cần thiết để duy trì hiệu năng ổn định. A là Global Accelerator hoặc Route 53. B là Lifecycle policy. C sai.", "20-30": "Giá AWS liên tục giảm là nhờ lợi thế quy mô (economies of scale).", "20-31": "Bật S3 Block Public Access trong Management Console để không object nào được công khai. Họp nhóm hay duyệt tay không đảm bảo. Tự viết dịch vụ giám sát là phức tạp và có độ trễ.", "20-32": "Phát hiện vấn đề hoá đơn thì mở case chi tiết về billing gửi AWS Support. Hỗ trợ billing miễn phí với mọi gói, kể cả Basic.", "20-33": "Simple Monthly Calculator (nay là Pricing Calculator) ước tính hoá đơn hằng tháng dựa trên mức dùng dự kiến. A gần với TCO Calculator. C và D không phải chức năng của nó.", "20-34": "Vá hệ điều hành khách của RDS là việc của AWS (đội sản phẩm AWS). Khách hàng không truy cập được OS của RDS. Đối tác và AWS Support không làm việc này.", "20-35": "AWS Auto Scaling mở rộng được EC2 (cùng Spot Fleet) và DynamoDB (bảng, index), cùng ECS và Aurora replica. S3 tự mở rộng. Route 53 không cần scale. Redshift có cơ chế riêng.", "20-36": "Global Accelerator cải thiện tính sẵn sàng của ứng dụng (B, tự chuyển sang endpoint khoẻ) và giảm độ trễ khi truy cập ứng dụng (D, dùng mạng AWS). Nó không giảm chi phí, không tăng độ bền hay bảo mật dữ liệu.", "20-37": "Cần giúp về hoá đơn và kích hoạt lại tài khoản bị tạm ngưng thì gửi yêu cầu Account and Billing cho AWS Support (miễn phí với mọi gói). Abuse xử lý lạm dụng. Forum và Solutions Architect không xử lý tài khoản.", "20-38": "Mở rộng linh hoạt và theo dự đoán để đáp ứng nhu cầu sử dụng là best practice dùng tính co giãn và nhanh nhẹn của cloud. A là cách truyền thống. C không liên quan. D là liên kết lỏng, không phải co giãn.", "20-39": "Chỉ trả cho những gì đã dùng giúp tối ưu chi phí khi chuyển lên cloud. Mua phần cứng trước, cấp phát thủ công hay mua cho tải tối đa đều gây lãng phí.", "20-40": "Cài bản vá bảo mật OS cho CSDL chạy trên EC2 là việc của khách hàng. Hypervisor là của AWS. DynamoDB và RDS là dịch vụ được quản lý, AWS vá OS.", "20-41": "Công cụ quản lý chi phí cho phép chia nhỏ chi phí theo ngày, dịch vụ, tài khoản liên kết (B, Cost Explorer), và tạo ngân sách nhận cảnh báo khi mức dùng thực tế hoặc dự báo vượt ngân sách (C, Budgets). Chúng không tự xoá tài nguyên, không tự đổi sang RI hay Spot, không tự chuyển lớp S3 (đó là Lifecycle).", "20-42": "Bảo mật và vá hệ điều hành khách là trách nhiệm của khách hàng. Systems Manager và Config là công cụ, không phải bên chịu trách nhiệm.", "20-43": "IAM giúp tạo và quản lý user, group, cấp quyền truy cập an toàn vào tài nguyên AWS, và miễn phí. Direct Connect là đường truyền, Connect là tổng đài, Firewall Manager quản lý tường lửa.", "20-44": "AWS Artifact cung cấp tài liệu bảo mật và tuân thủ của AWS theo yêu cầu. Directory Service là AD, Trusted Advisor đưa khuyến nghị, Inspector quét lỗ hổng.", "20-45": "Amazon Polly chuyển văn bản thành giọng nói tự nhiên. Transcribe làm ngược lại (giọng nói thành văn bản). Rekognition phân tích ảnh. Lex xây chatbot.", "20-46": "Nguyên tắc cốt lõi khi thiết kế ứng dụng sẵn sàng cao: giả định mọi thành phần đều có thể hỏng (design for failure). Serverless, Auto Scaling cho mọi ứng dụng hay mã nguồn mở không phải nguyên tắc cốt lõi.", "20-47": "Báo cáo Trusted Advisor có cả ba mục: quyền bucket S3, MFA của root user, security group mở không giới hạn. QuickSight là BI, CloudTrail ghi log, IAM credential report chỉ về thông tin đăng nhập người dùng.", "20-48": "Bản quyền phần mềm tính theo core thì dùng Dedicated Host (thấy được số socket và core vật lý).", "20-49": "Edge location dùng để cache bản sao nội dung, phân phối nhanh hơn tới người dùng toàn cầu (CloudFront).", "20-50": "Dùng AWS Config để ghi lại, kiểm toán và đánh giá thay đổi nhằm bật khả năng truy vết (traceability) thuộc trụ cột Security (nguyên tắc «Enable traceability»).", "21-1": "Cần CSDL phi quan hệ (NoSQL), không quản lý phần cứng và phần mềm CSDL thì dùng DynamoDB (serverless). RDS, Aurora và Redshift là CSDL quan hệ.", "21-2": "Sao chép dữ liệu giữa nhiều vùng địa lý thì dùng nhiều AWS Region. AZ nằm trong cùng một vùng. Account không phải vị trí. Edge location dùng cho CDN.", "21-3": "AWS Organizations cung cấp consolidated billing (D) và thực thi quản trị tài khoản AWS qua SCP (E). Liên lạc nhóm, NoSQL và kiểm tra bảo mật tự động không phải tính năng của Organizations.", "21-4": "AWS OpsWorks tự động hoá quản lý cấu hình bằng Chef và Puppet (dịch vụ đã ngừng từ 2024). Config theo dõi cấu hình, CloudFormation tạo hạ tầng, Systems Manager quản lý máy chủ.", "21-5": "Consolidated billing dùng để gộp hoá đơn của các tài khoản vốn độc lập. Các báo cáo chỉ dùng để phân tích chi phí.", "21-6": "TCO Calculator dùng để ước tính khoản tiết kiệm khi so sánh AWS với môi trường on-prem. A là Cost Explorer hoặc CUR. C là Pricing Calculator. D là Budgets hoặc CloudWatch.", "21-7": "Kết nối mạng on-prem với VPC: Direct Connect và AWS VPN. Route 53 là DNS, Data Pipeline chuyển dữ liệu, Connect là tổng đài.", "21-8": "Khách hàng thiết lập mã hoá phía server cho bucket S3 (A) và cấu hình mạng, tường lửa (C). Vá RDS, an ninh vật lý và đảm bảo dung lượng tính toán có sẵn là việc của AWS.", "21-9": "Gói Business là mức thấp nhất có AWS Support API. Developer và Basic không có.", "21-10": "CSDL tự cài trên EC2 thì dùng Systems Manager (Patch Manager) để tự động vá theo lịch, hiệu quả nhất. A làm tay. B sai, tự vá của RDS không áp dụng cho EC2. C, Config chỉ kiểm tra, không vá.", "21-11": "Lưu ý: file gốc ghi đáp án C, nhưng câu hỏi yêu cầu ứng dụng TOÀN CẦU với mức dự phòng và chịu lỗi CAO NHẤT. Vì vậy đáp án đúng là D: nhiều AZ ở hai Region (giống Đề 7 câu 28). Mình đã sửa thành D. Nhiều AZ trong một Region (C) tốt nhưng chưa phải cao nhất.", "21-12": "Người dùng ở Brazil bị chậm vì hạ tầng ở Sydney, nên tạo tài nguyên ở Region São Paulo gần họ. Direct Connect dành cho data center của công ty. Transit Gateway nối VPC. Thêm EC2 ở Sydney không giảm khoảng cách.", "21-13": "Chỉ chạy khi cần nhưng phải hoạt động suốt quá trình (không bị ngắt) thì On-Demand là phù hợp. Spot có thể bị ngắt. Reserved cần chạy liên tục mới có lợi.", "21-14": "Personal Health Dashboard (nay là AWS Health Dashboard) hiện thông tin kịp thời về sự kiện đang diễn ra và thông báo chủ động cho hoạt động bảo trì theo lịch ảnh hưởng tài nguyên của bạn. Service Health Dashboard chỉ hiện tình trạng chung.", "21-15": "Storage Gateway là dịch vụ lưu trữ hybrid cho ứng dụng on-prem dùng lưu trữ AWS liền mạch. Backup là sao lưu tập trung. Connect là tổng đài. Direct Connect là đường truyền mạng.", "21-16": "Security group là tường lửa ảo ở cấp instance EC2, kiểm soát lưu lượng cho một hoặc nhiều instance. ACL (Network ACL) hoạt động ở cấp subnet. Access key và virtual private gateway không phải tường lửa.", "21-17": "Kết nối on-prem tới nhiều VPC ở các Region khác nhau một cách hiệu quả nhất thì dùng Transit Gateway (hub trung tâm). Direct Connect hay VPN riêng lẻ phải tạo nhiều kết nối. Client VPN dành cho người dùng cá nhân.", "21-18": "Gói Enterprise có review kiến trúc và vận hành, cùng hỗ trợ 24/7 từ Senior Cloud Support Engineer qua email, chat và điện thoại. Business có hỗ trợ 24/7 nhưng không có review kiến trúc định kỳ.", "21-19": "AWS Organizations (qua SCP) giới hạn dịch vụ, tài nguyên và hành động API mà user và role trong mỗi tài khoản thành viên được truy cập. Cognito lo đăng nhập ứng dụng, Shield chống DDoS, Firewall Manager quản lý tường lửa.", "21-20": "AWS Artifact là nơi tốt nhất để tìm thông tin và báo cáo tuân thủ về AWS. Marketplace bán phần mềm, Inspector quét lỗ hổng, Support là hỗ trợ kỹ thuật.", "21-21": "S3 One Zone-IA phù hợp với dữ liệu có yêu cầu độ bền thấp hơn (chỉ 1 AZ) nhưng cần truy cập nhanh khi cần, ví dụ bản sao lưu thứ hai. Standard cho dữ liệu dùng thường xuyên. Glacier và Deep Archive không truy cập ngay.", "21-22": "Availability Zone là một hoặc nhiều data center vật lý. B mô tả Region. C sai. D sai, AZ có nguồn điện và mạng dự phòng.", "21-23": "Công cụ tự động hoá hạ tầng: CloudFormation (IaC) và OpsWorks (quản lý cấu hình Chef/Puppet). CloudFront là CDN, Batch chạy job, QuickSight là BI.", "21-24": "CloudFormation (với StackSets) cho phép tạo bản sao tài nguyên ở nhiều Region từ cùng một template. ElastiCache là bộ nhớ đệm, CloudTrail ghi log, Systems Manager quản lý máy chủ.", "21-25": "Mã hoá log CloudTrail dùng khoá của AWS KMS (SSE-KMS). Secrets Manager lưu mật khẩu, Systems Manager quản lý máy chủ, Certificate Manager quản lý SSL.", "21-28": "Amazon Lightsail (máy chủ ảo đơn giản) và AWS Batch (chạy job) là dịch vụ tính toán. Systems Manager quản lý, CloudFormation tạo hạ tầng, Inspector quét lỗ hổng.", "21-29": "Tạo tài khoản AWS riêng cho mỗi phòng ban giúp tách chi phí mọi dịch vụ, kể cả lưu lượng mạng (phần khó gắn tag). Tag không tách được mọi loại chi phí. VPC riêng không tách hoá đơn.", "21-30": "Lợi ích của consolidated billing là giảm giá theo khối lượng nhờ cộng dồn mức dùng. Nó không cấp Health Dashboard, không tăng bảo mật, không tập trung IAM.", "21-31": "AWS Budgets cho đặt ngưỡng chi phí và mức dùng tùy chỉnh, cảnh báo khi vượt. Organizations quản lý tài khoản, Cost Explorer phân tích, Trusted Advisor khuyến nghị.", "21-32": "Amazon Macie phát hiện rò rỉ dữ liệu cá nhân (PII) và thông tin đăng nhập ngoài ý muốn. GuardDuty phát hiện mối đe doạ, Inspector quét lỗ hổng, Shield chống DDoS.", "21-33": "Trusted Advisor có mục kiểm tra Service Limits, theo dõi giới hạn dịch vụ. TCO Calculator so sánh chi phí, Health Dashboard báo sự kiện, CUR là chi phí.", "21-34": "Workload phân bổ trên cả AWS Cloud và máy chủ on-prem là kiến trúc hybrid cloud. VPN là kết nối, VPC là mạng ảo, private cloud là cloud riêng.", "21-35": "Best practice IAM: chỉ cấp quyền cho người cần làm công việc cụ thể (quyền tối thiểu). Tắt Console cho mọi người, tạo secret key cho mọi user hay lưu thông tin đăng nhập trên EC2 đều sai.", "21-36": "AWS Control Tower tự động hoá và quản lý môi trường nhiều tài khoản an toàn, đúng chuẩn Well-Architected. Mô hình trách nhiệm chung là khái niệm. Security Hub tổng hợp cảnh báo. Well-Architected Tool đánh giá kiến trúc.", "21-37": "Transit Gateway giúp dễ dàng mở rộng kết nối giữa hàng nghìn VPC. VPC peering không bắc cầu, khó quản lý khi có nhiều VPC. Direct Connect nối on-prem. Global Accelerator tối ưu lưu lượng người dùng.", "21-38": "Shield Advanced bảo vệ DDoS nâng cao và có đội chuyên gia AWS (Shield Response Team) hỗ trợ khi bị tấn công. Firewall Manager quản lý tường lửa, WAF lọc request web, GuardDuty phát hiện mối đe doạ.", "21-39": "Ứng dụng có thời gian bắt đầu và kết thúc linh hoạt (chịu được gián đoạn) thì Spot là tiết kiệm nhất.", "21-40": "Khách hàng chịu trách nhiệm bảo mật dữ liệu khi truyền (D) và xác thực tính toàn vẹn dữ liệu (E). An ninh vật lý, thiết bị mạng vật lý và huỷ thiết bị lưu trữ là của AWS.", "21-41": "Workload phân tích dữ liệu không thường xuyên, bị ngắt không sao, thì Spot là tiết kiệm nhất.", "21-42": "Amazon ECS giúp cài đặt, vận hành và mở rộng hạ tầng quản lý cụm container. ECR lưu image, Elastic Beanstalk triển khai ứng dụng, EBS là ổ đĩa.", "21-43": "IAM role cho phép ứng dụng trên EC2 ghi dữ liệu vào S3 một cách an toàn mà không cần thông tin đăng nhập dài hạn. Access key của IAM user là thông tin dài hạn, không nên dùng. Cognito dành cho người dùng ứng dụng. Shield chống DDoS.", "21-44": "Gói Developer có hỗ trợ kỹ thuật qua support case (email, giờ hành chính). Professional Services là dịch vụ tư vấn trả phí. TAM chỉ có ở Enterprise. Consulting partners là bên ngoài.", "21-45": "Internet gateway cho phép giao tiếp giữa VPC và Internet. VPN dùng virtual private gateway. Internet gateway không giới hạn băng thông, không chia tải.", "21-46": "RDS Multi-AZ có tự động failover sang bản standby, endpoint giữ nguyên nên ứng dụng chạy tiếp mà không cần can thiệp thủ công. Các lựa chọn khác không phù hợp cho CSDL.", "21-47": "Elastic Load Balancing phân phối lưu lượng cho một hoặc nhiều EC2. NAT gateway cho subnet private ra internet. Athena truy vấn S3. PrivateLink truy cập dịch vụ riêng tư.", "21-48": "Trusted Advisor khuyến nghị về tối ưu chi phí (A) và hiệu năng (D), cùng bảo mật, chịu lỗi, giới hạn dịch vụ. Auditing, serverless và scalability không phải nhóm kiểm tra.", "21-49": "Chỉ root user mới đóng được tài khoản AWS (A) và đổi gói AWS Support (C). Tạo IAM policy, gắn role cho EC2 và tạo access key cho IAM user thì admin IAM cũng làm được.", "21-50": "Fault tolerance (chịu lỗi) là sự dự phòng sẵn có trong các thành phần của ứng dụng, giúp vẫn chạy khi một phần hỏng. A là scalability. B là khôi phục thảm họa. C là bảo mật.", "22-1": "Cần hoá đơn riêng cho từng môi trường (dev, test, prod) thì dùng nhiều tài khoản AWS. Tag giúp phân bổ chi phí nhưng vẫn chung một hoá đơn. VPC không tách hoá đơn. Cost Explorer chỉ phân tích.", "22-2": "CodePipeline dùng trong quy trình triển khai ứng dụng (CI/CD). AppSync là GraphQL API, Batch chạy job, DataSync chuyển dữ liệu.", "22-3": "Giảm chi phí EC2: Spot cho workload phi trạng thái, linh hoạt (A), và Reserved Instance cho workload chạy liên tục (D). B sai loại máy (high-compute dùng Compute optimized). C, On-Demand đắt cho workload liên tục. E, Budgets chỉ cảnh báo, không giảm giá.", "22-4": "AWS Artifact cung cấp báo cáo tuân thủ (như PCI) và các thoả thuận với AWS theo yêu cầu. Certificate Manager quản lý SSL, Config theo dõi cấu hình, CloudTrail ghi log.", "22-5": "Route 53 quản lý lưu lượng ứng dụng xuyên Region (latency, geolocation, failover routing). ELB chỉ chia tải trong một Region. AppStream stream ứng dụng. VPC là mạng ảo.", "22-6": "CloudTrail ghi lại mọi lệnh API, kể cả các lần gọi bị từ chối (trái phép). Config theo dõi cấu hình, Trusted Advisor khuyến nghị, Inspector quét lỗ hổng.", "22-7": "AWS Config thường xuyên kiểm tra và đánh giá cấu hình mọi tài nguyên, xác định tài nguyên không tuân thủ và thông báo khi có thay đổi. Trusted Advisor đưa khuyến nghị chung. RAM chia sẻ tài nguyên. Systems Manager quản lý máy chủ.", "22-9": "S3 Cross-Region Replication tự động sao chép dữ liệu sang bucket ở Region khác. CloudFront chỉ cache, không sao lưu. S3 không có tính năng «snapshot bucket». AWS Backup hỗ trợ S3 nhưng đáp án chuẩn cho câu này là CRR.", "22-10": "AWS Budgets gửi cảnh báo khi vượt ngưỡng chi tiêu tùy chỉnh. Cost Explorer phân tích, cost allocation tags phân loại, Organizations quản lý tài khoản.", "22-11": "Đáp án theo đề là B (điền form yêu cầu pen test). Lưu ý đây là quy định CŨ. Hiện nay không cần xin phép trước khi pen test các dịch vụ trong danh sách cho phép (EC2, RDS, Lambda…). Form chỉ cần cho một số hoạt động đặc biệt như mô phỏng DDoS. Xem thêm Đề 2 câu 12.", "22-12": "Amazon Macie tự động phát hiện, phân loại và bảo vệ dữ liệu nhạy cảm trên S3. Inspector quét lỗ hổng, GuardDuty phát hiện mối đe doạ, Secrets Manager lưu mật khẩu.", "22-13": "Site-to-Site VPN cần customer gateway (C, phía on-prem) và virtual private gateway (E, phía AWS, hoặc Transit Gateway). Internet gateway và NAT gateway là cổng ra internet.", "22-14": "Workload ngắn hạn, tăng đột biến, khó đoán và không được gián đoạn thì On-Demand là phù hợp nhất. Spot có thể bị ngắt, Reserved cần cam kết.", "22-15": "Nguyên tắc giảm phụ thuộc lẫn nhau giữa các hệ thống là liên kết lỏng (loose coupling).", "22-16": "AWS Security Bulletins là nguồn tốt nhất để cập nhật các thông báo bảo mật của AWS. Health Dashboard báo sự kiện dịch vụ, Secrets Manager lưu mật khẩu, Inspector quét lỗ hổng.", "22-17": "Theo đề, EBS cung cấp lưu trữ bền vững cho file system (gắn vào EC2 rồi định dạng file system). S3 là object storage. Instance store là tạm thời. ElastiCache là cache trong RAM.", "22-18": "Gắn tag cho tài nguyên (cost allocation tags) giúp quản lý phân bổ chi phí trên hoá đơn. Hạn chế người tạo tài nguyên, thêm phương thức thanh toán phụ hay dùng một tài khoản không phân bổ được chi phí.", "22-19": "AWS Artifact cho tải báo cáo bảo mật và tuân thủ về hạ tầng AWS theo yêu cầu. GuardDuty phát hiện mối đe doạ, Security Hub tổng hợp cảnh báo cho tài khoản của bạn, Shield chống DDoS.", "22-20": "Lambda và DynamoDB là serverless. Elasticsearch Service (OpenSearch), Elastic Beanstalk và Redshift (bản cổ điển) chạy trên instance.", "22-21": "Mở rộng data center on-prem tới mạng AWS: AWS VPN và Direct Connect. NAT gateway cho subnet private ra internet, Connect là tổng đài, Route 53 là DNS.", "22-22": "Để rời khỏi AWS Organizations, tài khoản thành viên phải đáp ứng yêu cầu của tài khoản độc lập (có phương thức thanh toán, thông tin liên hệ, gói support…). Không cần mở support case hay đạt SOC.", "22-23": "Khả năng triển khai ứng dụng tăng giảm theo nhu cầu thay đổi là tính co giãn (elasticity). Scalability là khả năng mở rộng, nhưng câu nhấn mạnh «lên và xuống theo nhu cầu».", "22-24": "Báo cáo SOC 2 của AWS lấy ở AWS Artifact. Health Dashboard báo sự kiện, Trusted Advisor khuyến nghị, S3 là lưu trữ.", "22-25": "File gốc ghi «BD» nhưng câu này chỉ chọn 1. Đáp án chuẩn là B: chạy trên hai AZ ở một Region để sẵn sàng cao, và dùng Region khác làm nơi khôi phục thảm họa khi cả Region gặp sự cố. D cũng đáp ứng nhưng phức tạp và tốn kém hơn (như file gốc ghi chú). A và C vẫn nằm trong cùng Region nên không chống được sự cố toàn Region.", "22-26": "500 TB thì dùng Snowball (vài thiết bị) là tiết kiệm nhất. Direct Connect và VPN truyền qua mạng sẽ rất lâu. S3 là nơi lưu, không phải cách vận chuyển.", "22-27": "Amazon RDS chạy được PostgreSQL được quản lý cho xử lý giao dịch trực tuyến (OLTP). DynamoDB là NoSQL, Athena truy vấn S3, EMR xử lý big data.", "22-28": "Xác định chi phí theo phòng ban: gắn tag cho tài nguyên (A) và dùng nhiều tài khoản AWS (B). Account manager, Trusted Advisor không làm việc này. Consolidated billing gộp chứ không tách.", "22-29": "Trong bucket policy, phần tử Principal chứa thông tin người dùng (ai được truy cập). Action là hành động, Resource là tài nguyên, Statement là khối quy tắc.", "22-30": "AWS Organizations giúp quản lý chi phí hiệu quả cho nhiều tài khoản (consolidated billing). Trusted Advisor khuyến nghị, Direct Connect là đường truyền, Connect là tổng đài.", "22-31": "Chạy thử 1 tháng cho ứng dụng phục vụ khách hàng (không được gián đoạn) thì On-Demand là phù hợp. Reserved cần cam kết 1 năm. Spot có thể bị ngắt.", "22-32": "Cost Explorer tự động dự báo chi phí AWS trong tương lai (dựa trên lịch sử). TCO và Simple Monthly Calculator ước tính theo dữ liệu bạn nhập, không tự động dự báo.", "22-33": "Cập nhật hypervisor là trách nhiệm của AWS. Bật mã hoá S3, áp dụng IAM policy và vá OS trên EC2 là việc của khách hàng.", "22-34": "Thiết lập tài khoản payer chính để xem báo cáo hoá đơn gộp qua AWS Organizations. Budgets, Macie và QuickSight không thiết lập tài khoản payer.", "22-35": "Thực hiện vận hành dưới dạng code là nguyên tắc thiết kế của trụ cột Operational Excellence.", "22-36": "Kiểm thử quy trình phục hồi (test recovery procedures) là nguyên tắc của trụ cột Reliability. Scale dọc, phục hồi thủ công và thay đổi hạ tầng thủ công đều ngược nguyên tắc.", "22-37": "Convertible RI cho phép đổi sang Convertible RI khác thuộc dòng instance khác, với giá trị bằng hoặc lớn hơn. B sai, không đổi được Region. C sai, chỉ Standard RI mới bán được trên RI Marketplace. D sai, không rút ngắn kỳ hạn được.", "22-38": "Khách hàng hoàn toàn chịu trách nhiệm triển khai kiểm soát định tuyến lưu lượng ứng dụng. Vá và bảo trì hạ tầng, kiểm soát vật lý và môi trường là của AWS.", "22-39": "Ước tính chi phí hằng tháng cho kiến trúc EC2, ELB, RDS thì dùng Simple Monthly Calculator (nay là Pricing Calculator). Support không làm báo giá. Tự tính tay mất công. TCO Calculator so sánh với on-prem.", "22-40": "So với tự chạy trên EC2, RDS có sao lưu tự động (A) và tự vá phần mềm (D). Quản lý schema, đánh index bảng và quản lý ETL vẫn là việc của bạn.", "22-41": "S3 Intelligent-Tiering tự động tiết kiệm chi phí bằng cách chuyển object giữa các lớp theo thay đổi kiểu truy cập. A là reserved capacity. B sai. D là Glacier Deep Archive.", "22-42": "Amazon Redshift là kho dữ liệu, gộp dữ liệu từ nhiều nguồn vào một nơi. DynamoDB là NoSQL, Athena truy vấn S3, QuickSight là BI.", "22-43": "AWS Config theo dõi thay đổi tài nguyên và thiết lập tuân thủ (Config rules). CloudWatch giám sát, CloudTrail ghi log API, Trusted Advisor khuyến nghị.", "22-44": "Tài nguyên on-prem dùng không hết là vấn đề mà tính co giãn của cloud giải quyết tốt nhất: chỉ dùng và trả cho mức cần.", "22-45": "Workload có trạng thái chạy 3 năm trên EC2 thì Reserved Instance là tiết kiệm nhất. Spot có thể bị ngắt, không hợp workload có trạng thái.", "22-46": "Chạy 7 giờ không được gián đoạn thì On-Demand là phù hợp và tiết kiệm. Reserved cần cam kết dài. Spot có thể bị ngắt.", "22-47": "Lợi ích của Trusted Advisor: phát hiện tài nguyên dùng không hết để tiết kiệm (C) và cải thiện bảo mật bằng cách chủ động giám sát môi trường (D). Điều phối container là ECS, quản lý khoá là KMS, bắt buộc tag là Tag Policies.", "22-48": "Best practice: chỉ cấp quyền truy cập đúng tài nguyên cần cho công việc (A), và chính sách mật khẩu yêu cầu độ dài tối thiểu (E). Không chia sẻ root, không cho vào nhóm admin, và phải cho phép đổi mật khẩu.", "22-49": "AWS Snowball được thiết kế để chuyển hàng petabyte dữ liệu vào và ra cloud. Storage Gateway dùng cho hybrid, Glacier Deep Archive là lớp lưu trữ, Lightsail là máy chủ.", "22-50": "Amazon Redshift cho phép xây kho dữ liệu (data warehouse) trên AWS Cloud. EFS là file system, RDS là CSDL cho ứng dụng, VPC là mạng ảo.", "23-1": "Sau khi chuyển lên AWS, kiểm soát vật lý và môi trường của data center thuộc về AWS. Vá guest OS và ứng dụng là việc của khách hàng. Bảo vệ truyền thông (C) là kiểm soát chia sẻ.", "23-2": "Triển khai ứng dụng: Elastic Beanstalk (PaaS) và OpsWorks (Chef/Puppet, đã ngừng từ 2024). Config theo dõi cấu hình, Application Discovery khảo sát on-prem trước khi di chuyển, Kinesis xử lý dữ liệu streaming.", "23-3": "Amazon Connect là tổng đài (contact center) trên cloud, dùng theo nhu cầu. Đừng nhầm với Direct Connect là đường truyền mạng riêng.", "23-4": "AWS Pricing Calculator là công cụ web miễn phí, không cần tài khoản AWS, ước tính chi phí cho hầu hết dịch vụ. Cost Explorer và Budgets cần tài khoản. TCO Calculator đã ngừng.", "23-5": "Internet gateway gắn vào VPC để cho phép truy cập từ Internet vào (inbound). NAT gateway chỉ cho phép đi ra (outbound). VPC endpoint dùng cho dịch vụ AWS riêng tư. VPN nối mạng on-prem.", "23-6": "Máy chủ CSDL chạy liên tục 1 năm thì dùng Reserved Instance. Trả trước càng nhiều càng rẻ: All Upfront > Partial Upfront > No Upfront. Trong các lựa chọn, Partial Upfront tiết kiệm nhất. Spot có thể bị ngắt.", "23-7": "Chuyển sang RDS và bật Multi-AZ để có bản standby ở AZ khác, tự động failover. ALB không giúp khi chỉ có 1 instance. EC2 Auto Recovery khôi phục trong cùng AZ. Termination protection chỉ chống xoá nhầm.", "23-8": "Độ phức tạp mật khẩu được đặt bằng IAM account password policy. User policy là quyền truy cập. SCP giới hạn quyền tối đa. Security Hub tổng hợp phát hiện bảo mật.", "23-9": "Khách hàng vá guest OS và ứng dụng. Vá hạ tầng, kiểm soát vật lý và môi trường, cấu hình thiết bị hạ tầng là việc của AWS.", "23-10": "Để chạy workload tuân thủ PCI: dùng dịch vụ AWS nằm trong phạm vi PCI (in-scope), rồi tự áp dụng kiểm soát PCI ở tầng ứng dụng. Không có ticket support nào «bật PCI» giúp bạn.", "23-11": "Gửi, lưu và nhận message giữa các thành phần, xử lý theo thứ tự FIFO thì dùng SQS (FIFO queue). SNS là pub/sub đẩy thông báo, không lưu. Step Functions điều phối workflow. Kinesis dành cho streaming.", "23-12": "Gộp hoá đơn: tài khoản quản lý (master) của AnyCompany trong AWS Organizations gửi lời mời cho Example Corp tham gia, rồi consolidated billing tự áp dụng. Không cần nhờ SA/TAM, mở case hay chuyển tài nguyên.", "23-13": "AWS Budgets cảnh báo khi chi phí thực tế hoặc dự báo vượt ngưỡng. Cost Explorer phân tích, CUR là dữ liệu chi tiết, CloudTrail ghi log API.", "23-14": "Ít kiến thức AWS mà muốn nhanh chóng triển khai ứng dụng Node.js có khả năng mở rộng thì dùng Elastic Beanstalk: chỉ cần tải code lên, nó lo hạ tầng. CloudFormation và EC2 cần nhiều kiến thức hơn.", "23-15": "Mọi người dùng (gói Basic và Developer) đều có các Core checks của Trusted Advisor (bảo mật cơ bản và giới hạn dịch vụ). Toàn bộ checks cần gói Business trở lên.", "23-16": "Chống DDoS: AWS Shield và CloudFront (phân tán lưu lượng ở edge, tích hợp Shield). CloudTrail ghi log, Support Center là hỗ trợ, Service Health Dashboard là trạng thái dịch vụ.", "23-17": "AWS Artifact cho truy cập tự phục vụ, theo nhu cầu tới các báo cáo kiểm soát tuân thủ của AWS.", "23-18": "Chỉ dùng CLI và SDK thì tạo IAM user với programmatic access (access key), không có Console (B). Theo quyền tối thiểu, gắn policy chỉ có quyền RDS (E), không phải admin.", "23-19": "AWS Config ghi lại và đánh giá thay đổi cấu hình, đồng thời có remediation action (tự khắc phục qua SSM Automation). CloudTrail ghi lệnh API, không đánh giá cấu hình.", "23-20": "Triển khai EC2 trên nhiều AZ giúp tránh điểm lỗi duy nhất (A) và tăng tính sẵn sàng (D). Không giảm chi phí, không giảm độ trễ xuyên Region (cần nhiều Region), và «tăng tải» không phải lợi ích.", "23-21": "Số lượng EC2 ổn định và chạy lâu dài thì Reserved Instance là rẻ nhất, và có thể đặt trước dung lượng (zonal RI) để đảm bảo có sẵn. Spot rẻ nhưng có thể bị thu hồi.", "23-22": "Personal Health Dashboard (nay là AWS Health Dashboard) cho biết các thay đổi theo lịch (bảo trì) của hạ tầng AWS ảnh hưởng tới bạn. Config theo dõi cấu hình của bạn, không phải lịch của AWS.", "23-23": "Với RDS, khách hàng kiểm soát lưu lượng vào ra CSDL qua security group. Vá OS, sao lưu point-in-time tự động và thay instance hỏng là việc AWS làm.", "23-24": "Với Lambda (serverless), AWS lo OS và nền tảng. Khách hàng quản lý ứng dụng (code, cấu hình, quyền IAM).", "23-25": "AWS Budgets thông báo khi chi phí hoặc mức dùng vượt ngưỡng đã đặt. Cost Explorer chỉ phân tích, CloudTrail ghi log API, Macie tìm dữ liệu nhạy cảm.", "23-26": "DynamoDB là CSDL NoSQL. Aurora và RDS là CSDL quan hệ, Redshift là kho dữ liệu.", "23-27": "Spot Instance là dung lượng EC2 chưa dùng tới, thường giảm giá tới 90%.", "23-28": "Direct Connect cần nhà cung cấp mạng (ISP hoặc partner) và cơ sở colocation (Direct Connect location) để kéo đường truyền vật lý. VPN chỉ cần Internet.", "23-29": "Dịch vụ tính toán: EC2 và Lambda. S3 và EBS là lưu trữ, Cognito là xác thực người dùng.", "23-30": "CodeCommit là kho Git riêng tư, lưu và quản lý phiên bản source code (đã ngừng nhận khách hàng mới từ 2024, nhưng vẫn là đáp án thi). CodeBuild build code, CodePipeline là CI/CD, CodeStar quản lý dự án.", "23-31": "Trusted Advisor kiểm tra lỗ hổng bảo mật ở cấp tài khoản, ví dụ port mở, root không bật MFA, bucket S3 public. Macie tìm dữ liệu nhạy cảm trong S3.", "23-32": "Gián đoạn do môi trường (thiên tai) có thể ảnh hưởng cả khu vực, nên cần sao chép giữa các Region để đảm bảo kinh doanh liên tục. AZ cùng Region có thể cùng bị ảnh hưởng.", "23-33": "Amazon SNS gửi được cả tin nhắn văn bản (SMS) và email từ ứng dụng phân tán. SES chỉ gửi email, SQS là hàng đợi.", "23-34": "Nguyên tắc của trụ cột Reliability: kiểm thử quy trình phục hồi (C) và tự động phục hồi khi lỗi (E). Kiến trúc nguyên khối là ngược nguyên tắc. B và D thuộc trụ cột Cost Optimization.", "23-36": "Kết nối riêng, độ trễ thấp từ văn phòng tới AWS thì dùng Direct Connect. VPN vẫn đi qua Internet công cộng. VPC peering nối các VPC với nhau.", "23-37": "Lấy báo cáo tuân thủ theo yêu cầu thì dùng AWS Artifact. Security Hub là tình trạng bảo mật của tài khoản bạn, không phải báo cáo của AWS.", "23-38": "AWS WAF chặn SQL injection và cross-site scripting (XSS), gắn vào ALB, CloudFront hoặc API Gateway. GuardDuty phát hiện mối đe doạ, Inspector quét lỗ hổng.", "23-39": "Sẵn sàng cao: chạy nhiều instance trên nhiều AZ. Một AZ duy nhất hay một instance đều là điểm lỗi duy nhất.", "23-40": "CSDL ổn định (steady-state) chạy 3 năm thì Reserved Instance tiết kiệm nhiều nhất. Spot không hợp CSDL vì có thể bị ngắt.", "23-41": "IAM credential report liệt kê mọi IAM user và trạng thái thông tin đăng nhập (mật khẩu, access key, MFA), tải về dạng CSV. Đây là cách đơn giản nhất. Cấp quyền admin cho kiểm toán viên vi phạm quyền tối thiểu.", "23-42": "Consolidated billing có lợi ích: giảm giá theo khối lượng (A) và một hoá đơn cho nhiều tài khoản (C). Nó miễn phí, không trả góp, và tạo budget là việc của AWS Budgets.", "23-43": "Lưu lượng tăng đột biến ngắn hạn, không được gián đoạn, cần linh hoạt và tiết kiệm thì dùng On-Demand. Spot có thể bị ngắt, Reserved cần cam kết dài.", "23-44": "AWS Config rules theo dõi thay đổi cấu hình tài nguyên và đánh giá tuân thủ. VPC Flow Logs ghi lưu lượng mạng. SCP giới hạn quyền.", "23-45": "Phân phối ảnh, video toàn cầu với độ trễ thấp và tiết kiệm thì dùng CloudFront (CDN). Sao chép S3 sang nhiều Region tốn hơn và không có cache ở edge. PrivateLink dùng cho kết nối riêng.", "23-46": "Quyền tối thiểu nghĩa là chỉ gắn IAM policy cho những user thật sự cần. MFA là best practice khác (xác thực), không phải quyền tối thiểu.", "23-47": "Chi phí biến đổi thấp hơn nhờ mua số lượng lớn là lợi thế kinh tế theo quy mô (economies of scale).", "23-48": "Nối hàng nghìn VPC ở nhiều tài khoản, đơn giản hoá quản lý và giảm chi phí vận hành thì dùng Transit Gateway (hub trung tâm). VPC peering phải tạo rất nhiều kết nối 1-1.", "23-49": "Ứng dụng có thể được xây để tự động tăng giảm quy mô theo nhu cầu (elasticity và Auto Scaling), nên chỉ trả cho mức dùng. AWS không hoàn tiền, không tự chuyển sang Spot. CloudWatch không tự dự đoán tài nguyên.", "23-50": "AWS WAF chặn SQL injection ở tầng ứng dụng (Layer 7). Security group và NACL lọc theo IP và port. IAM policy là quyền truy cập.", "12-29": "IAM policy (cùng bucket policy) giới hạn người dùng nào được truy cập bucket S3. Key pair dùng để SSH. Inspector quét lỗ hổng. Security Group lọc lưu lượng mạng cho instance, không áp dụng cho S3.", "12-41": "Consolidated billing cho một hoá đơn cho nhiều tài khoản (A) và có thể được giảm giá theo khối lượng vì mức dùng của mọi tài khoản được cộng dồn (D). Không tự tăng service limit, không giảm giá cố định, không tự mở rộng gói support cho mọi tài khoản.", "13-1": "Cost allocation tags giúp theo dõi và phân loại chi tiêu ở mức chi tiết (theo dự án, phòng ban, môi trường). Consolidated billing gộp hoá đơn. Budgets đặt ngân sách. Marketplace bán phần mềm.", "13-2": "S3 lưu object, truy cập theo thời gian thực, có versioning và lifecycle policy. Glacier không truy cập tức thì (lớp cổ điển). Storage Gateway dùng cho hybrid. EBS là ổ đĩa khối.", "13-3": "AWS Professional Services là đội tư vấn của AWS, hỗ trợ đẩy nhanh việc áp dụng cloud qua các hợp đồng trả phí ở nhiều mảng chuyên môn. Enterprise Support là gói hỗ trợ. Solutions Architect và Account Manager không bán dịch vụ tư vấn theo hợp đồng như vậy.", "13-4": "Không có chuyên môn kỹ thuật AWS trong công ty thì thuê APN Consulting Partners (công ty tư vấn, triển khai). Technology Partners bán sản phẩm phần mềm. Marketplace là chợ phần mềm. Service Catalog là danh mục sản phẩm nội bộ.", "13-5": "Phân bố workload trên nhiều AZ là thực hiện nguyên tắc «thiết kế cho lỗi» (design for failure): một AZ hỏng thì AZ khác chạy tiếp. Automation, agility và elasticity là nguyên tắc khác.", "13-6": "SQL Server chạy được trên EC2 (tự cài) hoặc RDS for SQL Server. Aurora chỉ tương thích MySQL, PostgreSQL. Redshift là kho dữ liệu. S3 là object storage.", "13-7": "Trusted Advisor kiểm tra môi trường AWS để tìm cơ hội tiết kiệm chi phí và cải thiện hiệu năng (cùng bảo mật, chịu lỗi, giới hạn dịch vụ). Cost Explorer chỉ xem chi phí, không đề xuất cải thiện hiệu năng.", "13-8": "Dedicated Host cho phép dùng bản quyền phần mềm sẵn có gắn với máy chủ (server-bound, tính theo socket hoặc core). Spot, Reserved và On-Demand là cách tính tiền, chạy trên phần cứng dùng chung.", "13-9": "Với nhu cầu thay đổi, AWS tiết kiệm nhờ tính co giãn, tự tăng giảm tài nguyên (C), và trả tiền theo mức dùng (D). Sẵn sàng cao, mô hình bảo mật chung và độ tin cậy không trực tiếp làm giảm chi phí.", "13-10": "CloudTrail liên tục ghi lại hoạt động tài khoản (thao tác trên Console, SDK, CLI) để kiểm toán rủi ro. CloudWatch giám sát hiệu năng. Config theo dõi cấu hình. AWS Health báo sự kiện dịch vụ.", "13-11": "S3 là kho lưu object (B) và hệ thống lưu trữ có độ bền cao (E). S3 không phải file system (toàn cầu, cục bộ hay mạng). Đó là EFS hoặc FSx.", "13-12": "Route 53 (DNS cho cả tài nguyên AWS và on-prem) và Virtual Private Gateway (cổng VPN nối on-prem với VPC) dùng được trong kiến trúc hybrid. Classic Load Balancer và Auto Scaling hoạt động trong AWS. CloudWatch default metrics chỉ có cho tài nguyên AWS (on-prem cần agent).", "13-13": "So sánh TCO cần tính chi phí bảo mật data center (an ninh, nhân viên bảo vệ). Quản lý dự án, bản quyền antivirus và phát triển phần mềm như nhau dù on-prem hay AWS nên không đưa vào so sánh hạ tầng.", "13-14": "CSDL tự quản lý, tắt mỗi đêm thì dùng EC2 với ổ EBS (dữ liệu vẫn còn khi stop). Instance store mất dữ liệu khi stop. Redshift và DynamoDB là dịch vụ được quản lý, không tự host.", "13-15": "Region chứa nhiều Availability Zone. Edge location tách biệt, không nằm trong AZ. Data center nằm trong AZ, không chứa Region.", "13-17": "Consolidated billing cho một hoá đơn cho nhiều tài khoản (A) và có thể được giảm giá theo khối lượng vì mức dùng của mọi tài khoản được cộng dồn (D). Không tự tăng service limit, không giảm giá cố định, không tự mở rộng gói support cho mọi tài khoản.", "13-18": "3 năm, trả trước toàn bộ, Standard RI giảm giá nhiều nhất. Quy tắc: 3 năm hơn 1 năm, All Upfront hơn Partial hơn No Upfront, Standard hơn Convertible.", "13-19": "So với data center truyền thống, AWS có chi phí biến đổi thấp hơn (nhờ quy mô) và chi phí trả trước thấp hơn (không cần mua máy).", "13-20": "Edge location giúp giảm độ trễ và cải thiện hiệu năng cho người dùng. Edge location không chạy EC2 thông thường. C sai, cache dữ liệu ít thay đổi chứ không phải dữ liệu thay đổi liên tục. D sai, không phải làm mới hằng ngày.", "13-21": "IAM policy (cùng bucket policy) giới hạn người dùng nào được truy cập bucket S3. Key pair dùng để SSH. Inspector quét lỗ hổng. Security Group lọc lưu lượng mạ
