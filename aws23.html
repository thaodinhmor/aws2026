rợ hoá đơn và tài khoản) chỉ có trong gói Enterprise. Premium và Standard Support không phải tên gói hiện tại của AWS.", "4-10": "CloudTrail lưu lịch sử gọi API, cho biết ai đã thay đổi tài nguyên nào, lúc nào. Config theo dõi lịch sử cấu hình (thay đổi thế nào) nhưng câu hỏi nhấn mạnh «API call history» nên chọn CloudTrail. CloudWatch giám sát hiệu năng.", "4-11": "Dịch vụ được AWS quản lý giúp giao giải pháp mới nhanh hơn (B) và giảm độ phức tạp vận hành (C). A sai, ít kiểm soát hơn. D sai, vẫn nên mã hoá dữ liệu. E sai, AWS lo phần vá lỗi.", "4-12": "S3 dùng để host website tĩnh (A) và làm nguồn lưu media cho CloudFront (D). S3 không chạy code nên không host website cần CPU cao (B). C, S3 không phải CSDL. E là Kinesis.", "4-13": "AWS khuyến nghị xoay vòng (đổi) access key định kỳ. Không chia sẻ access key, không lưu trong code (dùng IAM role thay thế). A sai vì CLI, SDK cần access key, không dùng mật khẩu.", "4-14": "MFA thêm một lớp bảo mật ngoài tên đăng nhập và mật khẩu. Key pair dùng SSH, access key cho CLI, SDK là thư viện lập trình.", "4-15": "API cho phép quản lý tài nguyên AWS bằng chương trình (code, script), tự động hoá được. API không làm tài nguyên chạy nhanh hơn, không giảm thời gian cấp phát, không giảm số developer.", "4-16": "CSDL đọc ghi nhiều cần ổ đĩa khối có IOPS cao, gắn trực tiếp vào máy chủ, tức là EBS (ví dụ Provisioned IOPS SSD). S3 là object storage, không dùng làm ổ CSDL. Glacier dùng lưu trữ dài hạn. Storage Gateway dùng cho hybrid.", "4-17": "AWS Budgets có loại «Reservation budget» theo dõi mức sử dụng RI và cảnh báo khi tỉ lệ sử dụng xuống dưới ngưỡng bạn đặt. A, tắt chia sẻ RI làm lãng phí hơn. B, Neptune là CSDL đồ thị. D, CloudTrail không đưa khuyến nghị chi phí.", "4-18": "Aurora có hiệu năng gấp khoảng 5 lần MySQL tiêu chuẩn (và 3 lần PostgreSQL tiêu chuẩn). Redshift là kho dữ liệu, DynamoDB là NoSQL, Neptune là CSDL đồ thị.", "4-19": "Service Catalog giúp tổ chức tạo và quản lý danh mục các dịch vụ IT đã được duyệt (ví dụ mẫu EC2 chuẩn công ty), đơn giản hoá việc quản trị. D mô tả AWS CDK. A và B không phải chức năng của Service Catalog.", "4-20": "Với DynamoDB (dịch vụ được quản lý), AWS lo vá phần mềm CSDL (C) và bảo trì hệ điều hành (D). Khách hàng lo bảo vệ thông tin đăng nhập, ghi log truy cập (bật CloudTrail) và tạo chính sách truy cập.", "4-21": "Application Discovery Service thu thập thông tin máy chủ on-prem (cấu hình, mức dùng, phụ thuộc) để LẬP KẾ HOẠCH di chuyển. DMS thực hiện di chuyển CSDL. Migration Hub theo dõi tiến độ. «Snowball Migration Service» không tồn tại.", "4-22": "Cost & Usage Report cung cấp dữ liệu chi phí và mức sử dụng chi tiết nhất (theo giờ, theo từng tài nguyên). Cost Explorer xem tổng quan bằng biểu đồ, ít chi tiết hơn. AMI là ảnh máy chủ, CloudWatch giám sát hiệu năng.", "4-23": "Region là một khu vực địa lý gồm nhiều Availability Zone. A sai vì edge location tách biệt với Region. B là định nghĩa VPC. D sai vì một quốc gia có thể có nhiều Region.", "4-24": "CloudTrail ghi lại mọi lệnh API, kể cả DeleteBucket, kèm danh tính người thực hiện. SNS và SQS không có log kiểu này. CloudWatch Logs chứa log ứng dụng nhưng không tự ghi lại ai xoá bucket.", "4-25": "Chọn loại CSDL dựa vào số lần đọc ghi mỗi giây (C) và bản chất các truy vấn (D, ví dụ truy vấn quan hệ phức tạp hay key-value đơn giản). AZ, chủ quyền dữ liệu và lỗi phần mềm không quyết định loại công nghệ CSDL.", "4-26": "Tag giúp nhanh chóng nhận diện tài nguyên thuộc dự án nào (A) và theo dõi chi phí theo nhóm tài nguyên (E) qua cost allocation tags. Theo dõi lệnh API là CloudTrail. Tag không giúp tìm tài nguyên đã xoá.", "4-27": "Shared controls là các kiểm soát mà AWS và khách hàng cùng thực hiện, mỗi bên ở tầng của mình, ví dụ quản lý bản vá, quản lý cấu hình, đào tạo nhận thức. A là kiểm soát riêng của khách hàng, B là kiểm soát thừa hưởng (inherited).", "4-28": "Trụ cột Performance Efficiency có các nguyên tắc: đi toàn cầu trong vài phút (triển khai nhiều Region) và dùng kiến trúc serverless. B, C, E thuộc trụ cột Security.", "4-29": "Với EC2, khách hàng bảo vệ dữ liệu nhạy cảm (A) và cài đặt, cấu hình phần mềm bên thứ ba (E). Vá hạ tầng bên dưới và bảo trì phần cứng là việc của AWS. C, CSDL được quản lý (RDS) do AWS vận hành.", "4-30": "Lý do chọn AWS: tài nguyên co giãn (C) và tiết kiệm chi phí (E). AWS không tặng bản quyền phần mềm thương mại, hỗ trợ kỹ thuật không miễn phí (trừ Basic), và không cho khách hàng vào data center kiểm toán.", "4-31": "Inspector phân tích bảo mật (quét lỗ hổng). Config kiểm tra cấu hình có tuân thủ quy định không (kiểm toán tuân thủ). Virtual Private Gateway là cổng VPN, Batch chạy job, ECS chạy container.", "4-32": "Câu hỏi tìm điều KHÔNG đúng. EC2 không phải serverless vì bạn phải quản lý máy chủ ảo. B, C, D đúng: không cần đầu tư phần cứng trước, tạo bao nhiêu máy tùy ý, mở rộng được.", "4-33": "Lambda chỉ chạy code khi có sự kiện kích hoạt (file mới lên S3, request API…). CloudWatch giám sát, Transit Gateway kết nối mạng, EC2 chạy liên tục.", "4-34": "Máy chủ ảo trên AWS gọi là EC2 instance. EBS snapshot là sao lưu ổ đĩa, VPC là mạng ảo. «AWS Managed Servers» không phải tên dịch vụ.", "4-35": "AWS Cloud Adoption Framework (CAF) do AWS Professional Services xây dựng, giúp tổ chức lập lộ trình chuyển đổi lên cloud thành công. Secrets Manager lưu mật khẩu, WAF là tường lửa, EFS là file system.", "4-36": "TCO Calculator (nay là Migration Evaluator) phân tích chi phí và lợi ích khi chuyển toàn bộ data center lên AWS, so sánh với chi phí on-prem hiện tại. Cost Explorer xem chi phí AWS đã dùng. Pricing Calculator ước tính chi phí dịch vụ AWS mới, không so sánh với on-prem.", "4-37": "Quản lý hạ tầng bằng code (CloudFormation) là nguyên tắc «perform operations as code» của Operational Excellence. A thuộc Cost Optimization. B thuộc Security. D thuộc Reliability.", "4-38": "Startup chọn AWS vì giảm thời gian ra thị trường nhờ tập trung vào kinh doanh thay vì xây data center (C), và đổi chi phí đầu tư lớn thành chi phí biến đổi thấp (E). A sai, không có trả sau. B sai, AWS không xây data center cho khách. D sai, vẫn có chi phí vận hành (OpEx).", "4-39": "DynamoDB tự mở rộng theo nhu cầu throughput (A) và có độ trễ cực thấp, mili giây một chữ số (D). B sai, DynamoDB không có instance. C sai, chỉ NoSQL. E sai, DynamoDB không hỗ trợ CouchDB hay MongoDB (đó là DocumentDB cho MongoDB).", "4-40": "Để bảo vệ dữ liệu lưu trên S3: Versioning chống xoá hoặc ghi đè nhầm (A), và phân quyền (bucket policy, IAM) chặn truy cập trái phép (C). Mã hoá cũng là cách bảo vệ nhưng đáp án D là giải mã, không phải mã hoá.", "4-41": "Migration Acceleration Program (MAP) giúp doanh nghiệp chuyển lên AWS bằng cách cung cấp AWS Partners và AWS Professional Services, cùng công cụ, đào tạo và credit. Artifact, Athena và Pinpoint không liên quan.", "4-42": "Câu hỏi tìm cách KHÔNG giúp tránh phí bất ngờ. Launch configuration của Auto Scaling không tốn tiền, nên xoá cũng không giảm hoá đơn. EBS không dùng, ELB không dùng và Elastic IP không gắn máy đều bị tính phí, nên cần xoá hoặc giải phóng.", "4-43": "Cost Explorer trực quan hoá chi phí AWS trong các tháng qua bằng biểu đồ. Pricing Calculator ước tính chi phí tương lai. Budgets đặt ngân sách và cảnh báo. Consolidated billing là gộp hoá đơn.", "4-44": "Khách hàng KHÔNG chịu trách nhiệm vận hành data center (C) và bảo mật hạ tầng (E). Đó là việc của AWS. Pen test, đặt trước capacity và kiểm toán tuân thủ là việc khách hàng có thể phải làm.", "4-45": "SNS gửi được SMS tới hơn 200 quốc gia, kể cả tin khuyến mãi. SES chỉ gửi email. S3 lưu trữ, SQS là hàng đợi.", "4-46": "Tạo RDS instance được bằng Management Console (bấm tay) hoặc CloudFormation (template). CodeDeploy triển khai ứng dụng. DMS di chuyển dữ liệu vào CSDL đã có. Quick Starts dùng CloudFormation bên dưới nhưng tự nó không phải công cụ tạo RDS.", "4-47": "Tính tiền theo giây giúp giảm chi phí: tắt máy là ngừng trả tiền ngay, không phải trả nguyên giờ. AWS không có phí bảo trì instance hằng tháng hay phí khởi tạo. Tag miễn phí.", "4-48": "AWS Professional Services là đội chuyên gia tư vấn của AWS, giúp khách hàng đạt mục tiêu kinh doanh khi dùng cloud. Security Team lo bảo mật AWS. Trusted Advisor là công cụ, không phải nhóm người. Concierge lo hoá đơn.", "4-49": "AWS KMS quản lý khoá dùng để mã hoá dữ liệu khách hàng. SCP giới hạn quyền tài khoản, MFA xác thực đăng nhập, Macie tìm dữ liệu nhạy cảm.", "4-50": "AWS Artifact cho phép tải các báo cáo tuân thủ của AWS như SOC và PCI. Well-Architected Tool đánh giá kiến trúc, Glue là ETL, Chime là ứng dụng họp trực tuyến.", "5-1": "Fault tolerance (chịu lỗi) là thiết kế để hệ thống vẫn chạy khi một phần bị hỏng, ví dụ nhiều EC2 trên nhiều AZ sau load balancer. Least Privilege là nguyên tắc bảo mật. Pilot Light là một chiến lược khôi phục thảm họa, vẫn có thời gian ngừng. Multi-threading là kỹ thuật lập trình.", "5-2": "Trả trước toàn bộ (All Upfront) được giảm giá nhiều nhất, tiếp theo là Partial Upfront, rồi No Upfront. Càng trả trước nhiều thì càng rẻ.", "5-3": "AWS bảo vệ dữ liệu bằng kiểm soát truy cập (IAM, bucket policy) và mã hoá dữ liệu (KMS, mã hoá S3, EBS). Thiết bị MFA vật lý bảo vệ đăng nhập chứ không phải dữ liệu. Dung lượng không giới hạn và cân bằng tải không liên quan bảo vệ dữ liệu.", "5-4": "Amazon Linux tính tiền theo giây, nên trả đúng 2 giờ 5 phút 9 giây. CentOS (thời điểm ra đề) bị tính theo giờ tròn, phần lẻ tính thành 1 giờ, nên 4 giờ 23 phút thành 5 giờ. Ghi nhớ: Linux, Windows (và Ubuntu) tính theo giây; một số hệ điều hành khác tính theo giờ.", "5-5": "AWS Support API cho phép tạo, theo dõi và quản lý case hỗ trợ bằng chương trình (cần gói Business trở lên). Trusted Advisor đưa khuyến nghị, Personal Health Dashboard báo sự kiện dịch vụ. «Operations Support» không phải tính năng cụ thể.", "5-6": "Có thể làm việc với IAM qua CLI, SDK, Management Console hoặc API. Security Group và NACL là tường lửa mạng. CodeCommit là kho Git.", "5-7": "Danh tính (identity) trong IAM gồm IAM user, IAM group và IAM role. IAM policy là quyền gắn vào danh tính, không phải danh tính. Resource Groups và Organizations không phải danh tính IAM.", "5-8": "Read Replica nhận các truy vấn đọc, giảm tải cho CSDL chính. Multi-AZ là bản standby để failover, không nhận truy vấn đọc (ở bản cổ điển). Snapshot và backup dùng để khôi phục dữ liệu.", "5-9": "AWS thông báo các sự kiện bảo mật và quyền riêng tư liên quan tới dịch vụ AWS qua Security Bulletins (bản tin bảo mật) trên trang AWS Security Center. ACM quản lý chứng chỉ SSL.", "5-10": "IAM role cấp quyền tạm thời (credential tự hết hạn) cho người dùng hoặc dịch vụ. IAM user và group dùng thông tin đăng nhập dài hạn. Key pair dùng để SSH vào EC2.", "5-11": "Application Load Balancer phân phối đều request HTTP giữa 3 EC2. Global Accelerator tối ưu đường mạng toàn cầu, CloudFront cache nội dung, Transit VPC kết nối nhiều VPC.", "5-12": "Dùng code để cấp phát và vận hành hạ tầng (Infrastructure as Code, ví dụ CloudFormation) loại bỏ sai sót thao tác tay và tự động hoá. CodeDeploy chỉ triển khai ứng dụng, không dựng hạ tầng. Công cụ test phần mềm và Dedicated Host không liên quan.", "5-13": "Bắt buộc MFA cho mọi IAM user giúp chống truy cập trái phép dù lộ mật khẩu. A làm hỏng khả năng dùng CLI, SDK. B sai vì dùng chung tài khoản là vi phạm best practice, mỗi người cần user riêng. D, AWS không có «hai mật khẩu đăng nhập».", "5-14": "S3 giảm giá theo khối lượng: càng lưu nhiều thì giá mỗi GB càng thấp (bậc giá theo dung lượng). VPC miễn phí, Lightsail giá cố định, Cost Explorer là công cụ xem chi phí.", "5-15": "Khi chọn Region, xem xét chủ quyền dữ liệu, tức luật về nơi lưu dữ liệu (B), và chi phí vì giá khác nhau theo Region (C). Ngoài ra còn độ trễ tới NGƯỜI DÙNG và dịch vụ có sẵn. A sai, mọi Region có cùng mức bảo mật. D không liên quan. E sai vì nên gần người dùng, không phải gần văn phòng công ty.", "5-16": "ElastiCache cung cấp bộ nhớ đệm trong RAM (Redis, Memcached) đặt trước CSDL MySQL để đọc nhanh hơn. DAX cũng là cache trong RAM nhưng chỉ dành cho DynamoDB, không dùng với MySQL. EFS là file system, Neptune là CSDL đồ thị.", "5-17": "Auto Scaling Group mở rộng EC2 trên nhiều AZ, tăng tính sẵn sàng và chịu lỗi. A là CloudFront. C sai vì một Auto Scaling Group chỉ nằm trong một Region. D là việc của Load Balancer.", "5-18": "Khoảng cách TCO giữa AWS và hạ tầng truyền thống ngày càng lớn vì AWS liên tục giảm giá dịch vụ (đã giảm giá hàng trăm lần) nhờ lợi thế quy mô. A sai, AWS giúp giảm CapEx. B sai, AWS không tự động hoá mọi vận hành của khách hàng. D không giải thích được khoảng cách chi phí.", "5-19": "«Security IN the cloud» là việc của khách hàng: thiết kế schema CSDL của ứng dụng (A) và mã hoá file system (E). Thay phần cứng, tạo hypervisor và vá hạ tầng bên dưới là «security OF the cloud», thuộc về AWS.", "5-20": "U2F Security Key (khoá bảo mật cắm USB, ví dụ YubiKey) là một loại thiết bị MFA. Các loại khác: app MFA ảo trên điện thoại, token phần cứng. CloudHSM lưu khoá mã hoá, access key dùng cho CLI, key pair dùng SSH.", "5-21": "Elastic Beanstalk hỗ trợ .NET và triển khai nhanh nhất: tải code lên là có môi trường chạy. SNS gửi thông báo, Systems Manager quản lý máy chủ, Trusted Advisor đưa khuyến nghị.", "5-22": "Số lượng Security Group không tính tiền (miễn phí). Hosted Zone là phí của Route 53, không phải EC2. Thời gian chạy, số instance và Elastic IP (tính phí khi đã cấp phát) đều ảnh hưởng chi phí EC2.", "5-23": "Storage Gateway mở rộng lưu trữ on-premises lên AWS: máy chủ công ty vẫn thấy ổ đĩa hoặc thư mục như bình thường nhưng dữ liệu lưu trên S3, tiết kiệm chi phí. Data Pipeline chuyển dữ liệu, Aurora là CSDL, EFS là file system trong AWS.", "5-24": "S3 tự mở rộng dung lượng không giới hạn, chỉ trả tiền cho phần đã lưu, phù hợp nền tảng lưu trữ đám mây. EBS phải chọn dung lượng trước. ECS chạy container. Storage Gateway dành cho hybrid.", "5-25": "IAM user mới tạo mặc định không có quyền gì (implicit deny, từ chối ngầm định). Phải gắn policy cấp quyền thì mới tạo được snapshot hay bucket. A sai, mọi user có quyền đều dùng được. B sai, không cần kích hoạt qua Support. C sai, S3 dung lượng không giới hạn.", "5-26": "CloudTrail ghi lại mọi truy cập và thao tác API vào tài nguyên AWS, đúng thứ kiểm toán viên cần. CloudFront là CDN, CloudFormation tạo hạ tầng, CloudWatch giám sát hiệu năng.", "5-27": "Amazon Cloud Directory cho phép tổ chức dữ liệu dạng phân cấp theo nhiều chiều, ví dụ sơ đồ tổ chức theo phòng ban, địa điểm. B là Kinesis. C là AD Connector hoặc Directory Service. D là Route 53. (Cloud Directory ít khi gặp trong đề mới.)", "5-28": "Case «Production system down» (hệ thống production sập) được phản hồi trong 1 giờ với gói Business. Các mốc cần nhớ: Developer 12 giờ (system impaired), 24 giờ (general). Business 1 giờ (production down). Enterprise On-Ramp 30 phút và Enterprise 15 phút (business-critical down).", "5-29": "Triển khai ứng dụng trên ít nhất 2 AZ là best practice cơ bản cho tính sẵn sàng cao. B sai, ELB chỉ hoạt động trong một Region. C, cùng một AZ vẫn sập chung nếu AZ đó lỗi. D không giải quyết tính sẵn sàng.", "5-30": "Phân tích TCO cần tính chi phí nhân sự và IT (A), làm mát và điện năng (B), cùng phần cứng, mặt bằng. C sai vì EBS là lưu trữ, không có năng lực tính toán. Kiến trúc và tương thích phần mềm không phải chi phí hạ tầng.", "5-31": "Chỉ gói Enterprise có thời gian phản hồi dưới 15 phút cho hệ thống quan trọng bị sập. Business là 1 giờ. Basic không có hỗ trợ kỹ thuật. Developer là 12 đến 24 giờ.", "5-32": "Lambda và DynamoDB là serverless: không có máy chủ để quản lý. EC2, EMR và RDS đều chạy trên instance mà bạn chọn cỡ và quản lý ở mức nào đó.", "5-33": "AWS Certificate Manager (ACM) giúp nhanh chóng tạo, triển khai và quản lý chứng chỉ SSL/TLS (chứng chỉ công khai miễn phí). GuardDuty phát hiện mối đe doạ, Detective điều tra sự cố, WAF là tường lửa web.", "5-34": "AWS OpsWorks tích hợp Chef và Puppet để tự động hoá cấu hình máy chủ. Lưu ý: OpsWorks đã ngừng hoạt động từ 2024, AWS khuyến nghị dùng Systems Manager. Đề cũ vẫn có thể hỏi.", "5-35": "S3 lưu object và cho phép tải về qua internet bằng URL. EBS, EFS và Instance Store gắn vào máy chủ, không cung cấp đường tải trực tiếp qua internet.", "5-36": "CloudWatch giám sát các request HTTP và HTTPS tới CloudFront qua các số liệu như số request, tỉ lệ lỗi, lượng dữ liệu. WAF lọc và chặn request chứ không phải công cụ giám sát. CloudTrail ghi lệnh API quản trị chứ không ghi request của người xem.", "5-37": "Dùng liên tục cả năm thì Reserved Instance tiết kiệm nhất (giảm tới khoảng 72%). On-Demand đắt hơn, Spot có thể bị ngắt, Dedicated Host đắt và không cần thiết.", "5-38": "Nhân viên mới cần quyền dài hạn thì tạo IAM user và gắn policy chỉ có quyền DynamoDB, theo nguyên tắc quyền tối thiểu. Quyền Administrator là quá mức cần thiết (B, D). Role phù hợp cho quyền tạm thời hoặc cho dịch vụ.", "5-39": "Cấp quyền cho ứng dụng trên EC2 thì dùng IAM role (credential tạm thời, tự xoay vòng), không lưu access key dài hạn trong code. D sai, ứng dụng cần quyền mới truy cập được dịch vụ AWS khác.", "5-40": "Dùng lại bản quyền phần mềm bên thứ ba đã có (BYOL) trên AWS giúp tiết kiệm vì không phải mua lại. A sai, managed service thường giảm tổng chi phí. C sai, edge location không chạy workload production. D, Outposts đắt và dành cho nhu cầu đặc biệt.", "5-41": "SQS là hàng đợi tin nhắn, đặt giữa các thành phần để chúng giao tiếp không trực tiếp, giúp tách rời ứng dụng nguyên khối. Virtual Private Gateway là cổng VPN, Artifact là báo cáo tuân thủ, CloudFront là CDN.", "5-42": "Có thể bật MFA ảo qua IAM (trên Console) hoặc qua AWS CLI (hay API). Connect là tổng đài, SNS gửi thông báo, VPC là mạng.", "5-43": "Xử lý nhiều file theo best practice là chạy nhiều EC2 song song (horizontal scaling, parallelization), nhanh và không giới hạn như scale dọc. RDS là CSDL, không dùng để xử lý file.", "5-44": "Pricing Calculator ước tính chi phí của dịch vụ SẮP dùng (S3, CloudFront). Cost Explorer và Cost & Usage Report xem chi phí ĐÃ phát sinh. Budgets đặt ngân sách và cảnh báo.", "5-45": "Khi thấy tài nguyên lạ: mở cuộc điều tra và xoá các IAM user có khả năng đã bị chiếm quyền (D), đồng thời đổi mật khẩu root và mọi IAM user (E). A, dừng mọi dịch vụ gây ảnh hưởng hệ thống thật. B, không bao giờ đưa mật khẩu root cho ai, kể cả AWS Support. C, xoá mọi user là quá mức.", "5-46": "Loose coupling (liên kết lỏng) là giảm phụ thuộc giữa các thành phần để lỗi của một phần không ảnh hưởng phần khác. Tightly coupling là ngược lại. Elastic coupling và scalable coupling không phải thuật ngữ chuẩn.", "5-47": "Amazon EFS là hệ thống file NFS, nhiều EC2 có thể gắn và dùng đồng thời. S3 là object storage, không phải NFS. EBS thường chỉ gắn một EC2. Storage Gateway dùng cho hybrid.", "5-48": "Kết nối độ trễ thấp giữa các AZ cho phép sao chép dữ liệu đồng bộ (synchronous replication), ví dụ RDS Multi-AZ ghi đồng thời vào bản chính và bản standby. A là Direct Connect. B cần nhiều Region. C là Auto Scaling.", "5-49": "Lambda hỗ trợ sẵn nhiều ngôn ngữ như Node.js, Python, Java, Go, Ruby, .NET (B). Với ngôn ngữ khác, có thể dùng Runtime API để tạo custom runtime (E). A sai, không chỉ Python và Node.js. C sai, Lambda không phải ngôn ngữ lập trình. D sai.", "5-50": "X-Ray truy vết request của người dùng qua ứng dụng để tìm lỗi (B), từ đó giúp cải thiện hiệu năng ứng dụng (C). X-Ray không tách rời thành phần (đó là SQS) và không triển khai ứng dụng (đó là CodeDeploy).", "6-1": "Availability Zone là vị trí tách biệt bên trong một Region, còn edge location nằm ở nhiều thành phố trên thế giới, độc lập với AZ. A, B, C đều nhầm lẫn mối quan hệ giữa AZ và edge location.", "6-2": "Gói Business có hỗ trợ khách hàng (customer service) 24/7 (A) và được dùng Infrastructure Event Management với phí bổ sung (C; gói Enterprise thì được miễn phí). B mô tả gói Developer. D, TAM chỉ có ở Enterprise On-Ramp và Enterprise. E sai, Business có đầy đủ Trusted Advisor checks.", "6-3": "Amazon Cognito cho phép người dùng ứng dụng mobile và web đăng nhập bằng tài khoản Amazon, Apple, Facebook, Google. GuardDuty phát hiện mối đe doạ, Personalize là dịch vụ gợi ý, IAM quản lý người dùng nội bộ của tài khoản AWS.", "6-4": "CloudFormation cho phép tạo template định nghĩa toàn bộ tài nguyên dưới dạng code và tái sử dụng template cho nhiều dự án. Config theo dõi cấu hình, CloudTrail ghi log API, Auto Scaling thêm bớt máy.", "6-5": "Lợi ích của AWS: không cần đoán trước nhu cầu hạ tầng (D) và đổi chi phí đầu tư thành chi phí vận hành (E). A sai, vẫn cần giám sát. B sai, khách hàng vẫn lo phần tuân thủ của mình. C sai, AWS không làm phần cứng theo yêu cầu riêng.", "6-6": "Chạy SQL Server trên AWS: tự cài trên EC2 (B) hoặc dùng RDS for SQL Server (C). DMS chỉ di chuyển dữ liệu, không chạy CSDL. Fargate chạy container, Lambda chạy code.", "6-7": "Route 53 có health check, kiểm tra endpoint (ví dụ EC2) có hoạt động không và chuyển lưu lượng sang endpoint khác khi lỗi. ELB cũng có health check nhưng không nằm trong đáp án. CloudFormation tạo hạ tầng, Chime là ứng dụng họp, Aurora là CSDL.", "6-8": "Amazon Rekognition phân tích ảnh và video, trong đó có nhận diện khuôn mặt. Comprehend phân tích văn bản, Polly chuyển văn bản thành giọng nói, IAM quản lý quyền.", "6-9": "Neptune và RDS for MySQL là CSDL được AWS quản lý. SQL Server hay MySQL tự cài trên EC2 thì bạn tự quản lý. CloudSearch là dịch vụ tìm kiếm, không phải CSDL.", "6-10": "Thời gian xử lý không quan trọng, ưu tiên rẻ nhất, công việc định kỳ thì chọn Spot Instance (giảm tới 90%). Nếu bị ngắt thì chạy lại sau. Reserved cần chạy liên tục mới có lợi.", "6-11": "Chủ tài khoản AWS (hoặc người có quyền quản trị IAM trong tài khoản) cấp quyền cho các user. TAM, đội bảo mật AWS và kỹ sư support của AWS không cấp quyền trong tài khoản của bạn.", "6-12": "Server Migration Service (SMS) di chuyển số lượng lớn máy chủ on-prem lên AWS. Lưu ý: SMS đã ngừng, nay dùng AWS Application Migration Service (MGN). DMS chỉ di chuyển CSDL. Application Discovery Service chỉ lập kế hoạch. «File Transfer Acceleration» không tồn tại.", "6-13": "CloudFormation tự động cấp phát và cập nhật hạ tầng một cách an toàn, có kiểm soát (C), và mô hình hoá toàn bộ hạ tầng trong một file văn bản JSON hoặc YAML (D). A mô tả Elastic Beanstalk. B sai. E mô tả CodeBuild.", "6-14": "Hybrid (mô hình lai) kết nối hạ tầng và ứng dụng giữa cloud và tài nguyên không ở cloud (on-prem). Ba mô hình triển khai: Cloud, Hybrid, On-premises. «Mixed» không phải tên chuẩn.", "6-15": "Cần bản sao môi trường ở Region khác và sẵn sàng trong vài phút thì dùng CloudEndure Disaster Recovery (nay là AWS Elastic Disaster Recovery). CloudEndure Migration dùng để di chuyển, không phải DR. AWS Backup khôi phục chậm hơn nhiều. Glue là ETL.", "6-16": "Tài nguyên tĩnh của website thương mại điện tử phổ biến, truy cập thường xuyên và ổn định thì dùng S3 Standard. Standard-IA cho dữ liệu ít truy cập (có phí lấy dữ liệu). Intelligent-Tiering cho kiểu truy cập khó đoán. Deep Archive cho lưu trữ dài hạn.", "6-17": "Sao lưu ở vị trí địa lý khác thì đặt ở Region khác. AZ khác vẫn trong cùng vùng địa lý. VPC là mạng ảo, không phải vị trí. Edge location không dùng để lưu backup.", "6-18": "Với EC2, bạn phải thường xuyên vá hệ điều hành và ứng dụng (trách nhiệm của khách hàng). A sai, instance store mất dữ liệu khi stop. C sai, mọi AZ đều đáng tin, nên dùng nhiều AZ. D sai, theo dõi lệnh API là CloudTrail (Athena chỉ truy vấn log).", "6-19": "Cost Explorer dự báo chi phí tới 12 tháng tới dựa trên mức dùng trước đây. A là TCO Calculator hoặc Migration Evaluator. B là Pricing Calculator. C là tính năng của Organizations.", "6-20": "RDS Multi-AZ tự động failover sang bản standby ở AZ khác khi CSDL chính không phản hồi. Single-AZ không có dự phòng. «Write Replica» không tồn tại (chỉ có Read Replica). Snapshot là bản sao lưu.", "6-21": "Stop (dừng) EC2 khi không dùng thì không bị tính tiền compute, chỉ tính phí lưu ổ EBS, và có thể bật lại sau. Terminate sẽ xoá hẳn máy, mất môi trường dev. Xoá EBS làm mất dữ liệu.", "6-22": "Xoá access key của root nếu không cần là best practice. B sai, không dùng root cho công việc hằng ngày. C không phải biện pháp bảo mật. D sai, không bao giờ chia sẻ mật khẩu hay access key.", "6-23": "Giá EBS tính theo dung lượng ổ đã cấp phát mỗi tháng (A) và lượng dữ liệu lưu trong snapshot (C). Ngoài ra io1, io2, gp3 tính thêm IOPS, throughput đã cấp. Compute là phí của EC2. Snowball là dịch vụ khác.", "6-24": "Áp dụng nguyên tắc quyền tối thiểu: chỉ cấp đúng quyền cần thiết. Thay vì gắn policy riêng cho từng người (A), nên gom vào IAM group. C, không cấp quyền thì không làm việc được. D không phải khuyến nghị về phân quyền.", "6-25": "Chi phí lớn nhất thường đến từ compute (A) và dữ liệu truyền RA (D). Dữ liệu truyền VÀO AWS miễn phí. Số dịch vụ dùng và số IAM role không tính tiền.", "6-26": "Reserved, Standard, All Upfront được giảm giá nhiều nhất: Standard giảm nhiều hơn Convertible, và trả trước toàn bộ giảm nhiều hơn trả một phần hoặc không trả trước. A sai, không có On-demand convertible.", "6-27": "Có thể trả trước (Reserved Instance All hoặc Partial Upfront) để có giá theo giờ thấp hơn. A, đấu giá Spot đã bỏ từ 2017, nay giá Spot do AWS đặt. B không tồn tại. C sai, Dedicated không giảm 90% (đó là Spot).", "6-28": "Đáp án theo đề là A (dùng càng nhiều càng tiết kiệm). Định nghĩa chính thức của AWS: nhờ quy mô hàng trăm nghìn khách hàng, AWS có chi phí biến đổi thấp hơn và liên tục giảm giá, gần với C. Trong đề thi thật, nếu thấy cụm «lower variable cost / aggregated usage from hundreds of thousands of customers» thì đó là economies of scale. B sai. D là pay-as-you-go.", "6-29": "Auto Scaling tự động điều chỉnh số EC2 khớp với nhu cầu, xử lý đợt tăng đột biến khi flash sale. EC2 tự nó không tự mở rộng. EFS là file system, ElastiCache là bộ nhớ đệm.", "6-30": "Khách hàng có toàn quyền kiểm soát môi trường mạng ảo VPC: dải IP, subnet, route table, gateway. A là IAM. C sai, khách hàng tự cấu hình VPC. D là Well-Architected Tool.", "6-31": "TCO Calculator (nay là Migration Evaluator) so sánh chi phí môi trường on-prem với AWS, ai cũng dùng được, không cần tài khoản AWS. Cost Explorer và Budgets cần có tài khoản và dữ liệu sử dụng. Pricing Calculator chỉ ước tính giá AWS, không so sánh với on-prem.", "6-32": "AWS Config liên tục đánh giá tài nguyên có tuân thủ quy định cấu hình không. Trusted Advisor kiểm tra lỗ hổng bảo mật trong cấu hình (cổng mở, MFA chưa bật). Redshift là kho dữ liệu, MQ là message broker, Cognito lo đăng nhập.", "6-33": "AWS OpsWorks dùng Chef và Puppet để tự động cấu hình EC2 (dịch vụ đã ngừng từ 2024). CloudFormation tạo hạ tầng bằng template, Quick Starts là bản triển khai mẫu, CloudTrail ghi log API.", "6-34": "AWS CodeDeploy triển khai ứng dụng lên EC2, Lambda, ECS và cả máy chủ on-prem, phù hợp kiến trúc hybrid. Kinesis xử lý dữ liệu luồng, QuickSight là BI, Athena là truy vấn SQL trên S3.", "6-35": "RDS và EMR chạy trên máy chủ (instance) mà bạn chọn loại và kích cỡ. DynamoDB, Lambda và Fargate là serverless.", "6-36": "Kiểm thử xâm nhập (penetration test) là thử tấn công vào hệ thống của mình để tìm lỗ hổng bảo mật mà kẻ xấu có thể khai thác. A là kiểm tra hiệu năng, C là health check, D là test phần mềm.", "6-37": "EMR dùng để phân tích, xử lý lượng dữ liệu cực lớn nhanh chóng (C), và chạy, mở rộng dễ dàng Apache Spark, Hadoop cùng các framework big data khác (D). A là Glacier, B là Snowmobile, E là ECS hoặc EKS.", "6-38": "Liên hệ support qua chat cần tối thiểu gói Business. Developer chỉ có email trong giờ hành chính. Basic không có hỗ trợ kỹ thuật. Không có tính năng chat trả phí riêng.", "6-39": "Elastic Beanstalk giúp developer chưa có kinh nghiệm cloud triển khai và quản lý ứng dụng nhanh: chỉ cần tải code lên. Fargate cần hiểu về container. Batch chạy job. Personalize là dịch vụ gợi ý.", "6-40": "Pay-as-you-go thay chi phí đầu tư lớn ban đầu (CapEx) bằng các khoản thanh toán biến đổi nhỏ theo mức dùng. Các lựa chọn khác đảo ngược hoặc nói sai bản chất (cố định thay vì biến đổi).", "6-41": "Với RDS, AWS lo cài đặt CSDL (A) và quản lý hệ điều hành (C). Bảo vệ lưu lượng mạng, quản lý quyền truy cập và cấu hình tường lửa (security group) là việc khách hàng làm.", "6-42": "Dùng tag để nhóm tài nguyên (theo dự án, phòng ban) giúp phân tích chi phí qua cost allocation tags. CloudFormation tự động triển khai, không phân tích chi phí. Inspector quét lỗ hổng, không phân tích chi phí.", "6-43": "Truyền dữ liệu lớn hằng ngày, cần kết nối ổn định thì dùng Direct Connect (đường truyền riêng, băng thông ổn định). VPN đi qua internet nên không ổn định bằng. Snowmobile dùng cho một lần chuyển khổng lồ. Comprehend phân tích văn bản.", "6-44": "Storage Gateway tích hợp môi trường IT on-premises với lưu trữ cloud. A là Glue. B là Snow Family. D là CloudHSM.", "6-45": "Cần lấy backup ngay lập tức và chi phí thấp thì chọn S3 Standard-IA: rẻ hơn Standard và truy cập tức thì. Glacier (Flexible) và Deep Archive mất vài phút đến vài giờ để lấy. Instance Store mất dữ liệu khi stop. (Glacier Instant Retrieval cũng phù hợp nhưng không có trong đáp án.)", "6-46": "Global Accelerator định tuyến lưu lượng tới endpoint cho hiệu năng tốt nhất với người dùng toàn cầu, dựa trên vị trí, sức khoẻ và trọng số. Data Pipeline chuyển dữ liệu. DAX là cache cho DynamoDB. Transfer Acceleration chỉ tăng tốc upload lên S3.", "6-47": "Serverless rẻ hơn vì chỉ dùng và trả tiền tài nguyên khi code thực sự chạy, còn máy chủ thì chạy và tính tiền suốt cả khi rảnh. D đúng về tính năng nhưng không giải thích lý do kinh tế bằng B. C sai.", "6-48": "Route 53 dùng để cấu hình và quản lý DNS (C), và quản lý lưu lượng toàn cầu bằng nhiều chính sách định tuyến (D): weighted, latency, failover, geolocation… A là Direct Connect, B là Config, E là Trusted Advisor.", "6-49": "200 TB thì dùng vài thiết bị Snowball là tiết kiệm nhất. Snowmobile dành cho hàng chục petabyte trở lên. Import/Export là dịch vụ cũ đã được thay bằng Snowball. DMS di chuyển CSDL qua mạng.", "6-50": "ElastiCache for Redis lưu dữ liệu trong RAM, độ trễ dưới mili giây, phù hợp ứng dụng IoT thời gian thực. Redshift và Athena dùng để phân tích (độ trễ cao hơn nhiều). Cloud9 là IDE.", "7-1": "Bảo vệ dữ liệu nhạy cảm trên S3: bật mã hoá S3 (server-side encryption, C) hoặc tự mã hoá dữ liệu trước khi tải lên (client-side encryption, D). A sai, xoá khoá thì không giải mã được dữ liệu nữa. B sai, mã hoá là trách nhiệm của khách hàng. E làm mọi người mất quyền truy cập.", "7-2": "CodeBuild biên dịch code, chạy test và tạo gói phần mềm. CodeDeploy triển khai ứng dụng, CodeCommit lưu mã nguồn Git, CloudEndure là dịch vụ di chuyển và khôi phục thảm họa.", "7-3": "Phí lưu trữ S3 phụ thuộc vào lớp lưu trữ (Standard, IA, Glacier…) (C) và tổng dung lượng các object (E). Mã hoá mặc định với SSE-S3 không tốn thêm phí. Tạo hay xoá bucket miễn phí. EBS không liên quan S3.", "7-4": "CloudFront cache nội dung tại edge location, tăng tính sẵn sàng (B) và phân phối nội dung tới người dùng với độ trễ thấp (E). A là CloudTrail, C là các dịch vụ DR, D là Glacier.", "7-5": "Amazon Connect là tổng đài chăm sóc khách hàng (contact center) trên cloud. Lightsail là máy chủ ảo đơn giản, Direct Connect là đường truyền mạng riêng (chỉ trùng chữ «Connect»), Elastic Beanstalk triển khai ứng dụng.", "7-6": "Cost & Usage Report hiển thị chi tiết chi phí AWS đã phát sinh trong tài khoản. TCO không phải dashboard trong tài khoản, mà là công cụ so sánh trước khi chuyển. CloudWatch logs và VPC dashboard không hiển thị chi phí. (Cost Explorer và Billing dashboard cũng xem được.)", "7-7": "Có 2 loại Reserved Instance: Standard (giảm giá nhiều nhất, không đổi được dòng máy) và Convertible (đổi được, giảm ít hơn). Spot là kiểu mua riêng, không phải loại RI. Expedited và Bulk là tuỳ chọn lấy dữ liệu của Glacier.", "7-8": "AWS Artifact cho phép tải mọi báo cáo và chứng nhận do kiểm toán viên cấp cho AWS (SOC, ISO, PCI). Config theo dõi cấu hình, CloudWatch giám sát, CloudTrail ghi log API.", "7-9": "Resource Groups gom tài nguyên theo tag (ví dụ Env=dev, Env=prod) thành nhóm, tạo «console riêng» để xem và quản lý từng môi trường dễ dàng. Placement Group là cách sắp xếp EC2 trên phần cứng. Tag Editor chỉ dùng để sửa tag.", "7-10": "CloudWatch thu thập số liệu (metrics) từ EC2 đang chạy như CPU, mạng, đọc ghi ổ đĩa. Inspector quét lỗ hổng, CloudFormation tạo hạ tầng, CloudTrail ghi log API.", "7-11": "X-Ray truy vết request để tìm thành phần nào làm chậm ứng dụng, từ đó cải thiện hiệu năng. Detective và Security Hub phục vụ bảo mật. Shield chống DDoS.", "7-12": "Fargate (chạy container không cần máy chủ) và Lambda (chạy code theo sự kiện) là serverless. EC2 và EMR chạy trên instance bạn quản lý. ECS có thể chạy trên EC2 (không serverless) hoặc Fargate.", "7-13": "Dedicated Host là máy chủ vật lý chỉ dành riêng cho bạn, đáp ứng yêu cầu tuân thủ về phần cứng chuyên dụng. Reserved, Spot, On-demand là cách tính tiền, mặc định vẫn dùng phần cứng chung.", "7-14": "Architecture Optimization (tối ưu kiến trúc) là thường xuyên tinh chỉnh workload để tận dụng tài nguyên hiện có và giảm chi phí, ví dụ right-sizing, chuyển sang serverless. Tagging Enforcement là bắt buộc gắn tag. Budgeting Processes là lập ngân sách. Resource Controls là giới hạn tài nguyên được tạo.", "7-15": "Giao dịch ACID (đảm bảo tính nhất quán khi chuyển tiền) cần CSDL quan hệ, nên chọn RDS. Redshift là kho phân tích, CloudHSM lưu khoá mã hoá, DMS di chuyển CSDL.", "7-16": "IAM policy là tài liệu quyền, có thể gắn trực tiếp vào IAM user. Group dùng để gom user. Role dùng cho quyền tạm thời. «IAM Identity» là khái niệm chung, không phải thứ để gắn quyền.", "7-17": "Nhu cầu thay đổi nhiều thì AWS cho phép tạo và xoá EC2 theo nhu cầu, chỉ trả tiền khi dùng. Data center truyền thống phải mua đủ máy cho lúc cao điểm, lúc thấp điểm để không. A, B, D đúng nhưng không giải quyết đúng vấn đề nhu cầu thay đổi.", "7-18": "RDS hỗ trợ PostgreSQL, MySQL, MariaDB, Oracle, SQL Server, Db2 và Aurora. Teradata (một hệ kho dữ liệu) không được hỗ trợ.", "7-19": "AWS DMS (Database Migration Service) di chuyển CSDL on-premises lên AWS. Transfer Acceleration tăng tốc upload lên S3. Directory Service là AD. Transit Gateway kết nối mạng.", "7-20": "Lightsail có sẵn bản WordPress cài đặt sẵn, bấm vài lần là chạy, phù hợp người mới. Tự cài trên EC2 phức tạp hơn. S3 chỉ host website tĩnh, không chạy được WordPress (cần PHP và CSDL). CDK là công cụ IaC, không host website.", "7-21": "Quản lý khoá mã hoá dùng AWS KMS (dịch vụ quản lý khoá) hoặc CloudHSM (thiết bị phần cứng chuyên dụng lưu khoá, bạn toàn quyền kiểm soát). Certificate Manager quản lý chứng chỉ SSL chứ không phải khoá mã hoá dữ liệu. CodeDeploy và CodeCommit là công cụ phát triển.", "7-22": "EC2 cho phép bạn tự cài và chạy bất kỳ phần mềm CSDL nào, kể cả loại RDS không hỗ trợ. RDS chỉ hỗ trợ các engine có sẵn. Cognito lo đăng nhập, Inspector quét lỗ hổng.", "7-23": "Auto Scaling tự điều chỉnh số lượng tài nguyên (EC2, cũng như ECS, DynamoDB…) theo tải thực tế. ELB chỉ chia tải. Route 53 là DNS. ECS chạy container nhưng tự nó không điều chỉnh theo tải.", "7-24": "IAM quản lý danh tính và quyền truy cập trên AWS, tương đương vai trò của đội quản lý danh tính on-prem. Outposts là AWS tại chỗ, Redshift là kho dữ liệu. «AWS Federation» là một tính năng, không phải dịch vụ riêng.", "7-25": "Nguyên tắc thiết kế cloud: liên kết lỏng thay vì liên kết chặt (B), và coi tài nguyên là thứ dùng xong bỏ (disposable) thay vì máy chủ cố định (D). A sai, chọn theo nhu cầu. C sai, nên ưu tiên managed service. E sai, tùy yêu cầu mà chọn Multi-AZ hay Multi-Region.", "7-26": "IAM Credential Report liệt kê mọi user trong tài khoản cùng trạng thái thông tin đăng nhập: mật khẩu, access key, MFA, lần dùng gần nhất. CloudTrail ghi log hoạt động, Artifact là báo cáo tuân thủ của AWS, Cost and Usage Report là chi phí.", "7-27": "CloudHSM cho phép tạo và dùng khoá mã hoá của riêng bạn trên thiết bị phần cứng chuyên dụng (HSM). Shield chống DDoS, Certificate Manager quản lý chứng chỉ SSL, WAF là tường lửa web. (KMS cũng tạo được khoá nhưng không có trong đáp án.)", "7-28": "Dư thừa và chịu lỗi cao nhất là triển khai trên nhiều AZ ở nhiều Region. A sai, khách hàng phải tự thiết kế dự phòng. B là kém nhất. C tốt nhưng không bằng nhiều Region.", "7-29": "S3 và DynamoDB tự động sao chép dữ liệu qua nhiều AZ. Instance Store là ổ tạm của một máy. Route 53 là DNS toàn cầu, không lưu dữ liệu của bạn. VPN là kết nối mạng.", "7-30": "Chi phí CloudFront phụ thuộc số lượng request (A) và phân bố lưu lượng, tức người dùng ở khu vực nào vì giá mỗi vùng khác nhau (B), cùng lượng dữ liệu truyền ra. Volume, instance type và storage class không liên quan CloudFront.", "7-31": "AWS Acceptable Use Policy (Chính sách sử dụng chấp nhận được) nêu rõ những hành vi bị cấm khi dùng dịch vụ AWS (spam, tấn công, nội dung phi pháp…). SCP giới hạn quyền tài khoản, Artifact là báo cáo tuân thủ, Budgets là ngân sách.", "7-32": "Security Bulletins (bản tin bảo mật) và AWS Security Blog miễn phí cho mọi người. TAM chỉ có ở gói Enterprise. Support API cần gói Business trở lên. Classroom Training (học có giảng viên) phải trả phí.", "7-33": "Bật S3 Versioning: khi xoá hoặc ghi đè, bản cũ vẫn được giữ, khôi phục được. Bucket policy kiểm soát quyền nhưng không giữ bản cũ. Lifecycle policy chuyển hoặc xoá object theo thời gian. Tắt CRR không giúp gì.", "7-34": "AWS chịu trách nhiệm bảo vệ hạ tầng toàn cầu: Region, AZ và edge location. Kiểm toán ứng dụng của bạn, giám sát mức dùng tài nguyên và bảo mật quyền truy cập tài nguyên là việc của khách hàng.", "7-35": "Gói Basic và Developer chỉ có các kiểm tra Trusted Advisor cốt lõi (core checks: một số kiểm tra bảo mật và service quotas). Business, Enterprise On-Ramp và Enterprise có đầy đủ mọi kiểm tra.", "7-36": "Đáp án theo đề là D. Lý do: ứng dụng mobile không gọi Lambda trực tiếp một cách an toàn mà thường qua API Gateway hoặc dùng SDK với quyền từ Cognito. B có thể gây tranh cãi vì «resizable compute capacity» là cụm từ mô tả EC2, nhưng Lambda cũng cho chọn dung lượng bộ nhớ. A và C chắc chắn là lợi ích của Lambda.", "7-37": "AWS có nhiều chứng nhận đảm bảo (assurance) phổ biến như ISO 9001, ISO 27001, SOC, PCI DSS, và hỗ trợ khách hàng tuân thủ HIPAA. B sai, khách hàng tự chịu trách nhiệm tuân thủ luật áp dụng cho mình. A sai. D không chính xác bằng C.", "7-38": "DynamoDB là dịch vụ được quản lý: AWS lo việc mở rộng hạ tầng bên dưới (có thể tự động với chế độ on-demand hoặc auto scaling). Đội của bạn không phải mở rộng máy chủ.", "7-39": "Amazon Elastic Transcoder chuyển đổi file media sang định dạng phù hợp với điện thoại, TV, máy tính bảng (nay khuyến nghị dùng AWS Elemental MediaConvert). Pinpoint gửi thông báo marketing, S3 lưu trữ, Rekognition phân tích ảnh và video.", "7-40": "AWS Organizations kiểm soát quyền truy cập dịch vụ AWS qua SCP (A) và gộp hoá đơn cho nhiều tài khoản (E). B là AWS CAF. C, phương thức thanh toán quản lý ở Billing console. D là Professional Services.", "7-41": "Amazon Redshift là dịch vụ kho dữ liệu (data warehouse) trên cloud. RDS là CSDL quan hệ cho ứng dụng (OLTP), không tối ưu cho kho phân tích. Shield chống DDoS, Comprehend phân tích văn bản.", "7-42": "AWS Marketplace là chợ số nơi mua phần mềm và dịch vụ của bên thứ ba chạy trên AWS. Application Discovery Service lập kế hoạch di chuyển. DevPay là dịch vụ cũ đã ngừng. Resource Groups gom tài nguyên.", "7-43": "CodeCommit là kho mã nguồn Git do AWS quản lý: lưu trữ, quản lý phiên bản code (đã ngừng nhận khách mới từ 2024). CodePipeline là CI/CD, X-Ray truy vết request, Inspector quét lỗ hổng.", "7-44": "Route 53 với chính sách định tuyến theo độ trễ (latency-based) hoặc vị trí (geolocation, geoproximity) đưa người dùng tới Region gần nhất. Cognito lo đăng nhập, Systems Manager quản lý máy chủ, Cloud9 là IDE.", "7-45": "Federation (liên kết danh tính) cho phép đăng nhập AWS bằng tài khoản công ty sẵn có (Active Directory, SAML) mà không cần tạo IAM user mới. Access key dùng cho CLI, IAM permissions là quyền, WAF rules lọc request web.", "7-46": "Khách hàng thừa hưởng hoàn toàn (fully inherit) từ AWS kiểm soát bảo mật data center (C) và kiểm soát môi trường (D, như điện, cháy nổ, nhiệt độ). Đào tạo nhận thức và quản lý cấu hình là kiểm soát chung (shared). Communications controls là kiểm soát riêng của khách hàng.", "7-47": "Địa chỉ status.aws.amazon.com là trang Service Health Dashboard, hiển thị tình trạng mọi dịch vụ AWS (nay chuyển hướng sang health.aws.amazon.com, AWS Health Dashboard).", "7-48": "Giảm độ trễ khi người dùng lấy dữ liệu: đặt media ở Region gần người dùng nhất (A), và lưu trên S3 rồi phân phối qua CloudFront để cache gần người dùng (E). B và C không giảm độ trễ cho người dùng ở xa. D, giảm kích thước file có giúp phần nào nhưng không phải cách chính.", "7-49": "7 nguyên tắc thiết kế bảo mật của Well-Architected có: dùng IAM role với quyền tạm thời thay cho thông tin đăng nhập dài hạn (B, thuộc nguyên tắc «strong identity foundation»), và bật khả năng truy vết theo thời gian thực (D). A sai, nên tự động hoá. C thuộc Reliability. E sai, có thể lưu dữ liệu nhạy cảm nếu bảo vệ đúng cách.", "7-50": "Gắn cost allocation tag (ví dụ Department=Sales, Project=UDOM) giúp phân loại và theo dõi chi phí theo phòng ban, dự án. Pricing Calculator chỉ ước tính. Aurora là CSDL. Price List API trả về bảng giá, không phải hoá đơn.", "8-1": "Security group gắn vào RDS kiểm soát dải IP (hoặc security group khác) nào được kết nối tới CSDL. A là IAM và KMS, C là ACM, D là Load Balancer.", "8-2": "Kiểu khởi chạy EC2 của ECS chạy container trên các EC2 bạn tự quản lý, nên có toàn quyền xem và kiểm soát cụm máy chủ. Fargate là serverless, bạn không thấy máy chủ. Lightsail và Lambda không phải kiểu khởi chạy của ECS.", "8-3": "Gộp các tài khoản vào AWS Organization và dùng Consolidated Billing: mức dùng được cộng dồn để hưởng giá theo khối lượng và chia sẻ RI, Savings Plans, nên giảm chi phí. A không giảm chi phí tài nguyên. C chỉ theo dõi. D không tồn tại.", "8-4": "Lưu lượng vào và ra EC2 được kiểm soát bởi Security Group (cấp instance) và Network ACL (cấp subnet), nên phải kiểm tra cả hai. Subnet và Internet Gateway không lọc lưu lượng. Traffic Manager không phải tính năng của VPC.", "8-5": "Gói Business có đầy đủ kiểm tra Trusted Advisor (A) và AWS Support API (D). Concierge, phản hồi dưới 15 phút và TAM chủ động chỉ có ở gói Enterprise.", "8-6": "Elastic Beanstalk tự động triển khai và mở rộng ứng dụng: tải code lên, nó dựng EC2, load balancer, Auto Scaling. S3 và EFS là lưu trữ. CodeCommit lưu mã nguồn.", "8-7": "Phần mềm CSDL tự cài trên EC2 thì khách hàng phải tự vá. A sai, khách hàng quản lý OS của EC2. C sai, khách hàng chọn và cấu hình mã hoá. D sai, bảo mật ứng dụng là việc của khách hàng.", "8-8": "EC2 giúp cải thiện khả năng chịu lỗi (dễ chạy nhiều máy trên nhiều AZ, thay máy hỏng nhanh) (A), và mở rộng nhanh hơn nhiều so với mua máy chủ thật (E). B không phải lợi ích đặc trưng. C là việc của Security Group. D sai, EC2 không tự sao lưu dữ liệu.", "8-9": "Với pay-as-you-go, không có phí trả trước (A), và chỉ trả cho dịch vụ cần dùng, không cần hợp đồng dài hạn (C). B sai, bạn phải lo bản quyền phần mềm bên thứ ba. D sai, AWS không có phí khởi tạo. E sai, AWS có reservation (RI, Savings Plans).", "8-10": "AWS Control Tower là cách dễ nhất để thiết lập và quản lý môi trường nhiều tài khoản an toàn, đúng chuẩn (landing zone, guardrails). Macie tìm dữ liệu nhạy cảm, Patch Manager vá OS, Security Hub tổng hợp cảnh báo bảo mật.", "8-11": "CloudWatch Alarm theo dõi CPU và gửi cảnh báo khi CPU từ 60% trở lên. CloudFront là CDN. Config không theo dõi CPU. SNS chỉ gửi thông báo, không giám sát (thường được CloudWatch Alarm kích hoạt).", "8-12": "CSDL tự chạy trên EC2, dữ liệu thay đổi liên tục thì lưu trên EBS (ổ đĩa khối bền vững, gắn vào EC2). RDS và DynamoDB là dịch vụ CSDL riêng, không phải nơi lưu cho CSDL trong EC2. C sai, chạy CSDL trên EC2 được.", "8-13": "CloudWatch giám sát ứng dụng và hạ tầng: số liệu, log, cảnh báo, dashboard. CloudSearch là tìm kiếm, EMR xử lý big data, CloudHSM lưu khoá mã hoá.", "8-14": "Phí Lambda tính theo số lần gọi hàm (B) và thời gian tính toán (thời gian chạy nhân bộ nhớ cấp phát) (E). Lambda không có volume hay placement group.", "8-15": "IAM user gắn với một người duy nhất, còn role ai cần thì có thể đảm nhận (assume) (A). User có thông tin đăng nhập lâu dài, role có thông tin đăng nhập tạm thời (B). C sai, cả hai đều miễn phí. D và E đảo ngược.", "8-16": "Giảm phí EBS: xoá snapshot không cần thiết (C), và đổi loại ổ phù hợp hơn, ví dụ io1 sang gp3, gp2 sang gp3 (D). Bucket thuộc S3. EBS không có reservation. Chia request cho nhiều ổ không giảm chi phí.", "8-17": "GuardDuty liên tục giám sát hạ tầng AWS và phát hiện mối đe doạ như kẻ tấn công dò quét (reconnaissance) hay tài khoản bị chiếm quyền. A không phải chức năng của GuardDuty. C là Detective. D là Trusted Advisor.", "8-18": "Cần «join» (nối bảng) hay giao dịch phức tạp thì dùng CSDL quan hệ, tức RDS. DocumentDB và DynamoDB là NoSQL. Outposts là hạ tầng AWS tại chỗ.", "8-19": "Gắn tag giúp phân loại, quản lý và lọc tài nguyên (theo dự án, môi trường, chủ sở hữu). CloudWatch giám sát, Service Catalog là danh mục sản phẩm, Directory Service là AD.", "8-20": "Glacier (Flexible Retrieval và Deep Archive) không lấy dữ liệu ngay lập tức, mất từ vài phút đến vài giờ. A sai, không bắt buộc nén. B sai, Glacier không dành cho dữ liệu truy cập thường xuyên. D sai, Glacier không gắn vào EC2. Lưu ý: Glacier Instant Retrieval mới ra sau này thì lấy được ngay.", "8-21": "AWS Batch chạy dễ dàng hàng nghìn job xử lý theo lô, tự cấp phát tài nguyên phù hợp. EC2 thì phải tự quản lý. Lambda@Edge chạy code tại edge location. Fargate chạy container.", "8-22": "Tăng khả năng chịu lỗi bằng cách triển khai trên nhiều AZ: một AZ hỏng thì AZ khác vẫn chạy. A, nhiều EC2 cùng một AZ vẫn sập chung. C ngược lại best practice. D, nhiều subnet có thể vẫn cùng một AZ.", "8-23": "Gói Business và Enterprise có hỗ trợ kỹ sư 24/7 qua email, điện thoại và chat. Developer chỉ có email trong giờ hành chính. Premium và Standard không phải tên gói của AWS.", "8-24": "IAM user và root user có thể có access key ID và secret access key dài hạn. Role chỉ cấp thông tin tạm thời. Group không có thông tin đăng nhập. TAM là người của AWS. Lưu ý: best practice là không tạo access key cho root.", "8-25": "Loose coupling cho phép sửa từng thành phần hay dịch vụ mà không ảnh hưởng thành phần khác. A sai, vẫn cần quản lý thay đổi. B là tính năng S3. C là nguyên tắc quyền tối thiểu.", "8-26": "EFS cung cấp throughput cao và nhiều EC2 (node tính toán) dùng chung đồng thời, phù hợp ứng dụng big data. EBS thường gắn một EC2. Storage Gateway dùng cho hybrid. S3 là object storage, không gắn làm file system.", "8-27": "Mô hình Cloud (all-in cloud) loại bỏ nhu cầu tự vận hành data center vật lý. On-premises thì vẫn cần. IaaS và PaaS là mô hình dịch vụ, không phải mô hình triển khai.", "8-28": "AWS Marketplace có nhiều lựa chọn giá linh hoạt: theo giờ, theo tháng, theo năm, BYOL (D), và cung cấp phần mềm chạy trên AWS (E; nhiều sản phẩm cũng dùng được ở môi trường khác). A không đúng. B không phải lợi ích riêng. C sai, Marketplace không bán EC2 rẻ hơn.", "8-29": "EBS tự sao chép trong cùng AZ để chống hỏng phần cứng, tức là tăng độ bền dữ liệu (durability). Elasticity là co giãn. Traceability là truy vết. Accessibility là khả năng truy cập.", "8-30": "Chỉ chạy một cuối tuần và không được gián đoạn thì dùng On-Demand. Savings Plans và Reserved cần cam kết 1 đến 3 năm. Spot có thể bị thu hồi bất cứ lúc nào.", "8-31": "CloudFront tích hợp với Shield (chống DDoS tầng mạng) và WAF (chống tấn công tầng ứng dụng), bảo vệ ở edge location. EFS là file system, Secrets Manager lưu mật khẩu, Systems Manager quản lý máy chủ.", "8-32": "Mã hoá ổ EBS dùng khoá từ AWS KMS. WAF là tường lửa web, Macie tìm dữ liệu nhạy cảm, GuardDuty phát hiện mối đe doạ.", "8-33": "Ngay lập tức: xoay vòng (đổi) mọi access key (D), và đổi email, mật khẩu root rồi bật MFA (E). A không bảo vệ gì. B làm gián đoạn mọi người. C sai, theo dõi lệnh API là CloudTrail chứ không phải CloudWatch.", "8-34": "ElastiCache là dịch vụ lưu dữ liệu trong RAM (A), giúp cải thiện hiệu năng ứng dụng web nhờ đọc nhanh (C). B là CloudFront. D sai, không có «cache tương thích Chef». E là ELB.", "8-35": "Tận dụng tính co giãn để tiết kiệm: dùng EC2 Auto Scaling, tự thêm bớt máy theo nhu cầu (B), và dùng serverless, chỉ trả khi chạy (E). Multi-AZ, Region khác và ELB giúp tăng tính sẵn sàng, không phải co giãn để tiết kiệm.", "8-36": "On-Demand giúp không phải mua dư máy dự phòng cho lúc cao điểm (C), và tăng giảm năng lực tính toán tùy nhu cầu (E). A sai, không miễn phí. B sai, Spot và RI rẻ hơn. D sai, khởi tạo trong vài phút.", "8-37": "AZ là một vị trí riêng biệt trong Region, được cách ly để không bị ảnh hưởng bởi sự cố ở các AZ khác. A sai, AZ có thể gồm nhiều data center. B sai, AZ nằm trong một Region, không trải nhiều quốc gia. C là VPC.", "8-38": "AWS hỗ trợ khôi phục thảm họa bằng cách cho phép triển khai hạ tầng ở nhiều Region. Edge location dùng cho CDN. Thiết bị vận chuyển (Snow) và gói support không phải nền tảng DR.", "8-39": "Khách hàng phải cấu hình dịch vụ AWS đúng chuẩn PCI DSS (B), và hạn chế truy cập dữ liệu chủ thẻ, đặt chính sách bảo mật thông tin cho nhân sự (C). A sai, không phải mọi dịch vụ đều PCI compliant và tuân thủ còn phụ thuộc cách bạn dùng. D và E (hạ tầng, an ninh vật lý) là việc của AWS.", "8-40": "S3 có dung lượng gần như không giới hạn cho mỗi tài khoản. 5 TB là kích thước tối đa của MỘT object, không phải tổng dung lượng.", "8-41": "Trụ cột Performance Efficiency đưa khuyến nghị chọn đúng loại tài nguyên tính toán (instance, container, serverless) theo yêu cầu workload. Operational Excellence nói về vận hành và cải tiến. Security về bảo mật. Reliability về phục hồi khi lỗi.", "8-42": "CloudFront phân phối dữ liệu, video, ứng dụng và API tới người dùng toàn cầu với độ trễ thấp và tốc độ cao. Route 53 là DNS, Connect là tổng đài, EC2 là máy chủ ảo.", "8-43": "Đáp án theo đề là D (xin AWS cho phép trước). Lưu ý quan trọng: đây là quy định CŨ. Từ năm 2019, AWS không cần xin phép trước khi pen test các dịch vụ trong danh sách cho phép (EC2, RDS, Lambda…), giống Đề 2 câu 12. Nếu đề thi thật có đáp án «không cần xin phép với các dịch vụ được phép» thì chọn đáp án đó.", "8-44": "Cost and Usage Report cho dữ liệu chi tiết nhất về hoá đơn (theo giờ, theo tài nguyên, theo tag). Cost Explorer và Billing dashboard là xem tổng quan. Budgets là đặt ngân sách và cảnh báo.", "8-45": "Availability Zone gồm một hoặc nhiều data center riêng biệt, mỗi cái có điện, mạng và kết nối dự phòng, đặt ở các toà nhà riêng. Region chứa nhiều AZ. Edge location dùng cho CloudFront.", "8-46": "Để có tính sẵn sàng cao, triển khai trên tối thiểu 2 AZ, để một AZ hỏng thì AZ còn lại vẫn phục vụ.", "8-47": "Nhiều Region trên thế giới là ví dụ của hạ tầng toàn cầu (global infrastructure), giúp triển khai gần người dùng. Agility là nhanh nhẹn, elasticity là co giãn, pay-as-you-go là cách tính tiền.", "8-48": "Amazon EC2 cho phép tự tay tạo instance theo cấu hình CPU, RAM cần thiết. EBS là ổ đĩa, S3 là lưu trữ, ECS chạy container (có thể tạo EC2 nhưng không phải dịch vụ dùng để tạo instance).", "8-49": "Mẫu thiết kế sẵn sàng cao: thiết kế ứng dụng chịu được việc bất kỳ thành phần đơn lẻ nào bị hỏng (không có điểm lỗi duy nhất). A liên quan hiệu năng. B gây lãng phí, nên dùng Auto Scaling. D là kiến trúc nguyên khối, dễ sập toàn bộ.", "8-50": "Với nhu cầu thay đổi, AWS tiết kiệm nhờ tính co giãn, tự tăng giảm tài nguyên (C), và trả tiền theo mức dùng (D). Sẵn sàng cao, mô hình bảo mật chung và độ tin cậy không trực tiếp làm giảm chi phí.", "9-1": "AWS Quick Start (nay là AWS Partner Solutions) là các bản triển khai tham chiếu dựng sẵn, giúp triển khai nhanh các giải pháp IT phổ biến và dùng ngay. Well-Architected Framework là tài liệu nguyên tắc, không triển khai gì. CloudFront là CDN. CodeCommit lưu mã nguồn.", "9-2": "RDS đơn giản hoá việc quản trị CSDL quan hệ: AWS lo cài đặt, vá lỗi, sao lưu. B sai, 11 số 9 là độ bền của S3, và số trong đáp án còn sai. C sai, RDS không tự đổi cỡ instance. D sai, phải tự đổi loại instance.", "9-3": "Chạy CSDL quan hệ do khách hàng tự quản lý thì dùng EC2 (tự cài và quản lý phần mềm CSDL). Route 53 là DNS, ElastiCache là bộ nhớ đệm, DynamoDB là NoSQL được AWS quản lý.", "9-4": "Tăng tính sẵn sàng bằng cách đặt các EC2 ở nhiều AZ trong một Region. B, cùng một AZ thì sập chung. C sai vì một AZ thuộc về một Region duy nhất. D, Spot có thể bị thu hồi nên không tăng tính sẵn sàng.", "9-5": "IAM policy (cùng bucket policy) giới hạn người dùng nào được truy cập bucket S3. Key pair dùng để SSH. Inspector quét lỗ hổng. Security Group lọc lưu lượng mạng cho instance, không áp dụng cho S3.", "9-6": "Kết nối VPC với data center on-premises dùng VPN (qua internet, mã hoá) hoặc Direct Connect (đường truyền riêng). Redshift là kho dữ liệu, API Gateway tạo API.", "9-7": "CloudWatch giám sát CPU và các số liệu khác. CloudTrail ghi log API, VPC Flow Logs ghi lưu lượng mạng, Config theo dõi cấu hình.", "9-8": "Cập nhật firmware của máy chủ vật lý chạy EC2 là trách nhiệm của AWS. Cấp quyền truy cập, mã hoá dữ liệu khi truyền và cập nhật OS của EC2 là việc của khách hàng.", "9-9": "Diễn đàn (nay là re:Post), blog và whitepaper bảo mật đều miễn phí. Gọi AWS Support cần gói trả phí (Business trở lên). Professional Services có phí. Lớp học ở trường đại học cũng tốn phí.", "9-10": "S3 có thể host website tĩnh với chi phí thấp. Glacier là lưu trữ dài hạn, không truy cập ngay. DynamoDB là CSDL. EFS là file system gắn EC2, không host web trực tiếp.", "9-11": "Quản lý edge location là trách nhiệm hoàn toàn của AWS. Bảo mật ứng dụng và dữ liệu phía client là của khách hàng. Quản lý bản vá là trách nhiệm chung (shared).", "9-12": "6 trụ cột của Well-Architected gồm: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability. Nhiều AZ, mã hoá và high availability là kỹ thuật hoặc đặc tính, không phải tên trụ cột.", "9-13": "Trusted Advisor có mục kiểm tra security group cho phép truy cập không giới hạn (0.0.0.0/0) vào các cổng nhạy cảm. Inspector quét lỗ hổng trên EC2. CloudWatch giám sát hiệu năng. CloudTrail ghi log API.", "9-14": "Khi tái kiến trúc ứng dụng nguyên khối: áp dụng liên kết lỏng (C) và thiết kế để mở rộng được (E). Giám sát thủ công, máy chủ cố định và phụ thuộc vào từng thành phần đơn lẻ đều ngược best practice.", "9-15": "Áp dụng tính co giãn (elasticity) là nguyên tắc thiết kế chính: tăng giảm tài nguyên theo nhu cầu. A và B gây lãng phí. C, Scrum là quy trình phát triển phần mềm, không phải nguyên tắc kiến trúc cloud.", "9-16": "CSDL tự cài trên EC2 thì dùng Systems Manager (Patch Manager) để tự động vá theo lịch, hiệu quả nhất. A làm tay, tốn công. B sai, tính năng tự vá của RDS chỉ áp dụng cho RDS, không cho EC2. C, Config chỉ kiểm tra tuân thủ, không vá.", "9-17": "AWS SDK cho phép developer gọi dịch vụ AWS từ trong code ứng dụng. Console là giao diện web, CodePipeline là CI/CD, Config theo dõi cấu hình.", "9-18": "Tính toán co giãn (elastic computing) giảm TCO vì chỉ dùng và trả cho tài nguyên khi cần. Mô hình trách nhiệm chung và mã hoá liên quan bảo mật. Single tenancy (phần cứng riêng) làm tăng chi phí.", "9-19": "AWS giúp tập trung vào hoạt động tạo ra doanh thu thay vì lo vận hành data center. A sai, «bảo mật dễ dãi» không phải lợi ích. C và D sai, khách hàng không kiểm soát hay chọn phần cứng mạng của AWS.", "9-20": "5 nhóm kiểm tra của Trusted Advisor: Cost Optimization, Performance, Security, Fault Tolerance, Service Limits (Service Quotas). Instance Usage, Infrastructure và Storage Capacity không phải tên nhóm.", "9-21": "CloudWatch là kho số liệu (metrics) với ngưỡng cảnh báo và kênh thông báo tùy chỉnh (alarm qua SNS…). A là CodeCommit. C gần với GuardDuty hoặc Security Hub. D là WAF.", "9-22": "Khách hàng chịu trách nhiệm mã hoá phía client (B) và cấu hình Network ACL (D). Vá OS của RDS, đào tạo nhân viên data center và kiểm soát môi trường data center là việc của AWS.", "9-23": "Quản lý bản vá là kiểm soát chung: AWS vá hạ tầng, khách hàng vá OS và ứng dụng của mình. Kiểm soát vật lý, bảo mật zone và kiểm toán data center là việc của AWS.", "9-24": "AWS Billing and Cost Management là nơi thanh toán hoá đơn, theo dõi mức dùng và ngân sách (gồm Bills, Cost Explorer, Budgets…). Consolidated billing là một tính năng gộp hoá đơn. CloudWatch giám sát. QuickSight là BI.", "9-25": "Nhờ lợi thế quy mô khổng lồ, AWS vận hành hiệu quả hơn và định kỳ giảm giá cho khách hàng. Đây là định nghĩa chuẩn của economies of scale. B, C, D là lợi ích khác, không phải do quy mô.", "9-26": "Consolidated billing cộng dồn mức dùng của các tài khoản thành viên để đạt các bậc giá theo khối lượng (usage tiers). SCP giới hạn quyền. All Upfront RI là cách mua. Cost Explorer xem chi phí.", "9-27": "Mở rộng kiến trúc on-premises lên AWS: Storage Gateway (lưu trữ hybrid) và Direct Connect (kết nối mạng riêng). EBS là ổ đĩa trong AWS, Connect là tổng đài, CloudFront là CDN.", "9-28": "Elastic Load Balancing tự mở rộng năng lực của chính nó khi lưu lượng web tăng. CodePipeline là CI/CD, EBS phải tự chỉnh dung lượng, Direct Connect có băng thông cố định.", "9-29": "S3 là object storage, dung lượng gần như không giới hạn, độ bền cao (11 số 9). Redshift là kho dữ liệu, EFS là file storage, ECS chạy container.", "9-30": "Availability Zone là tính năng dùng để đạt tính sẵn sàng cao: chạy ứng dụng trên nhiều AZ. Direct Connect là kết nối mạng. Khách hàng không chọn data center trực tiếp. VPC là mạng ảo.", "9-31": "Chặn request từ một mạng cụ thể: WAF chặn theo IP hoặc dải IP ở tầng ứng dụng (A), và Network ACL có quy tắc deny chặn IP ở cấp subnet (E). Trusted Advisor, Direct Connect và Organizations không chặn lưu lượng.", "9-32": "Liên kết lỏng các thành phần là nguyên tắc thiết kế cloud. A sai, nên scale out (ngang) thay vì scale up (dọc). C sai, tránh kiến trúc nguyên khối. D không phải nguyên tắc kiến trúc.", "9-33": "CloudTrail liên tục ghi lại hoạt động tài khoản (thao tác trên Console, SDK, CLI) để kiểm toán rủi ro. CloudWatch giám sát hiệu năng. Config theo dõi cấu hình. AWS Health báo sự kiện dịch vụ.", "9-34": "AWS Artifact cung cấp tài liệu bảo mật và tuân thủ của AWS theo yêu cầu (SOC, ISO, PCI). Certificate Manager quản lý chứng chỉ SSL, Trusted Advisor đưa khuyến nghị, Organizations quản lý nhiều tài khoản.", "9-35": "Lợi ích tài chính: giảm TCO (A) và giảm chi phí vận hành (C), vì không phải tự vận hành data center. B sai, AWS giảm CapEx. D và E sai, AWS không cho startup trả chậm hay vay tín dụng.", "9-36": "Amazon S3 phục vụ được website tĩnh (HTML, CSS, JS, ảnh). Route 53 là DNS (trỏ tên miền tới website nhưng không lưu nội dung), QuickSight là BI, X-Ray truy vết.", "9-37": "Với khách hàng ở nhiều nước: triển khai ở nhiều Region để giảm độ trễ (A), và CloudFront có nhiều edge location trên thế giới (C). B sai, Translate không tự dịch website bên thứ ba. D, Comprehend phân tích văn bản, không phải lợi ích về hạ tầng. E sai, ELB chỉ hoạt động trong một Region.", "9-38": "Thành phần chính của hạ tầng toàn cầu: Region và Availability Zone (cùng edge location). Resource Groups, Security Groups và AMI là tính năng hay tài nguyên, không phải thành phần hạ tầng.", "9-39": "Mã hoá dữ liệu là trách nhiệm của khách hàng. Kiểm soát truy cập vật lý, huỷ thiết bị lưu trữ an toàn và quản lý rủi ro môi trường là của AWS.", "9-40": "Tạo AWS Organization từ tài khoản thanh toán (payer account) rồi mời các tài khoản khác tham gia, như vậy là bật được consolidated billing. Budgets chỉ đặt ngân sách. Support không gộp hoá đơn. D phức tạp và không gộp hoá đơn thật.", "9-41": "So sánh TCO cần tính chi phí bảo mật data center (an ninh, nhân viên bảo vệ). Quản lý dự án, bản quyền antivirus và phát triển phần mềm như nhau dù on-prem hay AWS nên không đưa vào so sánh hạ tầng.", "9-42": "Dịch vụ được quản lý như ElastiCache, RDS giúp đơn giản hoá việc vá và cập nhật hệ điều hành bên dưới vì AWS lo. A sai, AWS tự thay instance lỗi. B, hiệu năng không chắc tốt hơn. D sai, bạn vẫn phải chọn loại và cỡ instance phù hợp.", "9-43": "Route 53 (DNS cho cả tài nguyên AWS và on-prem) và Virtual Private Gateway (cổng VPN nối on-prem với VPC) dùng được trong kiến trúc hybrid. Classic Load Balancer và Auto Scaling hoạt động trong AWS. CloudWatch default metrics chỉ có cho tài nguyên AWS (on-prem cần agent).", "9-44": "Elastic Load Balancing phân phối lưu lượng ứng dụng đến cho một hoặc nhiều EC2. A là Route 53 (DNS). C là CloudWatch. D là Auto Scaling.", "9-45": "DynamoDB là CSDL NoSQL nhanh, đáng tin cậy. Redshift là kho dữ liệu, RDS là CSDL quan hệ, S3 là object storage.", "9-46": "AWS Artifact cung cấp báo cáo và chứng nhận tuân thủ. Lambda chạy code. Inspector quét lỗ hổng. Certificate Manager cấp chứng chỉ SSL/TLS (không phải chứng nhận tuân thủ, đừng nhầm vì cùng chữ «certificate»).", "9-47": "Route 53 và CloudFront là dịch vụ toàn cầu (global), cùng với IAM và WAF cho CloudFront. EC2, DynamoDB là dịch vụ theo Region. S3 tạo bucket theo Region dù tên bucket là duy nhất toàn cầu.", "9-48": "Gắn IAM policy vào IAM group, thì mọi user trong nhóm cùng nhận quyền, dễ quản lý cho nhiều người. C làm được nhưng khó quản lý. Role dùng cho quyền tạm thời. Cognito dành cho người dùng ứng dụng, không phải nhân viên.", "9-49": "Dùng nhiều Availability Zone là nguyên tắc thiết kế quan trọng để tăng sẵn sàng và chịu lỗi. B sai, nên liên kết lỏng. C không phải nguyên tắc kiến trúc. D sai, nên dùng co giãn thay vì cấp dư.", "9-50": "AWS Organizations (với consolidated billing) gộp mức dùng của nhiều tài khoản để được giảm giá theo khối lượng. Server Migration Service di chuyển máy chủ, Budgets đặt ngân sách, Trusted Advisor đưa khuyến nghị.", "10-1": "Tạo cụm RDS mới bằng CloudFormation (template) hoặc Management Console. Concierge lo hoá đơn, S3 là lưu trữ, Auto Scaling thêm bớt EC2.", "10-2": "3 năm, trả trước toàn bộ, Standard RI giảm giá nhiều nhất. Quy tắc: 3 năm hơn 1 năm, All Upfront hơn Partial hơn No Upfront, Standard hơn Convertible.", "10-3": "CloudWatch Logs giám sát log theo thời gian thực (D) và cho phép tùy chỉnh thời gian lưu giữ log (E). Không miễn phí hoàn toàn (tính phí lưu trữ, nạp log). Không có phân tích Elasticsearch miễn phí hay bản tóm tắt qua SNS.", "10-4": "Lambda là dịch vụ tính toán được AWS quản lý hoàn toàn (serverless). EC2 thì bạn tự quản lý OS. SWF là dịch vụ điều phối workflow. Aurora là CSDL.", "10-5": "Lambda cho phép chạy code mà không cần máy chủ, giảm hạ tầng tính toán vật lý mà developer phải quản lý. EC2 là máy chủ ảo. DynamoDB là CSDL (cũng serverless nhưng không chạy code). CodeCommit lưu mã nguồn.", "10-6": "Vá EC2 (OS và phần mềm trên đó) là trách nhiệm của khách hàng. Vá hạ tầng bên dưới, an ninh vật lý và vá hạ tầng mạng là của AWS.", "10-7": "Quản lý cấu hình là kiểm soát chung: AWS cấu hình thiết bị hạ tầng, khách hàng cấu hình OS, CSDL, ứng dụng của mình.", "10-8": "Amazon Macie dùng học máy tự động nhận diện và phân loại dữ liệu nhạy cảm (thông tin cá nhân, sở hữu trí tuệ) trên S3. GuardDuty phát hiện mối đe doạ, Inspector quét lỗ hổng, Shield chống DDoS.", "10-9": "Mô hình giá AWS là trả theo mức dùng (pay-as-you-go) và chi phí biến đổi (variable cost). Fixed-term và planned mô tả mô hình truyền thống. Colocation là thuê chỗ đặt máy chủ ở data center.", "10-10": "Khách hàng đảm bảo dữ liệu ứng dụng được mã hoá khi lưu trữ (A) và người dùng của mình được đào tạo bảo mật khi dùng AWS (C). Máy chủ NTP của AWS, hạn chế truy cập data center và huỷ phần cứng là việc của AWS.", "10-11": "Dùng consolidated billing của AWS Organizations để gộp mức dùng và hưởng giảm giá theo khối lượng mà không phải di chuyển tài nguyên. A ảnh hưởng lớn tới tài nguyên. B không giải quyết việc gộp. D, gói Enterprise không tặng giảm giá khối lượng.", "10-12": "All Upfront Reserved Instance 3 năm cho mức giảm giá lớn nhất so với On-Demand: thời hạn dài nhất và trả trước toàn bộ.", "10-13": "Dữ liệu đọc ghi thay đổi liên tục thì dùng RDS (CSDL) và EFS (file system dùng chung). Glacier dùng lưu trữ dài hạn. Snowball chuyển dữ liệu offline. Redshift tối ưu cho phân tích, không cho ghi liên tục.", "10-14": "AWS Config ghi lại lịch sử cấu hình tài nguyên, cho biết tài nguyên đã thay đổi gì theo thời gian. Inspector quét lỗ hổng, Service Catalog là danh mục sản phẩm, IAM quản lý quyền.", "10-15": "Best practice là dùng các thành phần liên kết lỏng (loosely coupled). Liên kết chặt khiến một phần lỗi kéo theo phần khác. «Infrequently» và «frequently coupled» không phải thuật ngữ chuẩn.", "10-16": "Gói Business có hỗ trợ 24/7 qua chat và điện thoại (A), và số case cũng như số người liên hệ không giới hạn (C). TAM riêng, phản hồi 15 phút và review vận hành hằng năm thuộc gói Enterprise.", "10-17": "Route 53 là dịch vụ DNS do AWS quản lý. Neptune là CSDL đồ thị, SageMaker là ML, Lightsail là máy chủ ảo đơn giản.", "10-18": "Yêu cầu chạy trên máy chủ vật lý riêng và quản lý bản quyền phần mềm (theo socket, core) thì chọn Dedicated Host. Dedicated Instance không cho thấy, kiểm soát máy chủ vật lý cụ thể để quản lý bản quyền.", "10-19": "Convertible RI cho phép đổi thuộc tính (dòng máy, OS, tenancy) miễn là RI mới có giá trị bằng hoặc lớn hơn. Standard RI không đổi được dòng máy. Scheduled RI đã ngừng. Dedicated RI không phải loại RI.", "10-20": "ElastiCache lưu kết quả truy vấn hay dùng trong RAM, giảm tải truy cập CSDL. Machine Learning là dịch vụ ML (cũ), SQS là hàng đợi, Instance Store là ổ tạm của một EC2.", "10-21": "Spot phù hợp với ứng dụng không phải production như dev, test (A), và ứng dụng chịu lỗi, linh hoạt (D) vì có thể bị thu hồi. Không dùng cho workload có trạng thái, ứng dụng không được gián đoạn, hay CSDL nhạy cảm.", "10-22": "Công cụ ước tính chi phí theo đề: cost allocation tags (phân tích chi phí theo nhóm), Simple Monthly Calculator và TCO Calculator. Lưu ý: Simple Monthly Calculator nay đã được thay bằng AWS Pricing Calculator, và TCO Calculator nay là Migration Evaluator. «Cost Estimator» không tồn tại. Detailed billing report là báo cáo chi phí đã phát sinh (nay là Cost and Usage Report).", "10-23": "EC2 Auto Scaling tự động thêm hoặc bớt EC2 theo nhu cầu. ELB chia tải, Route 53 là DNS, CloudFront là CDN.", "10-24": "Infrastructure Event Management miễn phí từ gói Enterprise (và Enterprise On-Ramp). Gói Business phải trả thêm phí. Developer và Basic không có.", "10-25": "Access key dùng để gọi AWS bằng chương trình (CLI, SDK, API). Đăng nhập Console dùng mật khẩu. Đăng nhập EC2 dùng key pair. CodeCommit dùng thông tin Git hoặc SSH key riêng.", "10-26": "Amazon Athena truy vấn trực tiếp dữ liệu trong S3 bằng SQL chuẩn, serverless. Glue là ETL, Data Pipeline chuyển dữ liệu, CloudSearch là dịch vụ tìm kiếm.", "10-27": "AWS rút ngắn thời gian cấp phát tài nguyên IT nhờ khả năng tạo tài nguyên bằng chương trình (API, CLI, IaC) trong vài phút. Các đáp án khác không phải cách AWS hoạt động.", "10-28": "CloudTrail (ghi lại ai làm gì qua API) và CloudWatch (log, số liệu, sự kiện) thu thập thông tin về hoạt động tài khoản. CloudFront là CDN, Cloud9 là IDE, CloudHSM lưu khoá mã hoá.", "10-29": "S3 là kho lưu object (B) và hệ thống lưu trữ có độ bền cao (E). S3 không phải file system (toàn cầu, cục bộ hay mạng). Đó là EFS hoặc FSx.", "10-30": "TCO Calculator (nay là Migration Evaluator) cho thấy khoản tiết kiệm có thể đạt được khi chuyển từ on-prem lên AWS. Budgets và Cost Explorer dùng cho chi phí AWS đã có. Well-Architected Tool đánh giá kiến trúc.", "10-31": "Lambda thuộc nhóm nền tảng serverless. EMR và ELB dựa trên máy chủ, và EMR bạn phải quản lý cụm. Mobile Hub là dịch vụ cũ, đã được thay bằng Amplify.", "10-32": "Cost allocation tags giúp theo dõi và phân loại chi tiêu ở mức chi tiết (theo dự án, phòng ban, môi trường). Consolidated billing gộp hoá đơn. Budgets đặt ngân sách. Marketplace bán phần mềm.", "10-33": "Trusted Advisor kiểm tra môi trường AWS để tìm cơ hội tiết kiệm chi phí và cải thiện hiệu năng (cùng bảo mật, chịu lỗi, giới hạn dịch vụ). Cost Explorer chỉ xem chi phí, không đề xuất cải thiện hiệu năng.", "10-34": "EC2 trên AWS truy cập ứng dụng cũ ở data center công ty, tức là kiến trúc hybrid (kết hợp cloud và on-prem). Cloud-native là chạy hoàn toàn trên cloud. IaaS là mô hình dịch vụ.", "10-35": "Auto Scaling cho phép năng lực tính toán tự điều chỉnh theo tải. Load balancing chia tải. Automatic failover chuyển sang dự phòng khi lỗi. Round robin là thuật toán chia tải lần lượt.", "10-36": "DynamoDB là CSDL NoSQL được quản lý. Redshift là kho dữ liệu. Aurora và RDS for MariaDB là CSDL quan hệ.", "10-37": "Region chứa nhiều Availability Zone. Edge location tách biệt, không nằm trong AZ. Data center nằm trong AZ, không chứa Region.", "10-38": "Chuyển mã nhiều file video riêng lẻ thì chạy nhiều instance song song, nhanh và tận dụng tính co giãn (có thể dùng Spot). Một máy lớn hay phần cứng riêng chậm hơn và không theo nguyên tắc kiến trúc cloud.", "10-39": "SQL Server chạy được trên EC2 (tự cài) hoặc RDS for SQL Server. Aurora chỉ tương thích MySQL, PostgreSQL. Redshift là kho dữ liệu. S3 là object storage.", "10-40": "Access key cho phép developer truy cập dịch vụ AWS qua CLI. User name và password dùng cho Console. SSH key dùng vào EC2. «API keys» không phải tính năng của IAM (đó là của API Gateway).", "10-41": "Khách hàng hoàn toàn chịu trách nhiệm triển khai kiểm soát định tuyến lưu lượng ứng dụng (route table, security group, load balancer). Vá và bảo trì hạ tầng, kiểm soát vật lý và môi trường là của AWS.", "10-42": "TAM (Technical Account Manager) riêng chỉ có ở gói Enterprise. Enterprise On-Ramp có một nhóm TAM dùng chung. Business, Developer, Basic không có TAM.", "10-43": "Rekognition tự động nhận diện đối tượng trong ảnh, tiết kiệm thời gian so với gắn nhãn thủ công. Nó không đóng dấu ảnh, không đổi kích thước ảnh, và không dùng Mechanical Turk.", "10-44": "Đáp án theo đề là Auto Scaling: tự tăng giảm tài nguyên mà không cần lên kế hoạch dung lượng. Lưu ý: Lambda cũng tự mở rộng mà không cần lên kế hoạch dung lượng, nên câu này có thể gây tranh cãi. Redshift và CloudTrail không liên quan.", "10-45": "RDS so với quản lý CSDL truyền thống: AWS lo bảo trì hệ điều hành (cùng vá CSDL, sao lưu). A sai, dữ liệu trong bảng là của khách hàng. C sai, không tự đổi cỡ instance. D sai, khách hàng tự chọn loại CSDL.", "10-46": "Ứng dụng có thành phần phụ thuộc nhau khiến một phần lỗi làm sập cả ứng dụng, thì cần tách rời (decouple) các thành phần để mỗi phần vẫn hoạt động khi phần khác lỗi. Elasticity, chạy song song hay nhân đôi tài nguyên không giải quyết sự phụ thuộc.", "10-47": "Không có chuyên môn kỹ thuật AWS trong công ty thì thuê APN Consulting Partners (công ty tư vấn, triển khai). Technology Partners bán sản phẩm phần mềm. Marketplace là chợ phần mềm. Service Catalog là danh mục sản phẩm nội bộ.", "10-48": "S3 lưu object, truy cập theo thời gian thực, có versioning và lifecycle policy. Glacier không truy cập tức thì (lớp cổ điển). Storage Gateway dùng cho hybrid. EBS là ổ đĩa khối.", "10-49": "Phân bố workload trên nhiều AZ là thực hiện nguyên tắc «thiết kế cho lỗi» (design for failure): một AZ hỏng thì AZ khác chạy tiếp. Automation, agility và elasticity là nguyên tắc khác.", "10-50": "AWS Organizations dùng để hợp nhất và quản lý tập trung nhiều tài khoản AWS. IAM quản lý quyền trong một tài khoản. SCT chuyển đổi schema CSDL. Config theo dõi cấu hình.", "11-1": "AWS giảm TCO chủ yếu nhờ loại bỏ các khoản đầu tư lớn ban đầu (CapEx) như mua máy chủ, xây data center. B sai, bạn vẫn lo bản quyền phần mềm bên thứ ba. C sai, vẫn có chi phí vận hành. D sai, AWS không quản lý ứng dụng của bạn.", "11-2": "Học về bảo mật có giảng viên: AWS Online Tech Talks (webinar do chuyên gia AWS trình bày) và AWS Classroom Training (lớp học có giảng viên). Trusted Advisor là công cụ, Blog và Forums là tài liệu tự đọc.", "11-3": "Tăng bảo mật khi đăng nhập Console: bật MFA (C) và đặt chính sách mật khẩu mạnh (E). Secrets Manager lưu mật khẩu ứng dụng, Certificate Manager quản lý chứng chỉ SSL, Security Group là tường lửa mạng, không liên quan đăng nhập Console.", "11-4": "Trong VPC Dashboard bạn cấu hình được Security Group và Subnet (cùng route table, gateway, NACL…). CloudFront, Route 53 và ELB có console riêng (ELB nằm ở EC2 console).", "11-5": "Kiểm toán an ninh vật lý (data center) hoàn toàn là trách nhiệm của AWS. IAM policy, bucket policy và log CloudTrail là thứ khách hàng tự cấu hình và kiểm tra.", "11-6": "Consolidated billing cho một hoá đơn cho nhiều tài khoản (A) và có thể được giảm giá theo khối lượng vì mức dùng của mọi tài khoản được cộng dồn (D). Không tự tăng service limit, không giảm giá cố định, không tự mở rộng gói support cho mọi tài khoản.", "11-7": "Với dịch vụ được quản lý như RDS, AWS lo vá phần mềm CSDL (A) và sao lưu CSDL (C), giải phóng nhân lực IT. Test ứng dụng, thiết kế schema và pen test vẫn là việc của khách hàng.", "11-8": "Chỉ cần bắt đầu tạo tài nguyên ở Region thứ hai, không cần ký hợp đồng mới hay tải gì. AZ không di chuyển được giữa các Region. Console là web, không cần tải về.", "11-9": "ELB xử lý được việc lưu lượng mạng thay đổi liên tục, tự mở rộng năng lực của chính nó và chia tải cho các target. (File gốc bị lỗi tách dòng các đáp án, mình đã sắp xếp lại cho đúng như Đề 20 câu 23.) ELB không chuyển đổi loại load balancer, không tự thêm EC2 (đó là Auto Scaling), và có tính phí.", "11-10": "Gói Business là mức thấp nhất có thời gian phản hồi mục tiêu 1 giờ (khi hệ thống production sập). Developer nhanh nhất là 12 giờ. Basic không có hỗ trợ kỹ thuật.", "11-11": "S3 là lựa chọn bền (11 số 9), giá thấp và lấy dữ liệu ngay lập tức. Glacier (bản cổ điển) mất vài phút đến vài giờ. EBS đắt hơn và gắn một EC2. Instance Store mất dữ liệu khi stop.", "11-12": "AWS Professional Services là đội tư vấn của AWS, hỗ trợ đẩy nhanh việc áp dụng cloud qua các hợp đồng trả phí ở nhiều mảng chuyên môn. Enterprise Support là gói hỗ trợ. Solutions Architect và Account Manager không bán dịch vụ tư vấn theo hợp đồng như vậy.", "11-13": "Cần hỗ trợ 24/7 qua điện thoại, email, chat và phản hồi dưới 1 giờ khi production gián đoạn, rẻ nhất thì chọn Business. Enterprise cũng đáp ứng nhưng đắt hơn.", "11-14": "AWS Config ghi lại lịch sử thay đổi cấu hình tài nguyên, dùng để kiểm toán quản lý thay đổi. Trusted Advisor đưa khuyến nghị, CloudWatch giám sát hiệu năng, Inspector quét lỗ hổng.", "11-15": "Trusted Advisor đưa danh sách khuyến nghị tối ưu chi phí theo mức dùng hiện tại (B) và phát hiện lỗ hổng bảo mật tiềm ẩn do cấu hình quyền (C, ví dụ bucket S3 công khai). Nó không quét lỗ hổng phần mềm (Inspector), không tự sửa lỗi, không cảnh báo EC2 bị xâm nhập (GuardDuty).", "11-16": "Amazon RDS là dịch vụ được quản lý để chạy CSDL. Batch chạy job, Artifact là báo cáo tuân thủ, Data Pipeline chuyển dữ liệu.", "11-17": "Access key ID và secret access key gắn với IAM user (và root user) để dùng CLI. Role dùng thông tin tạm thời. Group và policy không có thông tin đăng nhập.", "11-18": "Khách hàng chịu trách nhiệm mã hoá dữ liệu khi lưu trữ. Xoá sạch ổ đĩa, cập nhật firmware phần cứng và cáp mạng là việc của AWS.", "11-19": "Amazon EFS là hệ thống file dùng chung, đơn giản, mở rộng được, cho máy chủ Linux trên AWS và on-prem. S3 là object storage, Glacier là lưu trữ dài hạn, EBS gắn một EC2.", "11-20": "Truy cập bằng chương trình cần access key ID (A) và secret access key (C). Primary key, secondary key và user ID không phải thông tin xác thực của AWS.", "11-21": "Nâng cao nhận thức và đào tạo (awareness & training) là kiểm soát chung: AWS đào tạo nhân viên AWS, khách hàng đào tạo nhân viên của mình. A và B là việc của khách hàng. C là của AWS.", "11-22": "Instance store là lưu trữ tạm (ephemeral), dữ liệu bị xoá khi instance bị stop hoặc terminate. EBS, EFS và S3 đều lưu bền vững.", "11-23": "Consolidated billing giúp đủ điều kiện hưởng giá theo khối lượng. Nó không chia sẻ quyền truy cập, không tạo nhiều hoá đơn (ngược lại là một hoá đơn), và vẫn cần tag để phân bổ chi phí.", "11-24": "Step Functions, DynamoDB và SNS đều là serverless. Các lựa chọn khác đều có EC2 hoặc EMR (dựa trên máy chủ).", "11-25": "Dedicated Host cho phép dùng bản quyền phần mềm sẵn có gắn với máy chủ (server-bound, tính theo socket hoặc core). Spot, Reserved và On-Demand là cách tính tiền, chạy trên phần cứng dùng chung.", "11-26": "Bảo vệ truy cập tài khoản: cấp quyền tối thiểu cho IAM user (B) và bật MFA cho người dùng có đặc quyền (E). CloudTrail chỉ ghi log, không bảo vệ truy cập. C là vi phạm best practice. CloudFront là CDN.", "11-27": "CloudFormation quản lý hạ tầng dưới dạng code. CodePipeline là CI/CD, CodeDeploy triển khai ứng dụng, Direct Connect là đường truyền mạng.", "11-28": "Nhiều AZ giúp ứng dụng sẵn sàng cao hơn vì chịu được sự cố ở một AZ. A sai, thảm họa ảnh hưởng cả Region thì cần nhiều Region. C sai, các AZ chỉ cách nhau vài km. D, nhiều AZ không giảm độ trễ cho người dùng.", "11-29": "Aurora tương thích MySQL và dễ mở rộng (tự tăng dung lượng lưu trữ, có bản Serverless tự điều chỉnh năng lực). Redshift là kho dữ liệu, DynamoDB là NoSQL, ElastiCache là bộ nhớ đệm.", "11-30": "Liên kết lỏng là nguyên tắc thiết kế kiến trúc AWS Cloud. Điểm lỗi duy nhất và thiết kế nguyên khối là ngược best practice. Cloud ưu tiên scale ngang hơn scale dọc.", "11-31": "Concierge team (hỗ trợ hoá đơn và tài khoản) chỉ có ở gói Enterprise. Trusted Advisor (bản cơ bản) và support case có ở các gói khác. Amazon Connect là dịch vụ tổng đài.", "11-32": "Chuyển lên cloud đổi chi phí đầu tư lớn trả trước (CapEx) thành chi phí vận hành biến đổi (OpEx). Các lựa chọn khác đảo ngược hoặc sai bản chất.", "11-33": "Cần cách ly vật lý workload thì tính chi phí Dedicated Host (máy chủ vật lý riêng). Reserved, On-Demand và No Upfront RI là cách tính tiền trên phần cứng dùng chung.", "11-34": "Glacier dùng để lưu bản sao lưu dài hạn với chi phí thấp. RDS là CSDL, Snowball là thiết bị chuyển dữ liệu, EBS là ổ đĩa đắt hơn.", "11-35": "Gói Business là gói thấp nhất có hỗ trợ kỹ thuật qua điện thoại. Developer chỉ có email.", "11-36": "Spot Instance được giảm giá tới 90% so với On-Demand. Reserved giảm tới khoảng 72%. Dedicated Host là đắt nhất.", "11-37": "Phục vụ lượng lớn video trực tuyến với độ trễ thấp nhất: lưu video trên S3 và phân phối qua CloudFront. «appGateway» không tồn tại, EFS là file system, Glacier không truy cập ngay.", "11-38": "Edge location dùng để đưa nội dung tới gần người dùng (B) và giảm tải cho máy chủ gốc bằng cách cache phản hồi (D). Edge location không host ứng dụng, không chạy cache NoSQL (đó là ElastiCache), không gửi thông báo (đó là SNS).", "11-39": "TCO Calculator (nay là Migration Evaluator) đưa báo cáo chi tiết về khoản tiết kiệm ước tính sau khi chuyển lên AWS. Cost Explorer xem chi phí đã dùng, Budgets đặt ngân sách, Migration Hub theo dõi tiến độ di chuyển.", "11-40": "Personal Health Dashboard (nay là AWS Health Dashboard) cho góc nhìn cá nhân hoá về tình trạng các dịch vụ AWS đang chạy workload của bạn. Service Health Dashboard hiện tình trạng chung cho mọi người.", "11-41": "Lên cloud giúp doanh nghiệp tập trung vào hoạt động kinh doanh. A sai, vẫn có hoá đơn IT. B không hợp lý. D sai, vẫn phải vá máy chủ.", "11-42": "Gói Basic không có hỗ trợ kỹ thuật từ kỹ sư, nên hỏi qua diễn đàn thảo luận (nay là AWS re:Post). Senior Support Engineers và TAM cần gói cao hơn. Trusted Advisor là công cụ tự động.", "11-43": "Thảm họa ảnh hưởng cả một vùng địa lý thì cần triển khai trên nhiều Region. Nhiều AZ trong một Region vẫn có thể bị ảnh hưởng chung. Artifact là báo cáo tuân thủ, không lưu artifact ứng dụng.", "11-44": "Đảm bảo ổ EBS được sao lưu (tạo snapshot) là việc của khách hàng. Kết nối mạng từ AWS ra internet, vá hạ tầng và an ninh vật lý là của AWS.", "11-45": "Spot phù hợp với các job không thường xuyên và chịu được gián đoạn. Website chính, ứng dụng cần uptime 99.999% và CSDL dùng nhiều thì không được gián đoạn.", "11-46": "Chọn Region d
